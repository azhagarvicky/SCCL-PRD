ve LOS journey \u2013 open CR-13\">To be changed \u00b7 CR-13</a> <a class=\"todo-ref\" href=\"#CR-15\" onclick=\"var t=document.getElementById('CR-15');if(t){var d=t.closest('details');if(d)d.open=true;t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Defined in the PRD, not yet changed in the live LOS journey \u2013 open CR-15\">To be changed \u00b7 CR-15</a> <a class=\"todo-ref\" href=\"#CR-17\" onclick=\"var t=document.getElementById('CR-17');if(t){var d=t.closest('details');if(d)d.open=true;t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Defined in the PRD, not yet changed in the live LOS journey \u2013 open CR-17\">To be changed \u00b7 CR-17</a></p><p><b>Condition:</b> Always enabled.</p></div></td></tr>\n</tbody></table>\n<h2>Module 4 \u2013 Mutual Fund Portfolio Fetch (MF Central)</h2>\n<p class=\"screens\">Screen 05) LOS to MF Central Redirection consent page \u00b7 Screen 06) LOS to MF Central Redirection loading page</p>\n<table><thead><tr><th style=\"width:52px\">SL.No</th><th style=\"width:330px\">Screenshot</th><th style=\"width:190px\">Functionality</th><th>Description</th><th style=\"width:190px\">Data Points Required</th><th style=\"width:165px\">Status</th></tr></thead><tbody>\n<tr id=\"sl-5\"><td rowspan=\"4\" class=\"sl\">5</td><td class=\"shot\"><img src=\"prd-assets/screen-05.png\" alt=\"\"></td><td rowspan=\"4\">User giving consent to fetch the mutual fund portfolio from MF Central and clicking the \u201cCheck Credit Limit\u201d CTA</td><td><p>On successful PAN verification (Sl. No 4) the system shall navigate the customer to the Credit Limit Against Mutual Fund page. The PAN Number verified in Sl. No 4 is carried forward and displayed as a non editable field. The customer gives consent to fetch the mutual fund portfolio from MF Central and clicks Check Credit Limit; the customer is then redirected to MF Central, where the portfolio for the entered PAN and mobile number is fetched to determine the eligible credit limit and the loan offers. The left side of the page shows the loan highlights and the \u201cHow it works\u201d steps (display only). The top navigation (Credit Score and Profile icons) is described in Sl. No 6.</p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Header:</b> Top navigation \u2013 Shriram Credit logo (left); Credit Score icon and Profile icon (right) \u2013 see Sl. No 6</li><li><b>Left panel:</b> \u201cInterest rates starting from 10.5% p.a.*\u201d; \u201cGet a Loan up to 75% of your eligible Mutual Fund portfolio\u201d; \u201cInterest-only EMI payments\u201d; \u201cDisbursal in 2 hours post application\u201d</li><li><b>How it works:</b> \u201cHow it works\u201d \u2013 \u201cApply for loan within mins.\u201d with 9 steps:<ol><li>Check your eligibility, credit limit, and interest rates.</li><li>Select mutual fund units to pledge.</li><li>Complete your KYC verification.</li><li>Pledge your selected mutual fund units.</li><li>Your loan amount is approved, Sanction Letter with Key Fact Statement (KFS) is issued.</li><li>e-Sign the loan agreement.</li><li>Your loan account is ready to use.</li><li>Withdraw funds as needed.</li><li>Repay the loan at your convenience and regain complete control of your mutual fund holdings.</li></ol></li><li><b>Card title:</b> \u201cCredit Limit Against Mutual Fund\u201d</li><li><b>Sub text:</b> \u201cMutual fund will be fetched from MF Central to determine the eligible credit limit and best loan offers\u201d</li><li><b>Field label:</b> \u201cPAN Number\u201d</li><li><b>Consent checkbox text:</b> \u201cI authorize Shriram Credit to fetch my mutual fund portfolio holdings from MF Central to assess my eligibility and credit limit for a Loan Against Mutual Funds.\u201d</li><li><b>CTA:</b> \u201cCheck Credit Limit\u201d \u2013 grey until the consent is ticked, then yellow</li><li><b>Validation messages:</b> None on this page \u2013 the CTA stays grey until the consent is ticked</li></ul></div><div class=\"spec\"><p><b>Drop off:</b></p><ul class=\"content-list\"><li><b>When:</b> The customer leaves the journey on this page before clicking Check Credit Limit (e.g. closes the browser or tab)</li><li><b>On return:</b> When the customer comes back and logs in again with the mobile number (Sl. No 2) and OTP (Sl. No 3), on OTP verification success the customer lands on this page, with the PAN Number prefilled</li></ul></div></td><td rowspan=\"4\" class=\"dp\"><b>PAN Number:</b> ABCDE1234F (carried from Sl. No 4)<br><br><b>MF Central Consent:</b><ul><li>Yes</li><li>No</li></ul><br><b>Consent Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS<br><br><b>Check Credit Limit Clicked Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS</td><td rowspan=\"4\"><span class=\"tag wip\">WIP</span></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f05-pan.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> PAN Number</p><p><b>Field Type:</b> Display field</p><p><b>Prefilled Value:</b> PAN Number verified in Sl. No 4, shown with spaces as ABCDE 1234 F</p><p><b>Action:</b> Display only, not editable</p></div></td></tr>\n<tr><td class=\"shot\"><figure class=\"state\"><img src=\"prd-assets/f05-consent.png\" alt=\"\"><figcaption>Before \u2013 unticked (default)</figcaption></figure><figure class=\"state\"><img src=\"prd-assets/f05-consent-ticked.png\" alt=\"\"><figcaption>After \u2013 ticked</figcaption></figure></td><td><div class=\"spec\"><p><b>Field Name:</b> (Checkbox) MF Central consent</p><p><b>Field Type:</b> Check box</p><p><b>Action:</b> User has to tick this checkbox to authorize Shriram Credit to fetch the mutual fund portfolio holdings from MF Central to assess the eligibility and credit limit for a Loan Against Mutual Funds.</p><p><b>Condition:</b> Unticked by default. Check Credit Limit CTA is enabled only when this checkbox is ticked, so no validation is shown for the checkbox.</p></div></td></tr>\n<tr><td class=\"shot\"><figure class=\"state\"><img src=\"prd-assets/f05-cta.png\" alt=\"\"><figcaption>Before \u2013 disabled (grey) until the consent is ticked</figcaption></figure><figure class=\"state\"><img src=\"prd-assets/f05-cta-enabled.png\" alt=\"\"><figcaption>After \u2013 enabled once the consent is ticked</figcaption></figure></td><td><div class=\"spec\"><p><b>Field Name:</b> Check Credit Limit</p><p><b>Field Type:</b> CTA (Button)</p><p><b>Action:</b> On click, the system shall record the MF Central consent and open the MF Central redirection pop up (Sl. No 7); after the 5 second countdown the customer is redirected to MF Central to fetch the mutual fund portfolio for the entered PAN Number and mobile number.</p><p><b>Condition:</b> CTA is disabled (grey) and cannot be clicked until the consent checkbox is ticked, so no validation is shown.</p></div></td></tr>\n<tr id=\"sl-7\"><td rowspan=\"6\" class=\"sl\">7</td><td class=\"shot\"><img src=\"prd-assets/f07-redirect.png\" alt=\"\"></td><td rowspan=\"6\">MF Central redirection pop up after clicking \u201cCheck Credit Limit\u201d \u2013 countdown, then redirect to MF Central</td><td><p>On clicking Check Credit Limit (Sl. No 5) the system shall open the MF Central redirection pop up over the page. The pop up counts down from 5 seconds to 1 second (\u201cRedirecting to MF Central in 5 seconds\u201d \u2026 \u201c1 seconds\u201d) while the progress bar fills; when the countdown ends, MF Central checks the PAN and mobile number combination: if data is available the customer is redirected to MF Central (Sl. No 8), otherwise the \u201cisn\u2019t linked to the PAN\u201d page is shown (Sl. No 12). If the customer clicks the close icon, a confirmation pop up asks whether to cancel the portfolio fetch.</p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Logo:</b> MF Central logo</li><li><b>Countdown:</b> \u201cRedirecting to MF Central in N seconds\u201d \u2013 N counts down 5, 4, 3, 2, 1; a yellow progress bar fills as it counts</li><li><b>Heading:</b> \u201cHere\u2019s what you need to do\u201d</li><li><b>Steps:</b> <ol><li>Enter the 6-digit OTP received from MF Central on your mobile number.</li><li>Select all the AMCs and continue</li></ol></li><li><b>Note:</b> \u201cNote You\u2019ll return to the process automatically after completing this step.\u201d</li><li><b>Close icon:</b> (X) at the top right</li><li><b>Cancel confirmation pop up:</b> \u201cAre you sure you want to cancel your mutual fund portfolio fetch?\u201d with \u201cNo, don\u2019t\u201d and \u201cYes, cancel\u201d</li></ul></div></td><td rowspan=\"6\" class=\"dp\"><b>Redirection Pop up Shown Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS<br><br><b>Cancel Clicked:</b><ul><li>Yes, cancel</li><li>No, don\u2019t</li></ul><br><b>Cancel Clicked Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS<br><br><b>Redirected to MF Central Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS</td><td rowspan=\"6\"><span class=\"tag wip\">WIP</span></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f07-countdown.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Redirection countdown</p><p><b>Field Type:</b> Timer with progress bar</p><p><b>Action:</b> Starts at 5 seconds and counts down to 1 second; when it ends the customer is redirected to the MF Central page automatically.</p><p><b>Condition:</b> The countdown stops while the cancel confirmation pop up is open.</p></div></td></tr>\n<tr><td class=\"shot\"><img class=\"icon\" src=\"prd-assets/f07-close.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> (X) Close icon</p><p><b>Field Type:</b> Icon</p><p><b>Action:</b> On click, the system shall open the cancel confirmation pop up.</p></div></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f07-cancel.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Cancel confirmation pop up</p><p><b>Field Type:</b> Pop up</p><p><b>Action:</b> Shows \u201cAre you sure you want to cancel your mutual fund portfolio fetch?\u201d with two CTAs: \u201cNo, don\u2019t\u201d and \u201cYes, cancel\u201d.</p></div></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f07-no.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> No, don\u2019t</p><p><b>Field Type:</b> CTA (text button)</p><p><b>Action:</b> On click, the confirmation pop up closes and the redirection pop up continues, with the countdown starting again from 5 seconds.</p></div></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f07-yes.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Yes, cancel</p><p><b>Field Type:</b> CTA (Button)</p><p><b>Action:</b> On click, both pop ups close, the portfolio fetch is cancelled and the customer is back on the LOS to MF Central consent page (Sl. No 5).</p></div></td></tr>\n</tbody></table>\n<h2>Module 5 \u2013 Mutual Fund Portfolio Fetching</h2>\n<p class=\"screens\">MF Central pages (owned by MF Central \u2013 LOS has no access; issues raised to MF Central by mail): Screen 07.2) OTP \u00b7 07.3) Select AMCs \u00b7 07.4) Portfolio Fetching \u00b7 07.5) Portfolio Discovery Complete \u00b7 LOS page: Screen 07.1) PAN and Mobile Number Combination No Data Available</p>\n<table><thead><tr><th style=\"width:52px\">SL.No</th><th style=\"width:330px\">Screenshot</th><th style=\"width:190px\">Functionality</th><th>Description</th><th style=\"width:190px\">Data Points Required</th><th style=\"width:165px\">Status</th></tr></thead><tbody>\n<tr id=\"sl-8\"><td rowspan=\"4\" class=\"sl\">8</td><td class=\"shot\"><img src=\"prd-assets/screen-08.png\" alt=\"\"></td><td rowspan=\"4\">User entering the 6-digit OTP received from MF Central and clicking \u201cAuthenticate with OTP\u201d</td><td><p>After the redirection countdown (Sl. No 7), when MF Central has data for the PAN and mobile number combination, the customer is taken to the MF Central page (outside the LOS). MF Central sends a 6-digit OTP to the mobile number; the customer enters it and clicks Authenticate with OTP to authorise sharing of the mutual fund portfolio for Loan Against Mutual Funds. <b>MF Central page:</b> this page is owned and run by MF Central, outside the LOS \u2013 the LOS redirects the customer to MF Central and MF Central redirects the customer back to the LOS when its process is complete. The LOS has no access to change it; any functional issue on this page is raised to MF Central by mail.</p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Logo:</b> MF Central logo</li><li><b>Usecase card:</b> \u201cUsecase: Loan Against Mutual Funds\u201d; \u201cBy authenticating, you authorize requesting platform registered with SEBI/RBI to securely access your mutual fund portfolio data from MF Central for Loan Against Mutual Funds\u201d</li><li><b>OTP label:</b> \u201cEnter your 6-digit OTP\u201d</li><li><b>OTP boxes:</b> 6 boxes; the digits are masked as dots</li><li><b>CTA:</b> \u201cAuthenticate with OTP\u201d \u2013 light until all 6 digits are entered, then dark</li><li><b>Security card:</b> \u201cSecure Authentication for Portfolio Access\u201d: We do not store your OTP or sensitive credentials; Data is end to end encrypted and securely shared only on authentication of OTP by Investor; Access is limited to Personal Finance Management only; Consent artifact is valid for one time data sharing; MF Central follows an every time consent model for sharing the data</li></ul></div></td><td rowspan=\"4\" class=\"dp\"><b>MF Central OTP Authenticated Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS<br><br><b>MF Central OTP Status:</b><ul><li>Success</li><li>Failure</li></ul></td><td rowspan=\"4\"><span class=\"tag wip\">WIP</span></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f08-usecase.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Usecase card</p><p><b>Field Type:</b> Display</p><p><b>Action:</b> Shows the use case (Loan Against Mutual Funds) and the authorisation text \u2013 display only.</p></div></td></tr>\n<tr><td class=\"shot\"><figure class=\"state\"><img src=\"prd-assets/f08-otp.png\" alt=\"\"><figcaption>Before \u2013 empty</figcaption></figure><figure class=\"state\"><img src=\"prd-assets/f08-otp-filled.png\" alt=\"\"><figcaption>After \u2013 6 digits entered, shown as dots</figcaption></figure></td><td><div class=\"spec\"><p><b>Field Name:</b> Enter your 6-digit OTP</p><p><b>Field Type:</b> OTP field (6 boxes)</p><p><b>Minimum Character:</b> 6 Char</p><p><b>Maximum Character:</b> 6 Char</p><p><b>Input Value format:</b> Numeric, masked</p><p><b>Action:</b> User has to enter the 6-digit OTP received from MF Central on the mobile number.</p><p><b>Validation:</b> Wrong OTP handling is done by MF Central (not controlled by the LOS).</p></div></td></tr>\n<tr><td class=\"shot\"><figure class=\"state\"><img src=\"prd-assets/f08-auth.png\" alt=\"\"><figcaption>Before \u2013 light, until 6 digits are entered</figcaption></figure><figure class=\"state\"><img src=\"prd-assets/f08-auth-enabled.png\" alt=\"\"><figcaption>After \u2013 enabled once 6 digits are entered</figcaption></figure></td><td><div class=\"spec\"><p><b>Field Name:</b> Authenticate with OTP</p><p><b>Field Type:</b> CTA (Button)</p><p><b>Action:</b> On click with the correct OTP, the customer moves to Select AMCs (Sl. No 9).</p><p><b>Condition:</b> Enabled only when all 6 digits are entered.</p></div></td></tr>\n<tr id=\"sl-9\"><td rowspan=\"4\" class=\"sl\">9</td><td class=\"shot\"><img src=\"prd-assets/screen-10.png\" alt=\"\"></td><td rowspan=\"4\">User selecting the AMCs whose mutual funds are to be fetched and clicking \u201cContinue to Portfolio Import\u201d</td><td><p>MF Central lists every AMC in which the customer holds mutual funds, with the market value of the holding. The customer selects the AMCs to share; only the funds of the selected AMCs are fetched \u2013 funds of AMCs that are not selected are not fetched. <b>MF Central page:</b> this page is owned and run by MF Central, outside the LOS \u2013 the LOS redirects the customer to MF Central and MF Central redirects the customer back to the LOS when its process is complete. The LOS has no access to change it; any functional issue on this page is raised to MF Central by mail.</p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Logo:</b> MF Central logo</li><li><b>Usecase:</b> \u201cUsecase: Loan Against Mutual Funds\u201d</li><li><b>Title:</b> \u201cSelect AMCs for Loan Assessment\u201d</li><li><b>Select all:</b> \u201cSelect All AMCs\u201d checkbox</li><li><b>AMC list:</b> One row per AMC: checkbox, AMC logo, AMC name (e.g. DSP Mutual Fund, HDFC Mutual Fund, PPFAS Mutual Fund, Shriram Mutual Fund) and \u201cMARKET VALUE\u201d (e.g. \u20b920,008.48)</li><li><b>CTA:</b> \u201cContinue to Portfolio Import\u201d \u2013 grey until at least one AMC is selected</li></ul></div></td><td rowspan=\"4\" class=\"dp\"><b>AMCs Listed:</b> names and market values shown<br><br><b>AMCs Selected:</b> names of the selected AMCs<br><br><b>Continue Clicked Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS</td><td rowspan=\"4\"><span class=\"tag wip\">WIP</span></td></tr>\n<tr><td class=\"shot\"><figure class=\"state\"><img src=\"prd-assets/f10-selectall.png\" alt=\"\"><figcaption>Before \u2013 unticked</figcaption></figure><figure class=\"state\"><img src=\"prd-assets/f10-selectall-ticked.png\" alt=\"\"><figcaption>After \u2013 ticked</figcaption></figure></td><td><div class=\"spec\"><p><b>Field Name:</b> Select All AMCs</p><p><b>Field Type:</b> Check box</p><p><b>Action:</b> Ticking selects every AMC in the list; unticking clears them all.</p><p><b>Condition:</b> Ticked automatically when every AMC is selected one by one; unticked when any AMC is unselected.</p></div></td></tr>\n<tr><td class=\"shot\"><figure class=\"state\"><img src=\"prd-assets/f10-amc.png\" alt=\"\"><figcaption>Before \u2013 not selected</figcaption></figure><figure class=\"state\"><img src=\"prd-assets/f10-amc-ticked.png\" alt=\"\"><figcaption>After \u2013 selected (row highlighted)</figcaption></figure></td><td><div class=\"spec\"><p><b>Field Name:</b> AMC row</p><p><b>Field Type:</b> Check box with AMC logo, name and market value</p><p><b>Action:</b> User ticks each AMC whose funds are to be fetched.</p><p><b>Condition:</b> Only the selected AMCs\u2019 funds are fetched; unselected AMCs\u2019 funds are not fetched.</p></div></td></tr>\n<tr><td class=\"shot\"><figure class=\"state\"><img src=\"prd-assets/f10-cta.png\" alt=\"\"><figcaption>Before \u2013 disabled (grey) until an AMC is selected</figcaption></figure><figure class=\"state\"><img src=\"prd-assets/f10-cta-enabled.png\" alt=\"\"><figcaption>After \u2013 enabled</figcaption></figure></td><td><div class=\"spec\"><p><b>Field Name:</b> Continue to Portfolio Import</p><p><b>Field Type:</b> CTA (Button)</p><p><b>Action:</b> On click, MF Central starts fetching the portfolio of the selected AMCs (Sl. No 10).</p><p><b>Condition:</b> Disabled until at least one AMC is selected.</p></div></td></tr>\n<tr id=\"sl-10\"><td rowspan=\"3\" class=\"sl\">10</td><td class=\"shot\"><img src=\"prd-assets/screen-10-fetch.png\" alt=\"\"></td><td rowspan=\"3\">MF Central fetching the mutual fund portfolio of the selected AMCs</td><td><p>After Continue to Portfolio Import, MF Central shows the Fetching Your Portfolio screen while it connects and fetches the portfolio of the selected AMCs. No action is needed from the customer; when the fetch is complete the Portfolio Discovery Complete screen is shown (Sl. No 11). <b>MF Central page:</b> this page is owned and run by MF Central, outside the LOS \u2013 the LOS redirects the customer to MF Central and MF Central redirects the customer back to the LOS when its process is complete. The LOS has no access to change it; any functional issue on this page is raised to MF Central by mail.</p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Logo:</b> MF Central logo</li><li><b>Icon:</b> Portfolio icon with an arrow</li><li><b>Title:</b> \u201cFetching Your Portfolio...\u201d</li><li><b>Sub text:</b> \u201cConnecting to MF Central and fetching your investment data\u201d</li><li><b>Progress steps:</b> \u201cConnecting to MF Central\u201d (purple bar, loading icon) and \u201cFetching your portfolio\u201d (green bar, shield icon)</li><li><b>Status line:</b> \u201cProcessing portfolio data\u201d with three dots</li><li><b>Footer:</b> \u201c256-bit encryption\u201d \u00b7 \u201cISO 27001 compliant\u201d</li></ul></div></td><td rowspan=\"3\" class=\"dp\"><b>Portfolio Fetch Started Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS<br><br><b>Portfolio Fetch Status:</b><ul><li>Success</li><li>Failure</li></ul></td><td rowspan=\"3\"><span class=\"tag wip\">WIP</span></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f10-steps.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Progress steps</p><p><b>Field Type:</b> Progress bars</p><p><b>Action:</b> Shows the two steps \u2013 Connecting to MF Central, then Fetching your portfolio \u2013 as they progress; display only.</p><p><b>Condition:</b> Failure handling is done by MF Central (not controlled by the LOS).</p></div></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f10-processing.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Processing portfolio data</p><p><b>Field Type:</b> Status text</p><p><b>Action:</b> Display only, shown while the data is processed. When the fetch completes the customer moves to Sl. No 11 automatically.</p></div></td></tr>\n<tr id=\"sl-11\"><td rowspan=\"3\" class=\"sl\">11</td><td class=\"shot\"><img src=\"prd-assets/screen-11.png\" alt=\"\"></td><td rowspan=\"3\">Portfolio Discovery Complete \u2013 MF Central confirms the fetch and redirects the customer back to the LOS</td><td><p>When the portfolio is fetched, MF Central shows the Portfolio Discovery Complete screen and redirects the customer back to the LOS within 3 seconds (\u201cRedirecting in 3s\u201d counting down to 0s), to the MF Central to LOS Redirecting page (Screen 08). <b>MF Central page:</b> this page is owned and run by MF Central, outside the LOS \u2013 the LOS redirects the customer to MF Central and MF Central redirects the customer back to the LOS when its process is complete. The LOS has no access to change it; any functional issue on this page is raised to MF Central by mail.</p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Logo:</b> MF Central logo</li><li><b>Icon:</b> Green tick</li><li><b>Title:</b> \u201cPortfolio Discovery Complete!\u201d</li><li><b>Message:</b> \u201cYour mutual fund portfolio has been successfully fetched and will now be sent to the Requested Platform.\u201d</li><li><b>Status:</b> \u201cData fetched successfully\u201d \u2013 \u201cAll portfolio information secured\u201d</li><li><b>Redirect:</b> \u201cRedirecting in Ns\u201d with an arrow \u2013 N counts down from 3 to 0</li><li><b>Footer:</b> \u201c256-bit encryption\u201d \u00b7 \u201cISO 27001 compliant\u201d</li></ul></div></td><td rowspan=\"3\" class=\"dp\"><b>Portfolio Fetch Completed Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS<br><br><b>Redirected to LOS Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS</td><td rowspan=\"3\"><span class=\"tag wip\">WIP</span></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f12-status.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Data fetched successfully</p><p><b>Field Type:</b> Status banner</p><p><b>Action:</b> Confirms the portfolio was fetched \u2013 display only.</p></div></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f12-redirect.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Redirecting in Ns</p><p><b>Field Type:</b> Timer</p><p><b>Action:</b> Counts down from 3 seconds to 0; then the customer is redirected to the LOS (MF Central to LOS Redirecting page).</p></div></td></tr>\n<tr id=\"sl-12\"><td rowspan=\"4\" class=\"sl\">12</td><td class=\"shot\"><img src=\"prd-assets/screen-09.png\" alt=\"\"></td><td rowspan=\"4\">PAN and mobile number not linked \u2013 MF Central has no data for the combination</td><td><p>After the redirection countdown (Sl. No 7), when MF Central has no data for the PAN and mobile number combination, the customer is not taken to MF Central; a separate page is shown saying the mobile number is not linked to the PAN entered.</p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Header:</b> Top navigation \u2013 see Sl. No 6</li><li><b>Illustration:</b> Three cards with question marks</li><li><b>Message:</b> \u201cThe identifier below isn\u2019t linked to the PAN you entered\u201d</li><li><b>Mobile number:</b> Phone icon with the masked mobile number (e.g. +919XXXX1623)</li><li><b>CTA:</b> \u201cRefresh\u201d with the refresh icon</li></ul></div></td><td rowspan=\"4\" class=\"dp\"><b>Not Linked Page Shown Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS<br><br><b>Refresh Clicked:</b><ul><li>Yes</li><li>No</li></ul><br><b>Refresh Clicked Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS</td><td rowspan=\"4\"><span class=\"tag wip\">WIP</span></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f09-message.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Not linked message</p><p><b>Field Type:</b> Display text</p><p><b>Action:</b> \u201cThe identifier below isn\u2019t linked to the PAN you entered\u201d \u2013 display only.</p></div></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f09-mobile.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Mobile number</p><p><b>Field Type:</b> Display field</p><p><b>Prefilled Value:</b> Mobile number verified in Sl. No 2 and 3, masked as +91 + first digit + XXXX + last 4 digits</p><p><b>Action:</b> Display only, not editable</p></div></td></tr>\n<tr><td class=\"shot\"><img class=\"icon\" src=\"prd-assets/f09-refresh.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Refresh</p><p><b>Field Type:</b> CTA</p><p><b>Action:</b> On click, the MF Central fetch is tried again <a class=\"pend-ref\" href=\"#P-21\" onclick=\"var t=document.getElementById('P-21');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Open pending clarification P-21\">Pending \u00b7 P-21</a></p></div></td></tr>\n</tbody></table>\n<h2>Module 6 \u2013 Mutual Fund Portfolio Processing</h2>\n<p class=\"screens\">Screen 08) MF Central to LOS Redirecting Page \u00b7 09) Fetching Mutual Fund Portfolio \u00b7 10) Analysing Mutual Fund Portfolio \u00b7 11) Generating Loan Offers</p>\n<table><thead><tr><th style=\"width:52px\">SL.No</th><th style=\"width:330px\">Screenshot</th><th style=\"width:190px\">Functionality</th><th>Description</th><th style=\"width:190px\">Data Points Required</th><th style=\"width:165px\">Status</th></tr></thead><tbody>\n<tr id=\"sl-13\"><td class=\"sl\">13</td><td class=\"shot\"><img src=\"prd-assets/screen-13.png\" alt=\"\"></td><td>Customer returns from MF Central to the LOS \u2013 Redirecting to Dashboard</td><td><p>After MF Central redirects the customer back (Sl. No 11), the LOS shows the Redirecting to Dashboard screen. No action is needed from the customer; the Fetching Mutual Fund Portfolio screen opens automatically (Sl. No 14).</p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Header:</b> Top navigation \u2013 see Sl. No 6</li><li><b>Message:</b> \u201cRedirecting to Dashboard...\u201d</li></ul></div></td><td class=\"dp\"><b>Returned to LOS Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS</td><td><span class=\"tag wip\">WIP</span></td></tr>\n<tr id=\"sl-14\"><td class=\"sl\">14</td><td class=\"shot\"><img src=\"prd-assets/screen-14.png\" alt=\"\"></td><td>LOS fetching the mutual fund portfolio received from MF Central</td><td><p>The LOS shows a loader pop up over the Credit Limit Against Mutual Fund page while it fetches the mutual fund portfolio shared by MF Central. No action is needed from the customer; the next screen opens automatically (Sl. No 15).</p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Header:</b> Top navigation \u2013 see Sl. No 6</li><li><b>Loader:</b> Animated placeholder cards</li><li><b>Title:</b> \u201cFetching your mutual fund portfolio..\u201d</li><li><b>Sub text:</b> \u201cThis might take a min, thanks for your patience\u201d</li></ul></div></td><td class=\"dp\"><b>Portfolio Received in LOS Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS<br><br><b>Portfolio Fetch Status:</b><ul><li>Success</li><li>Failure</li></ul></td><td><span class=\"tag wip\">WIP</span></td></tr>\n<tr id=\"sl-15\"><td class=\"sl\">15</td><td class=\"shot\"><img src=\"prd-assets/screen-15.png\" alt=\"\"></td><td>LOS analysing the mutual fund portfolio</td><td><p>The LOS shows a loader pop up over the (blurred) Curated Offers page while it analyses the portfolio \u2013 eligible and non eligible funds and their values. No action is needed from the customer; the next screen opens automatically (Sl. No 16).</p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Header:</b> Top navigation \u2013 see Sl. No 6</li><li><b>Loader:</b> Animated placeholder cards</li><li><b>Title:</b> \u201cAnalyzing your mutual fund portfolio..\u201d</li><li><b>Sub text:</b> \u201cThis might take a min, thanks for your patience\u201d</li></ul></div></td><td class=\"dp\"><b>Portfolio Analysis Completed Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS</td><td><span class=\"tag wip\">WIP</span></td></tr>\n<tr id=\"sl-16\"><td class=\"sl\">16</td><td class=\"shot\"><img src=\"prd-assets/screen-16.png\" alt=\"\"></td><td>LOS generating the best loan offers</td><td><p>The LOS shows a loader pop up over the (blurred) Curated Offers page while it generates the loan offers from the analysed portfolio. No action is needed from the customer; the next screen opens automatically (the Curated Offers page).</p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Header:</b> Top navigation \u2013 see Sl. No 6</li><li><b>Loader:</b> Animated placeholder cards</li><li><b>Title:</b> \u201cGenerating best loan offers for you\u201d</li><li><b>Sub text:</b> \u201cThis might take a min, thanks for your patience\u201d</li></ul></div></td><td class=\"dp\"><b>Loan Offers Generated Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS</td><td><span class=\"tag wip\">WIP</span></td></tr>\n</tbody></table>\n<h2>Top Navigation</h2>\n<p class=\"screens\">Screen 04) Enter PAN Details \u2013 logo and Logout only (Sl. No 6.3) \u00b7 every page from Screen 05) LOS to MF Central Redirection consent page onwards \u2013 logo, Credit Score and Profile (Sl. No 6, 6.1, 6.2)</p>\n<table><thead><tr><th style=\"width:52px\">SL.No</th><th style=\"width:330px\">Screenshot</th><th style=\"width:190px\">Functionality</th><th>Description</th><th style=\"width:190px\">Data Points Required</th><th style=\"width:165px\">Status</th></tr></thead><tbody>\n<tr id=\"sl-6\"><td rowspan=\"4\" class=\"sl\">6</td><td class=\"shot\"><img src=\"prd-assets/f06-topnav.png\" alt=\"\"></td><td rowspan=\"4\">Top navigation shown on every page after PAN verification</td><td><p>The top navigation is shown at the top of every page from Sl. No 5 onwards and stays fixed when the page is scrolled (the PAN Details page has its own top navigation \u2013 see Sl. No 6.3). It gives the customer access to the credit score fetched from Experian and to the profile (with Logout) from any page.</p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Left:</b> Shriram Credit logo</li><li><b>Right:</b> Credit Score icon (Sl. No 6.1) and Profile icon (Sl. No 6.2)</li></ul></div></td><td rowspan=\"4\" class=\"dp\">Captured in Sl. No 6.1 and 6.2</td><td rowspan=\"4\"><span class=\"tag wip\">WIP</span></td></tr>\n<tr><td class=\"shot\"><img class=\"icon\" src=\"prd-assets/f06-logo.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Shriram Credit logo</p><p><b>Field Type:</b> Image (top navigation, left corner)</p><p><b>Action:</b> Display only.</p></div></td></tr>\n<tr><td class=\"shot\"><img class=\"icon\" src=\"prd-assets/f05-credit-icon.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Credit Score icon</p><p><b>Field Type:</b> Icon (top navigation, right corner)</p><p><b>Action:</b> On click, opens the credit score pop up \u2013 see Sl. No 6.1.</p></div></td></tr>\n<tr><td class=\"shot\"><img class=\"icon\" src=\"prd-assets/f05-profile-icon.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Profile icon</p><p><b>Field Type:</b> Icon (top navigation, right corner)</p><p><b>Action:</b> On click, opens the Profiles pop up \u2013 see Sl. No 6.2.</p></div></td></tr>\n<tr id=\"sl-6.1\"><td rowspan=\"4\" class=\"sl\">6.1</td><td class=\"shot\"><img src=\"prd-assets/f05-credit-report.png\" alt=\"\"></td><td rowspan=\"4\">User clicking the Credit Score icon in the top navigation to view the credit score</td><td><p>The Credit Score icon is part of the top navigation (Sl. No 6). On click, the system shall open the credit score pop up over the current page, showing the credit score fetched from Experian (Sl. No 3). The customer stays on the same page; closing the pop up returns to it. What the pop up shows when Experian returns no score (no credit history / no record found / Experian call failed) is to be confirmed <a class=\"pend-ref\" href=\"#P-20\" onclick=\"var t=document.getElementById('P-20');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Open pending clarification P-20\">Pending \u00b7 P-20</a></p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Title:</b> \u201cYour credit score as of DD MMM YYYY\u201d \u2013 the date the score was fetched (e.g. 07 Oct 2026)</li><li><b>Score meter:</b> The score on a 300 \u2013 900 meter (e.g. 790), with its category below it (e.g. \u201cVery Good\u201d); \u201c300\u201d and \u201c900\u201d at the ends</li><li><b>Category table:</b> <table class=\"mini\"><tr><th>Category</th><th>Score Range</th></tr><tr><td><i style=\"background:#1E8E3E\"></i>Excellent</td><td><b>826 - 900</b></td></tr><tr><td><i style=\"background:#34C759\"></i>Very Good</td><td><b>776 - 825</b></td></tr><tr><td><i style=\"background:#FFC107\"></i>Good</td><td><b>701 - 775</b></td></tr><tr><td><i style=\"background:#FF8C1A\"></i>Average</td><td><b>601 - 700</b></td></tr><tr><td><i style=\"background:#E02424\"></i>Needs Help</td><td><b>300 - 600</b></td></tr></table></li><li><b>Issue line:</b> \u201cIssue with your Credit Score? Raise an issue\u201d</li><li><b>Footer:</b> \u201cPowered by experian\u201d</li><li><b>Close icon:</b> (X) at the top right</li></ul></div></td><td rowspan=\"4\" class=\"dp\"><b>Credit Score Viewed:</b><ul><li>Yes</li><li>No</li></ul><br><b>Credit Score Viewed Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS</td><td rowspan=\"4\"><span class=\"tag wip\">WIP</span></td></tr>\n<tr><td class=\"shot\"><img class=\"icon\" src=\"prd-assets/f05-credit-icon.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Credit Score icon</p><p><b>Field Type:</b> Icon (top navigation, right corner)</p><p><b>Action:</b> On click, the system shall open the credit score pop up.</p></div></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f06-raise-issue.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Raise an issue</p><p><b>Field Type:</b> Hyperlink</p><p><b>Action:</b> Shown as \u201cIssue with your Credit Score? Raise an issue\u201d. On click, the system shall open https://www.experian.com/help/dispute-credit/ in a new tab; the pop up stays open.</p></div></td></tr>\n<tr><td class=\"shot\"><img class=\"icon\" src=\"prd-assets/f06-close-credit.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> (X) Close icon</p><p><b>Field Type:</b> Icon</p><p><b>Action:</b> On click, the credit score pop up is closed and the customer stays on the same page.</p></div></td></tr>\n<tr id=\"sl-6.2\"><td rowspan=\"4\" class=\"sl\">6.2</td><td class=\"shot\"><img src=\"prd-assets/f05-profile.png\" alt=\"\"></td><td rowspan=\"4\">User clicking the Profile icon in the top navigation to view the profile or log out</td><td><p>The Profile icon is part of the top navigation (Sl. No 6). On click, the system shall open the Profiles pop up over the current page, showing the name fetched from the PAN records and the PAN Number, with the Logout CTA.</p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Title:</b> \u201cProfiles\u201d</li><li><b>Profile card:</b> Initial letter of the name, the name as per PAN (e.g. AZHAGARSAMY SUBBURAJ) and the PAN Number (e.g. CBOPA8195B), with a tick</li><li><b>CTA:</b> \u201cLogout\u201d with the logout icon</li><li><b>Close icon:</b> (X) at the top right</li></ul></div></td><td rowspan=\"4\" class=\"dp\"><b>Profile Viewed:</b><ul><li>Yes</li><li>No</li></ul><br><b>Profile Viewed Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS</td><td rowspan=\"4\"><span class=\"tag wip\">WIP</span></td></tr>\n<tr><td class=\"shot\"><img class=\"icon\" src=\"prd-assets/f05-profile-icon.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Profile icon</p><p><b>Field Type:</b> Icon (top navigation, right corner)</p><p><b>Action:</b> On click, the system shall open the Profiles pop up.</p></div></td></tr>\n<tr><td class=\"shot\"><img class=\"icon\" src=\"prd-assets/f06-logout-cta.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Logout</p><p><b>Field Type:</b> CTA</p><p><b>Action:</b> On click, the customer is logged out and lands on the Landing page (Sl. No 1).</p></div></td></tr>\n<tr><td class=\"shot\"><img class=\"icon\" src=\"prd-assets/f06-close-profile.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> (X) Close icon</p><p><b>Field Type:</b> Icon</p><p><b>Action:</b> On click, the profile pop up is closed and the customer stays on the same page.</p></div></td></tr>\n<tr id=\"sl-6.3\"><td rowspan=\"3\" class=\"sl\">6.3</td><td class=\"shot\"><img src=\"prd-assets/f06-topnav-pan.png\" alt=\"\"></td><td rowspan=\"3\">Top navigation on the PAN Details page \u2013 logo and Logout</td><td><p>On the PAN Details page (Sl. No 4) only, the top navigation shows the Shriram Credit logo and the Logout icon. The Logout icon is shown directly in the top navigation (not inside the Profiles pop up). The Credit Score and Profile icons are not shown on this page; from Sl. No 5 onwards Logout is available inside the Profiles pop up (Sl. No 6.2).</p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Left:</b> Shriram Credit logo</li><li><b>Right:</b> Logout icon</li></ul></div></td><td rowspan=\"3\" class=\"dp\">No data captured from this navigation</td><td rowspan=\"3\"><span class=\"tag wip\">WIP</span></td></tr>\n<tr><td class=\"shot\"><img class=\"icon\" src=\"prd-assets/f06-logo.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Shriram Credit logo</p><p><b>Field Type:</b> Image (top navigation, left corner)</p><p><b>Action:</b> Display only.</p></div></td></tr>\n<tr><td class=\"shot\"><img class=\"icon\" src=\"prd-assets/f06-logout-icon.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Logout</p><p><b>Field Type:</b> Icon (top navigation, right corner)</p><p><b>Action:</b> On click, the customer is logged out and lands on the Landing page (Sl. No 1).</p><p><b>Condition:</b> Shown only on the PAN Details page (Sl. No 4).</p></div></td></tr>\n</tbody></table>\n<h2>Integration Requirements<span class=\"info\" tabindex=\"0\" aria-label=\"How to read the columns\" onclick=\"event.preventDefault()\">i<span class=\"info-pop\" role=\"tooltip\"><b>How to read the columns</b><table><tr><th>ID</th><td>Reference number, so other parts of the PRD can point to it (e.g. \u201cSubmit OTP triggers INT-001\u201d)</td></tr><tr><th>Integration</th><td>Which external system is called</td></tr><tr><th>Purpose</th><td>Why the journey needs it</td></tr><tr><th>Trigger</th><td>The exact moment or button that makes the call happen</td></tr><tr><th>Input</th><td>Data the LOS sends to that system</td></tr><tr><th>Expected Output</th><td>Data the LOS gets back</td></tr><tr><th>Success Behaviour</th><td>What the customer experiences when the call works</td></tr><tr><th>Failure Behaviour</th><td>What happens if the call fails, times out or returns an error</td></tr></table></span></span></h2><table class=\"int\"><thead><tr><th>ID</th><th>Integration</th><th>Purpose</th><th>Trigger</th><th>Input</th><th>Expected Output</th><th>Success Behaviour</th><th>Failure Behaviour</th></tr></thead><tbody>\n<tr><td>INT-001</td><td>Experian</td><td>Retrieve credit information / credit score for evaluating loan offers</td><td>On successful OTP verification (Module 2), after the customer gives the Experian consent</td><td>Customer mobile number</td><td>Credit score / credit information <a class=\"pend-ref\" href=\"#P-09\" onclick=\"var t=document.getElementById('P-09');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Open pending clarification P-09\">Pending \u00b7 P-09</a></td><td>Customer proceeds to PAN Verification without waiting for the response</td><td><a class=\"pend-ref\" href=\"#P-07\" onclick=\"var t=document.getElementById('P-07');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Open pending clarification P-07\">Pending \u00b7 P-07</a></td></tr>\n<tr><td>INT-002</td><td>OTP Service Provider <a class=\"pend-ref\" href=\"#P-10\" onclick=\"var t=document.getElementById('P-10');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Open pending clarification P-10\">Pending \u00b7 P-10</a></td><td>Send and verify the 6 digit OTP for the MF linked mobile number</td><td>Continue CTA on Module 1; Resend OTP CTA on Module 2</td><td>Mobile number</td><td>OTP sent / verification result</td><td>Customer proceeds to PAN Verification</td><td><a class=\"pend-ref\" href=\"#P-02\" onclick=\"var t=document.getElementById('P-02');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Open pending clarification P-02\">Pending \u00b7 P-02</a> <a class=\"pend-ref\" href=\"#P-10\" onclick=\"var t=document.getElementById('P-10');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Open pending clarification P-10\">Pending \u00b7 P-10</a></td></tr>\n</tbody></table>\n<h2>Pending Clarifications<span class=\"count wip\">10</span><span class=\"info\" tabindex=\"0\" aria-label=\"How to read this list\" onclick=\"event.preventDefault()\">i<span class=\"info-pop\" role=\"tooltip\"><b>How to read this list</b><table><tr><th>ID</th><td>Reference number. Anything not yet decided elsewhere in the PRD carries an amber \u201cPending \u00b7 P-09\u201d badge that jumps to its row here</td></tr><tr><th>Module</th><td>Which part of the journey the question is about (\u201cAll\u201d means the whole journey)</td></tr><tr><th>Clarification Required</th><td>The question that must be answered before that requirement is final. Until then the related item stays TBD and must not be built on assumptions</td></tr><tr><th>When answered</th><td>The answer is written into the PRD and the question moves to Completed Clarifications below</td></tr></table></span></span></h2><table class=\"int\"><thead><tr><th style=\"width:70px\">ID</th><th style=\"width:110px\">Module</th><th>Clarification Required</th></tr></thead><tbody>\n<tr id=\"P-21\"><td>P-21</td><td>Module 5</td><td>Sl. No 12 (LOS page) \u2013 what exactly happens on Refresh (MF Central checked again and the redirection pop up shown again, or something else), and can the customer change the mobile number or PAN from here? (The MF Central OTP part of this question is answered \u2013 see P-22.)</td></tr>\n<tr id=\"P-20\"><td>P-20</td><td>Top Navigation</td><td>Sl. No 6.1 \u2013 credit score pop up when there is no valid score. Experian scores run from 300 to 900, so a score below 300 is not returned; instead the response can carry no score for (a) a customer with no or too little credit history (new to credit), (b) no record found for the mobile number / PAN, or (c) the Experian call failing or timing out. Please check on UAT (e.g. with a new-to-credit customer) or with the tech team what the live journey does in each case: is the Credit Score icon still shown, what does the pop up show (e.g. \u201cScore not available\u201d, a blank meter, or an error), and does the journey continue as normal?</td></tr>\n<tr id=\"P-18\"><td>P-18</td><td>Module 4</td><td>Curated Offers page: the 18 to 70 years age limit (from the DOB entered on the PAN Details page) is validated on this page, not on PAN Details, so customers outside the limit are not blocked at PAN verification and can be tracked. Message confirmed by the owner: \u201cApplicant must be between 18 to 70 years of age.\u201d (DISC-139). Still to confirm: where exactly on the Curated Offers page it is shown, and whether Start Application is blocked.</td></tr>\n<tr id=\"P-02\"><td>P-02</td><td>Module 1</td><td>Does the Continue CTA call an OTP send API at this point, and what is the failure behaviour?</td></tr>\n<tr id=\"P-03\"><td>P-03</td><td>Module 1</td><td>Any backend check on the mobile number at this stage (existing customer, ongoing application, blacklist)?</td></tr>\n<tr id=\"P-05\"><td>P-05</td><td>Module 2</td><td>Resend and wrong attempt blocks to be enforced server side against the mobile number (currently held in the prototype browser storage). Confirm reset conditions for the counters.</td></tr>\n<tr id=\"P-07\"><td>P-07</td><td>Module 2</td><td>Experian failure / timeout behaviour and the effect of the score on eligibility and offers.</td></tr>\n<tr id=\"P-08\"><td>P-08</td><td>All</td><td>Where should the header Shriram Credit logo navigate in the live journey (shriramcredit.in, the LAMF landing page, or nowhere)? The prototype sends it to its own review home page.</td></tr>\n<tr id=\"P-09\"><td>P-09</td><td>Module 2</td><td>Experian response (INT-001 Expected Output): what exactly comes back from Experian \u2013 only the credit score (e.g. 750), or the score plus the full credit report (existing loans, EMIs, missed payments, recent loan enquiries)? How should a \u201cNo record found\u201d response be handled for a customer with no credit history? Depends on the Experian service Shriram Credit has signed up for.</td></tr>\n<tr id=\"P-10\"><td>P-10</td><td>Module 1 & 2</td><td>OTP service provider (INT-002): which vendor sends and verifies the OTP, and what the customer sees if OTP verification fails or times out (a failure to send is covered in P-02).</td></tr>\n</tbody></table>\n<details class=\"done\"><summary><span class=\"done-title\">Completed Clarifications<span class=\"count ok\">12</span></span><span class=\"info\" tabindex=\"0\" aria-label=\"How to read this list\" onclick=\"event.preventDefault()\">i<span class=\"info-pop\" role=\"tooltip\"><b>How to read this list</b><table><tr><th>ID</th><td>Reference number of the question (kept when a pending item is answered)</td></tr><tr><th>Module</th><td>Which part of the journey the question was about</td></tr><tr><th>Clarification Required</th><td>The question that was asked</td></tr><tr><th>Clarification Provided</th><td>The confirmed answer and the date it was given. The modules above already follow it</td></tr></table></span></span><span class=\"chev\" aria-hidden=\"true\"></span></summary><table class=\"int\"><thead><tr><th style=\"width:70px\">ID</th><th style=\"width:110px\">Module</th><th>Clarification Required</th><th>Clarification Provided</th></tr></thead><tbody>\n<tr id=\"P-22\"><td>P-22</td><td>Module 5</td><td>Sl. No 10 \u2013 MF Central Fetching Your Portfolio screen: the screenshot is shared (DISC-160); please confirm what is shown if the fetch fails or times out, and where the customer goes from there. Also: wrong OTP message and attempts on the MF Central OTP page (was P-21 b).</td><td>The MF Central pages (OTP, Select AMCs, Fetching, Portfolio Discovery Complete) belong to MF Central; the LOS has no access to them. Their behaviour, including failures and wrong OTP handling, is MF Central\u2019s; any functional issue is raised to MF Central by mail (DISC-161).<span class=\"answered\">Answered 09-10-2026</span></td></tr>\n<tr id=\"P-19\"><td>P-19</td><td>Module 4</td><td>Sl. No 5 \u2013 LOS to MF Central consent page: the row is written from the prototype screen. Please share the UAT screenshots so the screenshot and field crops can be replaced, and confirm what the Dashboard and Profile icons (top right) do on this page.</td><td>UAT screenshots shared (DISC-142). Credit Score icon opens the credit score pop up (score from Experian, fetched date, category, Raise an issue link to Experian, close); Profile icon opens the Profiles pop up (name as per PAN, PAN Number, Logout to the Landing page, close).<span class=\"answered\">Answered 07-10-2026</span></td></tr>\n<tr id=\"P-16\"><td>P-16</td><td>Module 2</td><td>Experian consent checkbox: the UAT screenshots shared on 30-09-2026 (uatlamf.shriramcredit.in) show the Enter OTP pop up without the Experian consent checkbox, and Submit OTP turns yellow as soon as 6 digits are entered. Sl. No 3 describes the checkbox as mandatory. Confirm whether the checkbox is part of the live journey.</td><td>The checkbox is displayed only when the customer verifies the OTP for the first time. A customer who has already verified the OTP earlier sees the Enter OTP pop up without the checkbox, and Submit OTP is enabled once all 6 digits are entered (DISC-129).<span class=\"answered\">Answered 05-10-2026</span></td></tr>\n<tr id=\"P-17\"><td>P-17</td><td>Module 3</td><td>PAN Details page: the exact live text for (a) a PAN Number not in the ABCDE1234F format, and (b) the PAN verification failures \u2013 name match below 60%, DOB not matching the PAN records, PAN not available. Also: where does the customer land after Logout?</td><td>Live: one common message \u201cPAN verification failed\u201d for every verification failure (DISC-126). The owner set the required messages (DISC-125): empty fields \u2013 CR-10; PAN with fewer than 10 characters \u2013 \u201cPlease enter your valid PAN Number.\u201d (CR-16); name match below 60% \u2013 \u201cPlease enter your name exactly as on your PAN card.\u201d (CR-13); DOB not matching \u2013 \u201cPlease enter your date of birth exactly as on your PAN card.\u201d (CR-15); PAN not available \u2013 \u201cPlease enter your PAN Number exactly as on your PAN card.\u201d (CR-17). Logout lands on the Landing page (exit page).<span class=\"answered\">Answered 05-10-2026</span></td></tr>\n<tr id=\"P-11\"><td>P-11</td><td>Module 2</td><td>OTP length, resend timer duration and number of resends allowed.</td><td>6 digit OTP; 30 second resend timer; 3 resends allowed, after which the number is blocked for 15 minutes. OTP validity: 30 seconds (see P-04).<span class=\"answered\">Answered 23-09-2026</span></td></tr>\n<tr id=\"P-12\"><td>P-12</td><td>Module 2</td><td>Wrong OTP handling \u2013 message, maximum attempts and lockout.</td><td>A validation message is shown for a wrong OTP; after 3 wrong attempts the number is blocked for 60 minutes.<span class=\"answered\">Answered 23-09-2026</span></td></tr>\n<tr id=\"P-13\"><td>P-13</td><td>Module 2</td><td>Is the Experian consent checkbox mandatory to submit the OTP?</td><td>Yes. Submit OTP is enabled only when the consent is ticked and all 6 digits are entered.<span class=\"answered\">Answered 23-09-2026</span></td></tr>\n<tr id=\"P-14\"><td>P-14</td><td>Module 2</td><td>What does the \u201cEdit\u201d link on the OTP screen do?</td><td>Returns to the mobile number screen (02) with the entered number prefilled.<span class=\"answered\">Answered 23-09-2026</span></td></tr>\n<tr id=\"P-15\"><td>P-15</td><td>Module 2</td><td>Which screen opens after a successful OTP submission?</td><td>Enter PAN Details (screen 04), after the Experian call is triggered.<span class=\"answered\">Answered 23-09-2026</span></td></tr>\n<tr id=\"P-01\"><td>P-01</td><td>Module 1</td><td>Validation message wording: the shared sample PRD carries \u201c*Required\u201d, \u201c*Invalid mobile number\u201d and \u201cError: Invalid phone number\u201d. The messages currently built follow the wording confirmed in discussion on 22-09-2026. Confirm which set is approved.</td><td>Use the new validation wording given by the owner. The PRD row shows the current live messages; the new wording is tracked as <a class=\"todo-ref\" href=\"#CR-01\" onclick=\"var t=document.getElementById('CR-01');if(t){var d=t.closest('details');if(d)d.open=true;t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Defined in the PRD, not yet changed in the live LOS journey \u2013 open CR-01\">To be changed \u00b7 CR-01</a> <a class=\"todo-ref\" href=\"#CR-02\" onclick=\"var t=document.getElementById('CR-02');if(t){var d=t.closest('details');if(d)d.open=true;t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Defined in the PRD, not yet changed in the live LOS journey \u2013 open CR-02\">To be changed \u00b7 CR-02</a> <a class=\"todo-ref\" href=\"#CR-03\" onclick=\"var t=document.getElementById('CR-03');if(t){var d=t.closest('details');if(d)d.open=true;t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Defined in the PRD, not yet changed in the live LOS journey \u2013 open CR-03\">To be changed \u00b7 CR-03</a> <a class=\"todo-ref\" href=\"#CR-04\" onclick=\"var t=document.getElementById('CR-04');if(t){var d=t.closest('details');if(d)d.open=true;t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Defined in the PRD, not yet changed in the live LOS journey \u2013 open CR-04\">To be changed \u00b7 CR-04</a>.<span class=\"answered\">Answered 29-09-2026</span></td></tr>\n<tr id=\"P-04\"><td>P-04</td><td>Module 2</td><td>OTP validity / expiry period.</td><td>The OTP is valid for 30 seconds. An OTP submitted later shows \u201cInvalid request id\u201d today; the new wording is tracked as <a class=\"todo-ref\" href=\"#CR-09\" onclick=\"var t=document.getElementById('CR-09');if(t){var d=t.closest('details');if(d)d.open=true;t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Defined in the PRD, not yet changed in the live LOS journey \u2013 open CR-09\">To be changed \u00b7 CR-09</a>.<span class=\"answered\">Answered 30-09-2026</span></td></tr>\n<tr id=\"P-06\"><td>P-06</td><td>Module 3</td><td>PAN Verification screen: field level rules, PAN format validation, name as per PAN matching logic and DOB / age rule.</td><td>Name as per PAN: alphanumeric, up to 150 characters. DOB: typed (DD/MM/YYYY) or picked from the calendar, 01-Jan-1920 to today, age 18 to 70 years. PAN: ABCDE1234F format. Continue validates every field; an empty field shows \u201c*Required\u201d. Name match threshold: 60% (answered later). Exact error texts are still open <a class=\"pend-ref\" href=\"#P-17\" onclick=\"var t=document.getElementById('P-17');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Open pending clarification P-17\">Pending \u00b7 P-17</a>.<span class=\"answered\">Answered 30-09-2026</span></td></tr>\n</tbody></table></details>\n<h2>Pending Changes<span class=\"count impl\">15</span><span class=\"info\" tabindex=\"0\" aria-label=\"How to read this list\" onclick=\"event.preventDefault()\">i<span class=\"info-pop\" role=\"tooltip\"><b>How to read this list</b><table><tr><th>ID</th><td>Change reference (CR). Wherever the PRD above carries a blue \u201cTo be changed \u00b7 CR-01\u201d tag, it jumps to its row here</td></tr><tr><th>Module</th><td>Which part of the journey the item belongs to</td></tr><tr><th>Where in the PRD</th><td>The Sl. No and field that defines it</td></tr><tr><th>What has to change</th><td>How the live LOS journey behaves today and what it has to change to, with the date it was raised</td></tr><tr><th>When done</th><td>Once the owner confirms the change is live, it moves to Completed Changes below and its tags turn green</td></tr></table></span></span></h2><table class=\"int\"><thead><tr><th style=\"width:70px\">ID</th><th style=\"width:110px\">Module</th><th style=\"width:220px\">Where in the PRD</th><th>What has to change</th></tr></thead><tbody>\n<tr id=\"CR-01\"><td>CR-01</td><td>Module 1</td><td>Sl. No 2 \u2013 Mobile Number field (Continue CTA with no mobile number)</td><td><div class=\"chg\"><div><b>Current:</b> \u201c*Required\u201d</div><div><b>To be changed as:</b> \u201cPlease enter your MF linked mobile number.\u201d \u2013 displayed when the user clicks the Continue CTA without entering the mobile number</div></div><span class=\"raised\">Raised 30-09-2026</span></td></tr>\n<tr id=\"CR-02\"><td>CR-02</td><td>Module 1</td><td>Sl. No 2 \u2013 Mobile Number field (less than 10 digits)</td><td><div class=\"chg\"><div><b>Current:</b> \u201c*Invalid mobile number\u201d</div><div><b>To be changed as:</b> \u201cMobile number must be 10 digits.\u201d \u2013 displayed when the user clicks the Continue CTA with less than 10 digits, and on exit from the field</div></div><span class=\"raised\">Raised 30-09-2026</span></td></tr>\n<tr id=\"CR-03\"><td>CR-03</td><td>Module 1</td><td>Sl. No 2 \u2013 Mobile Number field (first digit 0 to 5)</td><td><div class=\"chg\"><div><b>Current:</b> \u201cError: Invalid phone number\u201d \u2013 displayed only when the user clicks the Continue CTA</div><div><b>To be changed as:</b> \u201cMobile number cannot start with 0, 1, 2, 3, 4 or 5. Please enter a valid mobile number.\u201d \u2013 displayed as soon as the customer attempts a first digit of 0 to 5</div></div><span class=\"raised\">Raised 30-09-2026</span></td></tr>\n<tr id=\"CR-04\"><td>CR-04</td><td>Module 1</td><td>Sl. No 2 \u2013 Mobile Number field (non numeric character)</td><td><div class=\"chg\"><div><b>Current:</b> No validation \u2013 the character simply cannot be entered</div><div><b>To be changed as:</b> The character still cannot be entered, and \u201cOnly numbers are allowed. Letters, spaces and special characters cannot be entered.\u201d is displayed when the customer attempts a non numeric character</div></div><span class=\"raised\">Raised 30-09-2026</span></td></tr>\n<tr id=\"CR-05\"><td>CR-05</td><td>Module 2</td><td>Sl. No 3 \u2013 Enter OTP field (non numeric character)</td><td><div class=\"chg\"><div><b>Current:</b> No validation \u2013 the character simply cannot be entered</div><div><b>To be changed as:</b> The character still cannot be entered, and \u201cOnly numbers are allowed. Letters, spaces and special characters cannot be entered.\u201d is displayed when the customer attempts a non numeric character</div></div><span class=\"raised\">Raised 30-09-2026</span></td></tr>\n<tr id=\"CR-06\"><td>CR-06</td><td>Module 2</td><td>Sl. No 3 \u2013 Enter OTP field (wrong OTP, 1st to 3rd back to back attempt)</td><td><div class=\"chg\"><div><b>Current:</b> \u201cInvalid OTP\u201d on the 1st, 2nd and 3rd back to back wrong attempt</div><div><b>To be changed as:</b> \u201cThe OTP you entered is incorrect. Please try again. You have 2 attempts left.\u201d (1st wrong attempt) / \u201cThe OTP you entered is incorrect. Please try again. You have 1 attempt left.\u201d (2nd) / \u201cThe OTP you entered is incorrect. You have no attempts left.\u201d (3rd). The block message on the next attempt stays as it is today</div></div><span class=\"raised\">Raised 30-09-2026</span></td></tr>\n<tr id=\"CR-09\"><td>CR-09</td><td>Module 2</td><td>Sl. No 3 \u2013 Enter OTP field (OTP submitted after 30 seconds)</td><td><div class=\"chg\"><div><b>Current:</b> \u201cInvalid request id\u201d</div><div><b>To be changed as:</b> \u201cYour OTP has expired. Please click Resend OTP to get a new OTP.\u201d \u2013 displayed when the customer submits the OTP more than 30 seconds after it was sent</div></div><span class=\"raised\">Raised 30-09-2026</span></td></tr>\n<tr id=\"CR-10\"><td>CR-10</td><td>Module 3</td><td>Sl. No 4 \u2013 Name as per PAN, DOB and PAN Number (field left empty)</td><td><div class=\"chg\"><div><b>Current:</b> \u201c*Required\u201d for every empty field</div><div><b>To be changed as:</b> A message that names the field: \u201cPlease enter your name as per PAN.\u201d / \u201cPlease enter your date of birth as per PAN.\u201d / \u201cPlease enter your PAN Number.\u201d</div></div><span class=\"raised\">Raised 30-09-2026</span></td></tr>\n<tr id=\"CR-11\"><td>CR-11</td><td>Module 3</td><td>Sl. No 4 \u2013 PAN Number field (message for a character that does not fit its position)</td><td><div class=\"chg\"><div><b>Current:</b> Message shown next to the PAN Number label as the PAN is typed:<ul><li>\u201c1st character must be a letter\u201d</li><li>\u201c2nd character must be a letter\u201d</li><li>\u201c3rd character must be a letter\u201d</li><li>\u201c4th character must be a letter\u201d</li><li>\u201c5th character must be a letter\u201d</li><li>\u201c6th character must be a number\u201d</li><li>\u201c7th character must be a number\u201d</li><li>\u201c8th character must be a number\u201d</li><li>\u201c9th character must be a letter\u201d</li><li>\u201c10th character must be a letter\u201d</li></ul></div><div><b>To be changed as:</b> Message for each position:<ul><li>\u201c1st character must be a letter (A\u2013Z).\u201d</li><li>\u201c2nd character must be a letter (A\u2013Z).\u201d</li><li>\u201c3rd character must be a letter (A\u2013Z).\u201d</li><li>\u201cThe 4th character must be (P) \u2013 only individual PAN is allowed.\u201d \u2013 see CR-18</li><li>\u201c5th character must be a letter (A\u2013Z).\u201d</li><li>\u201c6th character must be a number (0\u20139).\u201d</li><li>\u201c7th character must be a number (0\u20139).\u201d</li><li>\u201c8th character must be a number (0\u20139).\u201d</li><li>\u201c9th character must be a number (0\u20139).\u201d</li><li>\u201c10th character must be a letter (A\u2013Z).\u201d</li></ul></div></div><span class=\"raised\">Raised 01-10-2026</span></td></tr>\n<tr id=\"CR-12\"><td>CR-12</td><td>Module 3</td><td>Sl. No 4 \u2013 DOB field (typed date before 01-Jan-1920 or after today)</td><td><div class=\"chg\"><div><b>Current:</b> \u201c*Invalid date\u201d next to the DOB label</div><div><b>To be changed as:</b> \u201cPlease enter your date of birth exactly as on your PAN card.\u201d (owner\u2019s wording, DISC-134)</div></div><span class=\"raised\">Raised 01-10-2026</span></td></tr>\n<tr id=\"CR-13\"><td>CR-13</td><td>Module 3</td><td>Sl. No 4 \u2013 Name as per PAN (name verification failure, name match below 60%)</td><td><div class=\"chg\"><div><b>Current:</b> One common message \u201cPAN verification failed\u201d for every verification failure \u2013 it does not say whether the name, DOB or PAN Number failed (DISC-126)</div><div><b>To be changed as:</b> Shown on this PAN Details page, next to the Name as per PAN label, only when the name check fails: \u201cPlease enter your name exactly as on your PAN card.\u201d The match percentage (60%) is never shown to the customer (DISC-117, DISC-125)</div></div><span class=\"raised\">Raised 01-10-2026</span></td></tr>\n<tr id=\"CR-15\"><td>CR-15</td><td>Module 3</td><td>Sl. No 4 \u2013 DOB (DOB does not match the PAN records)</td><td><div class=\"chg\"><div><b>Current:</b> One common message \u201cPAN verification failed\u201d for every verification failure \u2013 it does not say whether the name, DOB or PAN Number failed (DISC-126)</div><div><b>To be changed as:</b> Shown on this PAN Details page, next to the DOB label, only when the DOB check fails: \u201cPlease enter your date of birth exactly as on your PAN card.\u201d</div></div><span class=\"raised\">Raised 05-10-2026</span></td></tr>\n<tr id=\"CR-16\"><td>CR-16</td><td>Module 3</td><td>Sl. No 4 \u2013 PAN Number (fewer than 10 characters entered)</td><td><div class=\"chg\"><div><b>Current:</b> Live message not captured \u2013 the owner set the required wording (DISC-125)</div><div><b>To be changed as:</b> Message next to the PAN Number label when Continue is clicked: \u201cPlease enter your valid PAN Number.\u201d</div></div><span class=\"raised\">Raised 05-10-2026</span></td></tr>\n<tr id=\"CR-17\"><td>CR-17</td><td>Module 3</td><td>Sl. No 4 \u2013 PAN Number (PAN not available in the PAN records)</td><td><div class=\"chg\"><div><b>Current:</b> One common message \u201cPAN verification failed\u201d for every verification failure \u2013 it does not say whether the name, DOB or PAN Number failed (DISC-126)</div><div><b>To be changed as:</b> Shown on this PAN Details page, next to the PAN Number label, only when the PAN is not available: \u201cPlease enter your PAN Number exactly as on your PAN card.\u201d</div></div><span class=\"raised\">Raised 05-10-2026</span></td></tr>\n<tr id=\"CR-18\"><td>CR-18</td><td>Module 3</td><td>Sl. No 4 \u2013 PAN Number (4th character \u2013 individual PAN only)</td><td><div class=\"chg\"><div><b>Current:</b> Any letter is accepted in the 4th place (e.g. CBOCA8195B can be entered); a non-letter shows \u201c4th character must be a letter\u201d</div><div><b>To be changed as:</b> Only P is accepted in the 4th place (individual PAN only). Any other character is not entered and \u201cThe 4th character must be (P) \u2013 only individual PAN is allowed.\u201d is shown at once next to the PAN Number label, so a non-individual PAN is stopped in the PAN Number field itself (DISC-137)</div></div><span class=\"raised\">Raised 06-10-2026</span></td></tr>\n</tbody></table>\n<details class=\"done\"><summary><span class=\"done-title\">Completed Changes<span class=\"count ok\">1</span></span><span class=\"info\" tabindex=\"0\" aria-label=\"How to read this list\" onclick=\"event.preventDefault()\">i<span class=\"info-pop\" role=\"tooltip\"><b>How to read this list</b><table><tr><th>ID</th><td>Change reference (kept when it moves from Pending Changes)</td></tr><tr><th>Module</th><td>Which part of the journey the item belongs to</td></tr><tr><th>Where in the PRD</th><td>The Sl. No and field that defines it</td></tr><tr><th>What was changed</th><td>What is now live in the LOS journey, and the date the owner confirmed it</td></tr></table></span></span><span class=\"chev\" aria-hidden=\"true\"></span></summary><table class=\"int\"><thead><tr><th style=\"width:70px\">ID</th><th style=\"width:110px\">Module</th><th style=\"width:220px\">Where in the PRD</th><th>What was changed</th></tr></thead><tbody>\n<tr id=\"CR-14\"><td>CR-14</td><td>Module 3</td><td>Sl. No 4 \u2013 Name as per PAN (characters allowed)</td><td>Alphabets (A\u2013Z) and space only. Numbers and special characters cannot be entered; what is typed is captured in CAPITAL letters. Confirmed live by the owner (DISC-128)<span class=\"answered\">Changed 05-10-2026</span></td></tr>\n</tbody></table></details>\n</main>";

<script>
  function route() {
    var name = decodeURIComponent(location.hash.replace(/^#/, ''));
    if (name.split('/')[0] === 'PRD' && window.PRD_HTML) {
      LAMF.renderPRD(window.PRD_HTML);
      var row = name.split('/')[1], t = row && document.getElementById(row);   // #PRD/sl-5 opens that row (DISC-153)
      if (t) setTimeout(function () { t.scrollIntoView({ block: 'start' }); t.classList.add('flash'); }, 60);
      return;
    }
    var fn = window.SCREEN_RENDER[name];
    if (fn) { fn(); return; }
    if (name === 'SCREENS') { LAMF.render(window.SCREENS_HTML, { bodyClass: 'page-screens' }); return; }
    LAMF.render(window.HOME_HTML, { bodyClass: 'page-home' });
  }
  window.addEventListener('hashchange', route);
  route();
</script>
