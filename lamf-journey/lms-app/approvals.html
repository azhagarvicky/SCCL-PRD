<script>
(function () {   // Approvals (DISC-521): every product sent for approval (In Review) is a change request here.
  // My Pending Approvals – requests made by someone else (the maker cannot check own request); All Approvals – every request.
  var $ = function (i) { return document.getElementById(i); }, me = LMS_PROD.me();
  var esc = function (t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var reqs = LMS_PROD.load().filter(function (x) { return x.status === 'In Review' && x.req; });
  var show = function (t) {
    [].forEach.call(document.querySelectorAll('.ap-tabs button'), function (b) { b.classList.toggle('on', b.dataset.t === t); b.setAttribute('aria-selected', b.dataset.t === t); });
    $('ap-h').textContent = t === 'my' ? 'My Pending Approvals' : 'All Approvals';
    var l = t === 'my' ? reqs.filter(function (x) { return x.maker !== me; }) : reqs;
    $('ap-empty').hidden = !!l.length; $('ap-wrap').hidden = !l.length;
    $('ap-rows').innerHTML = l.map(function (x) {
      return '<tr><td>' + esc(x.on) + '</td><td><a class="ap-lk" href="product-view.html?code=' + encodeURIComponent(x.code) + '">Product creation</a></td>' +
        '<td><div class="ap-d"><span class="apv-c g">Product</span><span class="apv-c">' + esc(x.name) + '</span></div><div class="ap-d"><span class="apv-c g">ID</span><span class="apv-c">' + esc(x.code) + '</span></div></td>' +
        '<td><span class="ap-r">Admin</span><span class="ap-r">Ops_L3</span><span class="ap-r">Ops_L2</span><span class="ap-r">UpdateProductCreationTasks</span></td>' +
        '<td>' + esc(LMS_PROD.nameOf(x.maker)) + '</td></tr>';
    }).join('');
  };
  [].forEach.call(document.querySelectorAll('.ap-tabs button'), function (b) { b.addEventListener('click', function () { show(b.dataset.t); }); });
  show('my');
})();
</script>
