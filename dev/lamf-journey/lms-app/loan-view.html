<script>
(function () {   // DISC-539: loan page – Overview only; other tabs, ≡ actions, View status and Go to Simulator open Work in progress
  var $ = function (id) { return document.getElementById(id); }, inr = LMS_LOAN.inr;
  var lan = new URLSearchParams(location.search).get('lan') || 'SCCLMF20261100043', d = LMS_LOAN.find(lan) || LMS_LOAN.all()[0];
  var esc = function (t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var wip = function (p) { return 'wip.html?p=' + encodeURIComponent(p); };
  document.title = 'LMS – ' + d.lan; $('lv-lan').textContent = d.lan;
  var INFO = '<button type="button" class="lv-i" aria-label="Fee and GST" data-tip="TIP"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><circle cx="12" cy="7.6" r=".6" fill="currentColor"/></svg></button>';
  var fg = function (fee) { var g = Math.round(fee * 18) / 100, dec = g % 1 !== 0; return { v: inr(fee + g, dec), t: 'Fee: ' + inr(fee) + ' | GST: ' + inr(g, dec) }; };
  var tipd = function (o) { return esc(o.v) + ' ' + INFO.replace('TIP', esc(o.t)); };
  var cell = function (l, v, cls) { return '<div><span>' + l + '</span><b' + (cls ? ' class="' + cls + '"' : '') + '>' + v + '</b></div>'; };
  var TABS = ['Overview', 'Approvals', 'Disbursement & Repayments', 'Collateral', 'Transactions & Reports', 'KYC', 'Documents', 'Audit', 'Notes', 'Communication'];
  $('lv-tabs').innerHTML = TABS.map(function (t, i) { return '<button type="button" role="tab"' + (i ? '' : ' class="on" aria-selected="true"') + ' data-t="' + t + '">' + esc(t) + '</button>'; }).join('');
  [].forEach.call($('lv-tabs').children, function (b, i) { if (i) b.addEventListener('click', function () { location.href = wip('Loan – ' + b.dataset.t); }); });
  var ACTS = ['Disbursal', 'Repayment', 'Soft Freeze', 'Hard Freeze', 'Unfreeze', 'De-Pledge Assets', 'Liquidate Assets', 'Change ROI', 'Foreclose', 'Waive-off', 'Add Credit Note'];
  $('lv-dd').innerHTML = ACTS.map(function (a) { return '<button type="button"' + (a === 'Unfreeze' ? ' disabled' : '') + ' data-a="' + a + '">' + a + '</button>'; }).join('');
  [].forEach.call($('lv-dd').children, function (b) { b.addEventListener('click', function () { location.href = wip('Loan – ' + b.dataset.a); }); });
  var mb = $('lv-menu'), dd = $('lv-dd'), menu = function (on) { dd.hidden = !on; mb.classList.toggle('open', on); mb.setAttribute('aria-expanded', on); };
  mb.addEventListener('click', function (e) { e.stopPropagation(); menu(dd.hidden); });
  document.addEventListener('click', function (e) { if (!dd.contains(e.target)) menu(false); });
  var pf = { v: inr(d.pf), t: 'Fee: ' + inr(d.fee) + ' | GST: ' + inr(d.gst) };
  $('lv-loan').innerHTML = cell('LSP', esc(d.lsp)) + cell('Sanctioned Amount', inr(d.sanction)) + cell('Drawing Power', inr(d.sanction)) + cell('Disbursed Amount', inr(0)) +
    cell('Repaid Amount', inr(0)) + cell('Principal Outstanding', inr(0)) + cell('Available for Disbursement', inr(d.sanction)) +
    cell('Utilized Drawing Power', '0% <svg class="lv-warn" viewBox="0 0 24 24" aria-label="Utilisation level"><path d="M12 3L2 21h20z"/><path d="M12 10v5M12 17.6v.4" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>', 'g') +
    cell('Repayments', 'On time', 'g') + cell('Deduction Date', '5th, Monthly') + cell('Repayment Type', 'Interest Only') + cell('Disbursement Type', 'Revolving') +
    cell('Rate of Interest', d.roi) + cell('Processing Fee', tipd(pf)) + cell('Tenure', d.tenure + ' months') +
    cell('Product Name', '<a class="lv-a" href="product-view.html?code=' + encodeURIComponent(d.product) + '" target="_blank" data-newtab="1" title="Opens the product page in a new tab">' + esc(d.productName) + '</a>') +
    cell('Application Start Date', d.start) + cell('Application Submitted Date', d.start) + cell('Loan Start Date', d.start) + cell('Loan End Date', d.end);
  var cc = function (l, c, du) { return '<div><span>' + l + '</span><b class="lv-ln">Collected: ' + c + '</b><b class="lv-ln">Due: ' + du + '</b><b class="lv-ln">Overdue: ' + inr(0) + '</b></div>'; };
  $('lv-coll').innerHTML = cc('Interest', inr(0), inr(0)) + cc('Principal', inr(0), inr(0)) + cc('Charges', inr(-d.pf), inr(2 * d.pf));   // as the live LMS shows it (LP-10)
  $('lv-cli').innerHTML = cell('Client Name', '<a class="lv-a" href="' + wip('Clients – ' + d.client) + '">' + esc(d.client.toUpperCase()) + '</a>') + cell('PAN', d.pan) +
    cell('Email Id', esc(d.mail)) + cell('Contact Number', d.phone) + cell('Credit Score', d.score, 'g');
  $('lv-kfs').innerHTML = cell('Renewal Charges', tipd(fg(999))) + cell('Bounce Charges', tipd(fg(100))) + cell('Penal Charges (P.A)', '36%') + cell('Liquidation Charges', '-') +
    cell('Prepayment Charges/Foreclosure', '-') + cell('Bank Mandate Swap Charges', tipd(fg(250))) + cell('Lien Marking Charges', tipd(fg(450))) + cell('Lien Removal Charges', tipd(fg(100))) +
    cell('Stamp Duty', tipd(fg(200)));
  // DISC-540: Product Name opens the product page in a NEW tab. window.open copies this tab's session (site access + LMS user) to the new tab,
  // so the new tab does not ask for the login again (a plain target=_blank link would not copy it).
  [].forEach.call(document.querySelectorAll('[data-newtab]'), function (a) { a.addEventListener('click', function (e) {
    if (e.ctrlKey || e.metaKey || e.shiftKey || e.button) return; e.preventDefault(); window.open(a.href, '_blank');
  }); });
  // (i) → tooltip "Fee: ₹… | GST: ₹…" under the icon, on hover or click
  var tip = $('lv-tip');
  function show(b) { var r = b.getBoundingClientRect(); tip.textContent = b.dataset.tip; tip.hidden = false; tip.style.left = (r.left + window.scrollX - 10) + 'px'; tip.style.top = (r.bottom + window.scrollY + 8) + 'px'; }
  [].forEach.call(document.querySelectorAll('.lv-i'), function (b) {
    b.addEventListener('mouseenter', function () { show(b); }); b.addEventListener('mouseleave', function () { tip.hidden = true; });
    b.addEventListener('focus', function () { show(b); }); b.addEventListener('blur', function () { tip.hidden = true; });
  });
})();
</script>
