>To be changed \u00b7 CR-02</a></li><li>\u201cError: Invalid phone number\u201d \u2013 displayed when the mobile number starts with 0 to 5 and the user clicks Continue CTA <a class=\"todo-ref\" href=\"#CR-03\" onclick=\"var t=document.getElementById('CR-03');if(t){var d=t.closest('details');if(d)d.open=true;t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Defined in the PRD, not yet changed in the live LOS journey \u2013 open CR-03\">To be changed \u00b7 CR-03</a></li></ul></p></div></td></tr>\n<tr><td class=\"shot\"><figure class=\"state\"><img src=\"prd-assets/f02-consent.png\" alt=\"\"><figcaption>Before \u2013 unticked (default)</figcaption></figure><figure class=\"state\"><img src=\"prd-assets/f02-consent-ticked.png\" alt=\"\"><figcaption>After \u2013 ticked</figcaption></figure></td><td><div class=\"spec\"><p><b>Field Name:</b> (Checkbox)</p><p><b>Field Type:</b> Check box</p><p><b>Action:</b> User has to click the Checkbox. Once this checkbox is clicked then only the Continue CTA has to be enabled</p></div></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f02-tnc.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> T&amp;C</p><p><b>Field Type:</b> Hyperlink</p><p><b>Action:</b> User has to click this hyperlink to view the Terms and Conditions. On click, the system shall redirect the user to https://www.shriramcredit.in/terms-and-conditions (opens in a new tab, so the details entered on this screen are kept).</p></div></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f02-privacy.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Privacy Policy</p><p><b>Field Type:</b> Hyperlink</p><p><b>Action:</b> User has to click this hyperlink to view the Privacy Policy. On click, the system shall redirect the user to https://www.shriramcredit.in/privacy-policy (opens in a new tab, so the details entered on this screen are kept).</p></div></td></tr>\n<tr><td class=\"shot\"><figure class=\"state\"><img src=\"prd-assets/f02-cta.png\" alt=\"\"><figcaption>Before \u2013 disabled (grey) until the checkbox is ticked</figcaption></figure><figure class=\"state\"><img src=\"prd-assets/f02-cta-enabled.png\" alt=\"\"><figcaption>After \u2013 enabled once the checkbox is ticked</figcaption></figure></td><td><div class=\"spec\"><p><b>Field Name:</b> Continue</p><p><b>Field Type:</b> CTA (Button)</p><p><b>Action:</b> On click, the system shall validate all conditions of this screen. If every condition is met, the system shall trigger the OTP to the entered mobile number and navigate the customer to the OTP verification screen. If any condition fails, the customer shall not be allowed to proceed and the respective validation shall be displayed.</p><p><b>Condition:</b> CTA is disabled (grey) and cannot be clicked until the consent checkbox is ticked, so no validation is shown for the checkbox. Once enabled, validation order: mobile number entered \u2192 first digit 6 to 9 \u2192 10 digits.</p></div></td></tr>\n</tbody></table>\n<h2>Module 2 \u2013 OTP Verification (MF linked Mobile Number)</h2>\n<p class=\"screens\">Screen 03) Enter OTP for MF linked Mobile Number Verification</p>\n<table><thead><tr><th style=\"width:52px\">SL.No</th><th style=\"width:330px\">Screenshot</th><th style=\"width:190px\">Functionality</th><th>Description</th><th style=\"width:190px\">Data Points Required</th><th style=\"width:165px\">Status</th></tr></thead><tbody>\n<tr id=\"sl-3\"><td rowspan=\"8\" class=\"sl\">3</td><td class=\"shot\"><img src=\"prd-assets/screen-03.png\" alt=\"\"></td><td rowspan=\"8\">User entering the OTP received on the MF linked mobile number to complete the mobile number verification</td><td><p>On successful submission of the mobile number, the system shall send a 6 digit OTP to the MF linked mobile number and display the \u201cEnter OTP\u201d pop up over the landing page. The mobile number shall be displayed in masked format (+91, first 2 digits, XXXX, last 4 digits).</p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Pop up title:</b> \u201cEnter OTP\u201d</li><li><b>Close icon:</b> (X) at the top right</li><li><b>Sent message:</b> \u201cA 6-digit OTP has been sent by Shriram Credit to\u201d followed by the masked mobile number and the \u201cEdit\u201d link</li><li><b>OTP boxes:</b> 6 single digit boxes</li><li><b>Resend line:</b> \u201cDidn\u2019t Receive OTP?\u201d with the countdown timer (0:30 to 0:01), then the \u201cResend OTP\u201d link</li><li><b>Experian consent checkbox text (first OTP verification only):</b> \u201cI hereby consent to appoint Shriram Credit as my authorised representative to receive my credit information from Experian for the purpose of providing/ evaluating loan offers.\u201d</li><li><b>CTA:</b> \u201cSubmit OTP\u201d \u2013 grey until all 6 digits are entered and the consent is ticked (when the checkbox is displayed), then yellow</li><li><b>Validation messages:</b> <ul><li>\u201cInvalid OTP\u201d <a class=\"todo-ref\" href=\"#CR-06\" onclick=\"var t=document.getElementById('CR-06');if(t){var d=t.closest('details');if(d)d.open=true;t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Defined in the PRD, not yet changed in the live LOS journey \u2013 open CR-06\">To be changed \u00b7 CR-06</a></li><li>\u201cMaximum OTP retry limit reached. Please retry again after N minute(s).\u201d \u2013 N is the time left in the 60 minute block</li><li>\u201cError: Maximum OTP resend limit reached. Please retry again after N minute(s).\u201d \u2013 N is the time left in the 15 minute block</li><li>\u201cInvalid request id\u201d \u2013 OTP submitted after 30 seconds <a class=\"todo-ref\" href=\"#CR-09\" onclick=\"var t=document.getElementById('CR-09');if(t){var d=t.closest('details');if(d)d.open=true;t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Defined in the PRD, not yet changed in the live LOS journey \u2013 open CR-09\">To be changed \u00b7 CR-09</a></li><li>No message for a non numeric character <a class=\"todo-ref\" href=\"#CR-05\" onclick=\"var t=document.getElementById('CR-05');if(t){var d=t.closest('details');if(d)d.open=true;t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Defined in the PRD, not yet changed in the live LOS journey \u2013 open CR-05\">To be changed \u00b7 CR-05</a></li></ul></li></ul></div></td><td rowspan=\"8\" class=\"dp\"><b>OTP Entered:</b> 6 digit numeric<br><br><b>OTP Verified:</b><ul><li>Yes</li><li>No</li></ul><br><b>OTP Verified Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS<br><br><b>Resend Count:</b> 0\u20133<br><br><b>Wrong Attempt Count:</b> 0\u20133<br><br><b>Blocked Start Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS<br><br><b>Blocked End Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS<br><br><b>Experian Consent:</b><ul><li>Yes</li><li>No</li></ul></td><td rowspan=\"8\"><span class=\"tag ok\">Completed</span></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f03-close.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> (X) Close Icon</p><p><b>Field Type:</b> Icon</p><p><b>Action:</b> After clicking this, close the pop up and navigate the user to the landing page</p></div></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f03-sent.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Masked Mobile Number</p><p><b>Field Type:</b> Display text</p><p><b>Prefilled Value:</b> Mobile number entered on the previous screen, masked as +91 + first 2 digits + XXXX + last 4 digits</p><p><b>Action:</b> Display only, not editable</p></div></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f03-edit.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Edit</p><p><b>Field Type:</b> Icon with hyperlink</p><p><b>Action:</b> On click, navigate the user to the previous screen (Enter your MF linked Mobile Number). The mobile number entered by the user shall be prefilled in the field.</p></div></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f03-otp.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Enter OTP</p><p><b>Field Type:</b> 6 single character boxes</p><p><b>Minimum Character:</b> 6 Char</p><p><b>Maximum Character:</b> 6 Char</p><p><b>Value Type:</b> User inputs</p><p><b>Input Value format:</b> Numeric only</p><p><b>Action:</b> User has to enter the 6 digit OTP received on the MF linked mobile number.</p><p><b>Condition:</b> Only numbers can be entered, up to 6 digits. Alphabets, spaces and special characters cannot be entered, and no message is shown. <a class=\"todo-ref\" href=\"#CR-05\" onclick=\"var t=document.getElementById('CR-05');if(t){var d=t.closest('details');if(d)d.open=true;t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Defined in the PRD, not yet changed in the live LOS journey \u2013 open CR-05\">To be changed \u00b7 CR-05</a></p><p><b>Validation:</b> <ul><li>\u201cInvalid OTP\u201d \u2013 displayed on each wrong OTP, for the 1st, 2nd and 3rd back to back wrong attempt. Wrong attempts are counted only while the pop up stays open: if the customer closes the pop up and then enters a wrong OTP again, it is counted as the 1st attempt <a class=\"todo-ref\" href=\"#CR-06\" onclick=\"var t=document.getElementById('CR-06');if(t){var d=t.closest('details');if(d)d.open=true;t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Defined in the PRD, not yet changed in the live LOS journey \u2013 open CR-06\">To be changed \u00b7 CR-06</a></li><li>\u201cMaximum OTP retry limit reached. Please retry again after N minute(s).\u201d \u2013 after 3 back to back wrong OTP attempts in the same pop up the customer is blocked for 60 minutes; displayed on the next attempt. N is the time left in the 60 minute block (e.g. a customer returning after 10 minutes sees 50)</li><li>\u201cInvalid request id\u201d \u2013 displayed when the customer submits the OTP more than 30 seconds after it was sent (the OTP is valid for 30 seconds) <a class=\"todo-ref\" href=\"#CR-09\" onclick=\"var t=document.getElementById('CR-09');if(t){var d=t.closest('details');if(d)d.open=true;t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Defined in the PRD, not yet changed in the live LOS journey \u2013 open CR-09\">To be changed \u00b7 CR-09</a></li></ul></p></div></td></tr>\n<tr><td class=\"shot\"><figure class=\"state\"><img src=\"prd-assets/f03-resend.png\" alt=\"\"><figcaption>Before \u2013 timer running, Resend OTP disabled</figcaption></figure><figure class=\"state\"><img src=\"prd-assets/f03-resend-enabled.png\" alt=\"\"><figcaption>After \u2013 timer ends, Resend OTP enabled</figcaption></figure></td><td><div class=\"spec\"><p><b>Field Name:</b> Resend OTP</p><p><b>Field Type:</b> Timer with hyperlink CTA</p><p><b>Action:</b> The timer shall start at 0:30 and run down to 0:01. At 0 the Resend OTP CTA shall be enabled. On click, the OTP shall be sent again and the timer shall restart.</p><p><b>Condition:</b> The customer can click Resend OTP 3 times back to back (1st, 2nd and 3rd) in the same pop up. On the next click the customer is blocked from resending for 15 minutes.</p><p><b>Validation:</b> \u201cError: Maximum OTP resend limit reached. Please retry again after N minute(s).\u201d \u2013 displayed when the customer clicks Resend OTP after the 3rd back to back resend. N is the time left in the 15 minute block (e.g. a customer returning after 10 minutes sees 5)</p></div></td></tr>\n<tr><td class=\"shot\"><figure class=\"state\"><img src=\"prd-assets/f03-consent.png\" alt=\"\"><figcaption>Before \u2013 unticked (default)</figcaption></figure><figure class=\"state\"><img src=\"prd-assets/f03-consent-ticked.png\" alt=\"\"><figcaption>After \u2013 ticked</figcaption></figure></td><td><div class=\"spec\"><p><b>Field Name:</b> (Checkbox) Experian consent</p><p><b>Field Type:</b> Check box</p><p><b>Action:</b> User has to tick this checkbox to appoint Shriram Credit as the authorised representative to receive the credit information from Experian for the purpose of providing / evaluating loan offers.</p><p><b>Condition:</b> Displayed only when the customer verifies the OTP for the first time. For a customer who has already verified the OTP earlier, the checkbox is not displayed. When displayed, Submit OTP CTA shall be enabled only when this checkbox is ticked and all 6 OTP digits are entered, so no validation is shown for the checkbox.</p></div></td></tr>\n<tr><td class=\"shot\"><figure class=\"state\"><img src=\"prd-assets/f03-cta.png\" alt=\"\"><figcaption>Before \u2013 disabled (grey) until all 6 digits are entered</figcaption></figure><figure class=\"state\"><img src=\"prd-assets/f03-cta-enabled.png\" alt=\"\"><figcaption>After \u2013 enabled once all 6 digits are entered</figcaption></figure></td><td><div class=\"spec\"><p><b>Field Name:</b> Submit OTP</p><p><b>Field Type:</b> CTA (Button)</p><p><b>Action:</b> On click, the system shall validate the entered OTP. If the OTP is correct, the system shall trigger the Experian API with the mobile number to retrieve the credit score and navigate the customer to the PAN Verification screen. If the OTP is wrong, the customer shall not be allowed to proceed and the respective validation shall be displayed.</p><p><b>Condition:</b> CTA is disabled (grey) and cannot be clicked until all 6 OTP digits are entered and the Experian consent checkbox is ticked (for a customer who has already verified the OTP earlier, the checkbox is not displayed and only the 6 digits are needed), so no validation is shown for these. Once enabled, the wrong OTP and block validations are shown under the Enter OTP field.</p></div></td></tr>\n</tbody></table>\n<h2>Module 3 \u2013 PAN Verification</h2>\n<p class=\"screens\">Screen 04) Enter PAN Details</p>\n<table><thead><tr><th style=\"width:52px\">SL.No</th><th style=\"width:330px\">Screenshot</th><th style=\"width:190px\">Functionality</th><th>Description</th><th style=\"width:190px\">Data Points Required</th><th style=\"width:165px\">Status</th></tr></thead><tbody>\n<tr id=\"sl-4\"><td rowspan=\"7\" class=\"sl\">4</td><td class=\"shot\"><img src=\"prd-assets/screen-04.png\" alt=\"\"></td><td rowspan=\"7\">User entering the Name as per PAN, DOB and PAN Number to verify the PAN</td><td><p>On successful OTP verification the system shall navigate the customer to the PAN Details page. The mobile number verified in Sl. No 2 and 3 is carried forward and displayed as a non editable field. The Experian credit information call is triggered in the background; the customer is not made to wait for the response.</p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Header:</b> Shriram Credit logo (left) and the logout icon (right)</li><li><b>Page title:</b> \u201cPAN Details\u201d</li><li><b>Sub text:</b> \u201cPlease verify your PAN to get the best loan offers\u201d</li><li><b>Field labels:</b> \u201cMobile Number\u201d, \u201cName as per PAN\u201d, \u201cDOB\u201d, \u201cPAN Number\u201d</li><li><b>Placeholders:</b> DOB: \u201cDD/MM/YYYY\u201d; PAN Number: \u201cABCDE 1234 F\u201d</li><li><b>CTA:</b> \u201cContinue\u201d</li><li><b>Validation messages:</b> <ul><li>\u201c*Required\u201d \u2013 any field left empty <a class=\"todo-ref\" href=\"#CR-10\" onclick=\"var t=document.getElementById('CR-10');if(t){var d=t.closest('details');if(d)d.open=true;t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Defined in the PRD, not yet changed in the live LOS journey \u2013 open CR-10\">To be changed \u00b7 CR-10</a></li><li>\u201c*Invalid date\u201d \u2013 DOB typed before 01-Jan-1920 or after today <a class=\"todo-ref\" href=\"#CR-12\" onclick=\"var t=document.getElementById('CR-12');if(t){var d=t.closest('details');if(d)d.open=true;t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Defined in the PRD, not yet changed in the live LOS journey \u2013 open CR-12\">To be changed \u00b7 CR-12</a></li><li>PAN Number with fewer than 10 characters <a class=\"todo-ref\" href=\"#CR-16\" onclick=\"var t=document.getElementById('CR-16');if(t){var d=t.closest('details');if(d)d.open=true;t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Defined in the PRD, not yet changed in the live LOS journey \u2013 open CR-16\">To be changed \u00b7 CR-16</a></li><li>PAN character that does not fit its position \u2013 \u201c1st character must be a letter\u201d \u2026 \u201c10th character must be a letter\u201d (one message per position) <a class=\"todo-ref\" href=\"#CR-11\" onclick=\"var t=document.getElementById('CR-11');if(t){var d=t.closest('details');if(d)d.open=true;t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Defined in the PRD, not yet changed in the live LOS journey \u2013 open CR-11\">To be changed \u00b7 CR-11</a></li><li>\u201cPAN verification failed\u201d \u2013 name match below 60%, DOB not matching the PAN records, or PAN Number not available <a class=\"todo-ref\" href=\"#CR-13\" onclick=\"var t=document.getElementById('CR-13');if(t){var d=t.closest('details');if(d)d.open=true;t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Defined in the PRD, not yet changed in the live LOS journey \u2013 open CR-13\">To be changed \u00b7 CR-13</a> <a class=\"todo-ref\" href=\"#CR-15\" onclick=\"var t=document.getElementById('CR-15');if(t){var d=t.closest('details');if(d)d.open=true;t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Defined in the PRD, not yet changed in the live LOS journey \u2013 open CR-15\">To be changed \u00b7 CR-15</a> <a class=\"todo-ref\" href=\"#CR-17\" onclick=\"var t=document.getElementById('CR-17');if(t){var d=t.closest('details');if(d)d.open=true;t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Defined in the PRD, not yet changed in the live LOS journey \u2013 open CR-17\">To be changed \u00b7 CR-17</a></li></ul></li></ul></div><div class=\"spec\"><p><b>Drop off:</b></p><ul class=\"content-list\"><li><b>When:</b> The customer leaves the journey on this page before the PAN verification is completed (e.g. closes the browser or tab, or logs out)</li><li><b>On return:</b> When the customer comes back and logs in again with the mobile number (Sl. No 2) and OTP (Sl. No 3), on OTP verification success the customer lands on this PAN Details page</li></ul></div></td><td rowspan=\"7\" class=\"dp\"><b>Mobile Number:</b> 9597001623 (carried from Sl. No 2)<br><br><b>Name as per PAN:</b> up to 150 characters<br><br><b>DOB:</b><br>DD-MMM-YYYY<br><br><b>PAN Number:</b> ABCDE1234F<br><br><b>Submitted Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS<br><br><b>Experian API Triggered:</b><ul><li>Yes</li><li>No</li></ul><br><b>Experian Response:</b> <a class=\"pend-ref\" href=\"#P-09\" onclick=\"var t=document.getElementById('P-09');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Open pending clarification P-09\">Pending \u00b7 P-09</a></td><td rowspan=\"7\"><span class=\"tag ok\">Completed</span></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f04-logout.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Logout</p><p><b>Field Type:</b> Icon (top navigation, right corner)</p><p><b>Action:</b> On click, the customer is logged out and lands on the Landing page (Sl. No 1), as it is the exit page.</p></div></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f04-mobile.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Mobile Number</p><p><b>Field Type:</b> Display field</p><p><b>Prefilled Value:</b> Mobile number verified in Sl. No 2 and 3</p><p><b>Action:</b> Display only, not editable</p></div></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f04-name.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Name as per PAN</p><p><b>Field Type:</b> Text Field</p><p><b>Minimum Character:</b> 1 Char</p><p><b>Maximum Character:</b> 150 Char</p><p><b>Value Type:</b> User inputs</p><p><b>Input Value format:</b> Alphabets (A\u2013Z) and space only <a class=\"done-ref\" href=\"#CR-14\" onclick=\"var t=document.getElementById('CR-14');if(t){var d=t.closest('details');if(d)d.open=true;t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Changed in the live LOS journey \u2013 open CR-14\">Changed \u00b7 CR-14</a></p><p><b>Action:</b> User has to enter the name exactly as printed on the PAN card.</p><p><b>Condition:</b> Numbers and special characters cannot be entered. Whatever the user types is captured in CAPITAL letters (e.g. \u201cazhagar samy\u201d is captured as \u201cAZHAGAR SAMY\u201d). When an error is shown for this field, its border turns red.</p><p><b>Validation:</b> <ul><li>\u201c*Required\u201d \u2013 displayed when the user clicks Continue CTA without entering the name <a class=\"todo-ref\" href=\"#CR-10\" onclick=\"var t=document.getElementById('CR-10');if(t){var d=t.closest('details');if(d)d.open=true;t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Defined in the PRD, not yet changed in the live LOS journey \u2013 open CR-10\">To be changed \u00b7 CR-10</a></li><li>Name match with the PAN records below 60% \u2013 \u201cPAN verification failed\u201d is displayed when the user clicks Continue CTA <a class=\"todo-ref\" href=\"#CR-13\" onclick=\"var t=document.getElementById('CR-13');if(t){var d=t.closest('details');if(d)d.open=true;t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Defined in the PRD, not yet changed in the live LOS journey \u2013 open CR-13\">To be changed \u00b7 CR-13</a></li></ul></p></div></td></tr>\n<tr><td class=\"shot\"><figure class=\"state\"><img src=\"prd-assets/f04-dob.png\" alt=\"\"><figcaption>Before \u2013 type the date, or click the calendar icon</figcaption></figure><figure class=\"state\"><img src=\"prd-assets/f04-dob-calendar.png\" alt=\"\"><figcaption>After \u2013 calendar opened from the icon (date selected)</figcaption></figure><figure class=\"state\"><img src=\"prd-assets/f04-dob-invalid.png\" alt=\"\"><figcaption>Typed date outside 01-Jan-1920 to today \u2013 \u201c*Invalid date\u201d next to the DOB label</figcaption></figure></td><td><div class=\"spec\"><p><b>Field Name:</b> DOB</p><p><b>Field Type:</b> Text Field with calendar icon</p><p><b>Minimum Character:</b> 10 Char</p><p><b>Maximum Character:</b> 10 Char</p><p><b>Value Type:</b> User inputs or selects</p><p><b>Input Value format:</b> Numeric, DD/MM/YYYY</p><p><b>Action:</b> User can type the date of birth, or click the calendar icon and select it from the calendar pop up.</p><p><b>Condition:</b> The calendar allows dates from 01-Jan-1920 up to today only; a date outside this range cannot be selected. Any date can be typed; a typed date before 01-Jan-1920 or after today (e.g. 05/01/1900, year 1010 or 9090) is not accepted and the field border turns red. The age limit (18 to 70 years) is not checked on this page \u2013 it is validated on the Curated Offers page, so customers outside the limit are not blocked here and can be tracked (how many come in beyond the limit). When an error is shown for this field, its border turns red.</p><p><b>Validation:</b> <ul><li>\u201c*Required\u201d \u2013 displayed when the user clicks Continue CTA without entering the DOB <a class=\"todo-ref\" href=\"#CR-10\" onclick=\"var t=document.getElementById('CR-10');if(t){var d=t.closest('details');if(d)d.open=true;t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Defined in the PRD, not yet changed in the live LOS journey \u2013 open CR-10\">To be changed \u00b7 CR-10</a></li><li>\u201c*Invalid date\u201d \u2013 displayed next to the DOB label when the typed date is before 01-Jan-1920 or after today <a class=\"todo-ref\" href=\"#CR-12\" onclick=\"var t=document.getElementById('CR-12');if(t){var d=t.closest('details');if(d)d.open=true;t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Defined in the PRD, not yet changed in the live LOS journey \u2013 open CR-12\">To be changed \u00b7 CR-12</a></li><li>DOB not matching the DOB fetched from the PAN records \u2013 \u201cPAN verification failed\u201d is displayed when the user clicks Continue CTA <a class=\"todo-ref\" href=\"#CR-15\" onclick=\"var t=document.getElementById('CR-15');if(t){var d=t.closest('details');if(d)d.open=true;t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Defined in the PRD, not yet changed in the live LOS journey \u2013 open CR-15\">To be changed \u00b7 CR-15</a></li></ul></p></div></td></tr>\n<tr><td class=\"shot\"><figure class=\"state\"><img src=\"prd-assets/f04-pan.png\" alt=\"\"><figcaption>Before \u2013 empty</figcaption></figure><figure class=\"state\"><img src=\"prd-assets/f04-pan-filled.png\" alt=\"\"><figcaption>After \u2013 PAN shown with spaces: ABCDE 1234 F</figcaption></figure><figure class=\"state\"><img src=\"prd-assets/f04-pan-error.png\" alt=\"\"><figcaption>Error \u2013 field border turns red</figcaption></figure></td><td><div class=\"spec\"><p><b>Field Name:</b> PAN Number</p><p><b>Field Type:</b> Text Field</p><p><b>Minimum Character:</b> 10 Char</p><p><b>Maximum Character:</b> 10 Char</p><p><b>Value Type:</b> User inputs</p><p><b>Input Value format:</b> ABCDE1234F \u2013 characters 1 to 5 letters, 6 to 9 numbers, 10th a letter. Any letter is accepted in the 4th place <a class=\"todo-ref\" href=\"#CR-18\" onclick=\"var t=document.getElementById('CR-18');if(t){var d=t.closest('details');if(d)d.open=true;t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Defined in the PRD, not yet changed in the live LOS journey \u2013 open CR-18\">To be changed \u00b7 CR-18</a></p><p><b>Action:</b> User has to enter the 10 character PAN.</p><p><b>Condition:</b> The PAN is shown with spaces as ABCDE 1234 F (e.g. CBOPA 8195 B). A character that does not fit its position cannot be entered, and a message for that position is shown at once next to the PAN Number label:<ul><li>\u201c1st character must be a letter\u201d</li><li>\u201c2nd character must be a letter\u201d</li><li>\u201c3rd character must be a letter\u201d</li><li>\u201c4th character must be a letter\u201d</li><li>\u201c5th character must be a letter\u201d</li><li>\u201c6th character must be a number\u201d</li><li>\u201c7th character must be a number\u201d</li><li>\u201c8th character must be a number\u201d</li><li>\u201c9th character must be a letter\u201d</li><li>\u201c10th character must be a letter\u201d</li></ul>E.g. CBOPA8195B and CBOCA8195B can both be entered. <a class=\"todo-ref\" href=\"#CR-11\" onclick=\"var t=document.getElementById('CR-11');if(t){var d=t.closest('details');if(d)d.open=true;t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Defined in the PRD, not yet changed in the live LOS journey \u2013 open CR-11\">To be changed \u00b7 CR-11</a> <a class=\"todo-ref\" href=\"#CR-18\" onclick=\"var t=document.getElementById('CR-18');if(t){var d=t.closest('details');if(d)d.open=true;t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Defined in the PRD, not yet changed in the live LOS journey \u2013 open CR-18\">To be changed \u00b7 CR-18</a> When an error is shown for this field, its border turns red.</p><p><b>Validation:</b> <ul><li>\u201c*Required\u201d \u2013 displayed when the user clicks Continue CTA without entering the PAN Number <a class=\"todo-ref\" href=\"#CR-10\" onclick=\"var t=document.getElementById('CR-10');if(t){var d=t.closest('details');if(d)d.open=true;t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Defined in the PRD, not yet changed in the live LOS journey \u2013 open CR-10\">To be changed \u00b7 CR-10</a></li><li>PAN Number with fewer than 10 characters \u2013 error displayed next to the PAN Number label when the user clicks Continue CTA <a class=\"todo-ref\" href=\"#CR-16\" onclick=\"var t=document.getElementById('CR-16');if(t){var d=t.closest('details');if(d)d.open=true;t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Defined in the PRD, not yet changed in the live LOS journey \u2013 open CR-16\">To be changed \u00b7 CR-16</a></li><li>PAN Number not available in the PAN records \u2013 \u201cPAN verification failed\u201d is displayed when the user clicks Continue CTA <a class=\"todo-ref\" href=\"#CR-17\" onclick=\"var t=document.getElementById('CR-17');if(t){var d=t.closest('details');if(d)d.open=true;t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Defined in the PRD, not yet changed in the live LOS journey \u2013 open CR-17\">To be changed \u00b7 CR-17</a></li></ul></p></div></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f04-cta.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Continue</p><p><b>Field Type:</b> CTA (Button)</p><p><b>Action:</b> On click, the system shall validate all the fields on this page and then verify the PAN details in this order, each check running only when the previous one passes:<ol><li>PAN Number \u2013 must be available in the PAN records (100% match);</li><li>DOB \u2013 must match the DOB fetched from the PAN records (100% match);</li><li>Name as per PAN \u2013 must match the name in the PAN records by 60% or more.</li></ol>The customer\u2019s age (18 to 70 years) is not checked here \u2013 see DOB. If everything passes, the customer is taken to the next page (LOS to MF Central consent). If any check fails, the customer is not allowed to proceed and \u201cPAN verification failed\u201d is displayed. <a class=\"todo-ref\" href=\"#CR-13\" onclick=\"var t=document.getElementById('CR-13');if(t){var d=t.closest('details');if(d)d.open=true;t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Defined in the PRD, not yet changed in the live LOS journey \u2013 open CR-13\">To be changed \u00b7 CR-13</a> <a class=\"todo-ref\" href=\"#CR-15\" onclick=\"var t=document.getElementById('CR-15');if(t){var d=t.closest('details');if(d)d.open=true;t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Defined in the PRD, not yet changed in the live LOS journey \u2013 open CR-15\">To be changed \u00b7 CR-15</a> <a class=\"todo-ref\" href=\"#CR-17\" onclick=\"var t=document.getElementById('CR-17');if(t){var d=t.closest('details');if(d)d.open=true;t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Defined in the PRD, not yet changed in the live LOS journey \u2013 open CR-17\">To be changed \u00b7 CR-17</a></p><p><b>Condition:</b> Always enabled.</p></div></td></tr>\n</tbody></table>\n<h2>Module 4 \u2013 Mutual Fund Portfolio Fetch (MF Central)</h2>\n<p class=\"screens\">Screen 05) LOS to MF Central Redirection consent page \u00b7 Screen 06) LOS to MF Central Redirection loading page \u00b7 Screen 07.1) PAN and Mobile Number Combination No Data Available</p>\n<table><thead><tr><th style=\"width:52px\">SL.No</th><th style=\"width:330px\">Screenshot</th><th style=\"width:190px\">Functionality</th><th>Description</th><th style=\"width:190px\">Data Points Required</th><th style=\"width:165px\">Status</th></tr></thead><tbody>\n<tr id=\"sl-5\"><td rowspan=\"4\" class=\"sl\">5</td><td class=\"shot\"><img src=\"prd-assets/screen-05.png\" alt=\"\"></td><td rowspan=\"4\">User giving consent to fetch the mutual fund portfolio from MF Central and clicking the \u201cCheck Credit Limit\u201d CTA</td><td><p>On successful PAN verification (Sl. No 4) the system shall navigate the customer to the Credit Limit Against Mutual Fund page. The PAN Number verified in Sl. No 4 is carried forward and displayed as a non editable field. The customer gives consent to fetch the mutual fund portfolio from MF Central and clicks Check Credit Limit; the customer is then redirected to MF Central, where the portfolio for the entered PAN and mobile number is fetched to determine the eligible credit limit and the loan offers. The left side of the page shows the loan highlights and the \u201cHow it works\u201d steps (display only). The top navigation (Credit Score and Profile icons) is described in Sl. No 6.</p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Header:</b> Top navigation \u2013 Shriram Credit logo (left); Credit Score icon and Profile icon (right) \u2013 see Sl. No 6</li><li><b>Left panel:</b> \u201cInterest rates starting from 10.5% p.a.*\u201d; \u201cGet a Loan up to 75% of your eligible Mutual Fund portfolio\u201d; \u201cInterest-only EMI payments\u201d; \u201cDisbursal in 2 hours post application\u201d</li><li><b>How it works:</b> \u201cHow it works\u201d \u2013 \u201cApply for loan within mins.\u201d with 9 steps:<ol><li>Check your eligibility, credit limit, and interest rates.</li><li>Select mutual fund units to pledge.</li><li>Complete your KYC verification.</li><li>Pledge your selected mutual fund units.</li><li>Your loan amount is approved, Sanction Letter with Key Fact Statement (KFS) is issued.</li><li>e-Sign the loan agreement.</li><li>Your loan account is ready to use.</li><li>Withdraw funds as needed.</li><li>Repay the loan at your convenience and regain complete control of your mutual fund holdings.</li></ol></li><li><b>Card title:</b> \u201cCredit Limit Against Mutual Fund\u201d</li><li><b>Sub text:</b> \u201cMutual fund will be fetched from MF Central to determine the eligible credit limit and best loan offers\u201d</li><li><b>Field label:</b> \u201cPAN Number\u201d</li><li><b>Consent checkbox text:</b> \u201cI authorize Shriram Credit to fetch my mutual fund portfolio holdings from MF Central to assess my eligibility and credit limit for a Loan Against Mutual Funds.\u201d</li><li><b>CTA:</b> \u201cCheck Credit Limit\u201d \u2013 grey until the consent is ticked, then yellow</li><li><b>Validation messages:</b> None on this page \u2013 the CTA stays grey until the consent is ticked</li></ul></div><div class=\"spec\"><p><b>Drop off:</b></p><ul class=\"content-list\"><li><b>When:</b> The customer leaves the journey on this page before clicking Check Credit Limit (e.g. closes the browser or tab)</li><li><b>On return:</b> When the customer comes back and logs in again with the mobile number (Sl. No 2) and OTP (Sl. No 3), on OTP verification success the customer lands on this page, with the PAN Number prefilled</li></ul></div></td><td rowspan=\"4\" class=\"dp\"><b>PAN Number:</b> ABCDE1234F (carried from Sl. No 4)<br><br><b>MF Central Consent:</b><ul><li>Yes</li><li>No</li></ul><br><b>Consent Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS<br><br><b>Check Credit Limit Clicked Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS</td><td rowspan=\"4\"><span class=\"tag ok\">Completed</span></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f05-pan.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> PAN Number</p><p><b>Field Type:</b> Display field</p><p><b>Prefilled Value:</b> PAN Number verified in Sl. No 4, shown with spaces as ABCDE 1234 F</p><p><b>Action:</b> Display only, not editable</p></div></td></tr>\n<tr><td class=\"shot\"><figure class=\"state\"><img src=\"prd-assets/f05-consent.png\" alt=\"\"><figcaption>Before \u2013 unticked (default)</figcaption></figure><figure class=\"state\"><img src=\"prd-assets/f05-consent-ticked.png\" alt=\"\"><figcaption>After \u2013 ticked</figcaption></figure></td><td><div class=\"spec\"><p><b>Field Name:</b> (Checkbox) MF Central consent</p><p><b>Field Type:</b> Check box</p><p><b>Action:</b> User has to tick this checkbox to authorize Shriram Credit to fetch the mutual fund portfolio holdings from MF Central to assess the eligibility and credit limit for a Loan Against Mutual Funds.</p><p><b>Condition:</b> Unticked by default. Check Credit Limit CTA is enabled only when this checkbox is ticked, so no validation is shown for the checkbox.</p></div></td></tr>\n<tr><td class=\"shot\"><figure class=\"state\"><img src=\"prd-assets/f05-cta.png\" alt=\"\"><figcaption>Before \u2013 disabled (grey) until the consent is ticked</figcaption></figure><figure class=\"state\"><img src=\"prd-assets/f05-cta-enabled.png\" alt=\"\"><figcaption>After \u2013 enabled once the consent is ticked</figcaption></figure></td><td><div class=\"spec\"><p><b>Field Name:</b> Check Credit Limit</p><p><b>Field Type:</b> CTA (Button)</p><p><b>Action:</b> On click, the system shall record the MF Central consent and open the MF Central redirection pop up (Sl. No 7); after the 5 second countdown the customer is redirected to MF Central to fetch the mutual fund portfolio for the entered PAN Number and mobile number.</p><p><b>Condition:</b> CTA is disabled (grey) and cannot be clicked until the consent checkbox is ticked, so no validation is shown.</p></div></td></tr>\n<tr id=\"sl-7\"><td rowspan=\"6\" class=\"sl\">7</td><td class=\"shot\"><img src=\"prd-assets/f07-redirect.png\" alt=\"\"></td><td rowspan=\"6\">MF Central redirection pop up after clicking \u201cCheck Credit Limit\u201d \u2013 countdown, then redirect to MF Central</td><td><p>On clicking Check Credit Limit (Sl. No 5) the system shall open the MF Central redirection pop up over the page. The pop up counts down from 5 seconds to 1 second (\u201cRedirecting to MF Central in 5 seconds\u201d \u2026 \u201c1 seconds\u201d) while the progress bar fills; when the countdown ends, MF Central checks the PAN and mobile number combination: if data is available the customer is redirected to MF Central (Sl. No 8), otherwise the \u201cisn\u2019t linked to the PAN\u201d page is shown (Sl. No 7.1). If the customer clicks the close icon, a confirmation pop up asks whether to cancel the portfolio fetch.</p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Logo:</b> MF Central logo</li><li><b>Countdown:</b> \u201cRedirecting to MF Central in N seconds\u201d \u2013 N counts down 5, 4, 3, 2, 1; a yellow progress bar fills as it counts</li><li><b>Heading:</b> \u201cHere\u2019s what you need to do\u201d</li><li><b>Steps:</b> <ol><li>Enter the 6-digit OTP received from MF Central on your mobile number.</li><li>Select all the AMCs and continue</li></ol></li><li><b>Note:</b> \u201cNote You\u2019ll return to the process automatically after completing this step.\u201d</li><li><b>Close icon:</b> (X) at the top right</li><li><b>Cancel confirmation pop up:</b> \u201cAre you sure you want to cancel your mutual fund portfolio fetch?\u201d with \u201cNo, don\u2019t\u201d and \u201cYes, cancel\u201d</li></ul></div></td><td rowspan=\"6\" class=\"dp\"><b>Redirection Pop up Shown Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS<br><br><b>Cancel Clicked:</b><ul><li>Yes, cancel</li><li>No, don\u2019t</li></ul><br><b>Cancel Clicked Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS<br><br><b>Redirected to MF Central Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS</td><td rowspan=\"6\"><span class=\"tag ok\">Completed</span></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f07-countdown.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Redirection countdown</p><p><b>Field Type:</b> Timer with progress bar</p><p><b>Action:</b> Starts at 5 seconds and counts down to 1 second; when it ends the customer is redirected to the MF Central page automatically.</p><p><b>Condition:</b> The countdown stops while the cancel confirmation pop up is open.</p></div></td></tr>\n<tr><td class=\"shot\"><img class=\"icon\" src=\"prd-assets/f07-close.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> (X) Close icon</p><p><b>Field Type:</b> Icon</p><p><b>Action:</b> On click, the system shall open the cancel confirmation pop up.</p></div></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f07-cancel.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Cancel confirmation pop up</p><p><b>Field Type:</b> Pop up</p><p><b>Action:</b> Shows \u201cAre you sure you want to cancel your mutual fund portfolio fetch?\u201d with two CTAs: \u201cNo, don\u2019t\u201d and \u201cYes, cancel\u201d.</p></div></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f07-no.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> No, don\u2019t</p><p><b>Field Type:</b> CTA (text button)</p><p><b>Action:</b> On click, the confirmation pop up closes and the redirection pop up continues, with the countdown starting again from 5 seconds.</p></div></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f07-yes.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Yes, cancel</p><p><b>Field Type:</b> CTA (Button)</p><p><b>Action:</b> On click, both pop ups close, the portfolio fetch is cancelled and the customer is back on the LOS to MF Central consent page (Sl. No 5).</p></div></td></tr>\n<tr id=\"sl-7.1\"><td rowspan=\"4\" class=\"sl\">7.1</td><td class=\"shot\"><img src=\"prd-assets/screen-09.png\" alt=\"\"></td><td rowspan=\"4\">PAN and mobile number not linked \u2013 MF Central has no data for the combination</td><td><p>After the redirection countdown (Sl. No 7), when MF Central has no data for the PAN and mobile number combination, the customer is not taken to MF Central; a separate page is shown saying the mobile number is not linked to the PAN entered.</p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Header:</b> Top navigation \u2013 see Sl. No 6</li><li><b>Illustration:</b> Three cards with question marks</li><li><b>Message:</b> \u201cThe identifier below isn\u2019t linked to the PAN you entered\u201d</li><li><b>Mobile number:</b> Phone icon with the masked mobile number (e.g. +919XXXX1623)</li><li><b>CTA:</b> \u201cRefresh\u201d with the refresh icon</li></ul></div></td><td rowspan=\"4\" class=\"dp\"><b>Not Linked Page Shown Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS<br><br><b>Refresh Clicked:</b><ul><li>Yes</li><li>No</li></ul><br><b>Refresh Clicked Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS</td><td rowspan=\"4\"><span class=\"tag ok\">Completed</span></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f09-message.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Not linked message</p><p><b>Field Type:</b> Display text</p><p><b>Action:</b> \u201cThe identifier below isn\u2019t linked to the PAN you entered\u201d \u2013 display only.</p></div></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f09-mobile.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Mobile number</p><p><b>Field Type:</b> Display field</p><p><b>Prefilled Value:</b> Mobile number verified in Sl. No 2 and 3, masked as +91 + first digit + XXXX + last 4 digits</p><p><b>Action:</b> Display only, not editable</p></div></td></tr>\n<tr><td class=\"shot\"><img class=\"icon\" src=\"prd-assets/f09-refresh.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Refresh</p><p><b>Field Type:</b> CTA</p><p><b>Action:</b> On click, the MF Central fetch is tried again <a class=\"pend-ref\" href=\"#P-21\" onclick=\"var t=document.getElementById('P-21');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Open pending clarification P-21\">Pending \u00b7 P-21</a></p></div></td></tr>\n</tbody></table>\n<h2>Module 5 \u2013 Mutual Fund Portfolio Fetching</h2>\n<p class=\"screens\">MF Central pages (owned by MF Central \u2013 LOS has no access; issues raised to MF Central by mail): Screen 07.2) OTP \u00b7 07.3) Select AMCs \u00b7 07.4) Portfolio Fetching \u00b7 07.5) Portfolio Discovery Complete</p>\n<table><thead><tr><th style=\"width:52px\">SL.No</th><th style=\"width:330px\">Screenshot</th><th style=\"width:190px\">Functionality</th><th>Description</th><th style=\"width:190px\">Data Points Required</th><th style=\"width:165px\">Status</th></tr></thead><tbody>\n<tr id=\"sl-8\"><td rowspan=\"4\" class=\"sl\">8</td><td class=\"shot\"><img src=\"prd-assets/screen-08.png\" alt=\"\"></td><td rowspan=\"4\">User entering the 6-digit OTP received from MF Central and clicking \u201cAuthenticate with OTP\u201d</td><td><p>After the redirection countdown (Sl. No 7), when MF Central has data for the PAN and mobile number combination, the customer is taken to the MF Central page (outside the LOS). MF Central sends a 6-digit OTP to the mobile number; the customer enters it and clicks Authenticate with OTP to authorise sharing of the mutual fund portfolio for Loan Against Mutual Funds. <b>MF Central page:</b> this page is owned and run by MF Central, outside the LOS \u2013 the LOS redirects the customer to MF Central and MF Central redirects the customer back to the LOS when its process is complete. The LOS has no access to change it; any functional issue on this page is raised to MF Central by mail.</p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Logo:</b> MF Central logo</li><li><b>Usecase card:</b> \u201cUsecase: Loan Against Mutual Funds\u201d; \u201cBy authenticating, you authorize requesting platform registered with SEBI/RBI to securely access your mutual fund portfolio data from MF Central for Loan Against Mutual Funds\u201d</li><li><b>OTP label:</b> \u201cEnter your 6-digit OTP\u201d</li><li><b>OTP boxes:</b> 6 boxes; the digits are masked as dots</li><li><b>CTA:</b> \u201cAuthenticate with OTP\u201d \u2013 light until all 6 digits are entered, then dark</li><li><b>Security card:</b> \u201cSecure Authentication for Portfolio Access\u201d: We do not store your OTP or sensitive credentials; Data is end to end encrypted and securely shared only on authentication of OTP by Investor; Access is limited to Personal Finance Management only; Consent artifact is valid for one time data sharing; MF Central follows an every time consent model for sharing the data</li></ul></div></td><td rowspan=\"4\" class=\"dp\"><b>MF Central OTP Authenticated Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS<br><br><b>MF Central OTP Status:</b><ul><li>Success</li><li>Failure</li></ul></td><td rowspan=\"4\"><span class=\"tag ok\">Completed</span></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f08-usecase.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Usecase card</p><p><b>Field Type:</b> Display</p><p><b>Action:</b> Shows the use case (Loan Against Mutual Funds) and the authorisation text \u2013 display only.</p></div></td></tr>\n<tr><td class=\"shot\"><figure class=\"state\"><img src=\"prd-assets/f08-otp.png\" alt=\"\"><figcaption>Before \u2013 empty</figcaption></figure><figure class=\"state\"><img src=\"prd-assets/f08-otp-filled.png\" alt=\"\"><figcaption>After \u2013 6 digits entered, shown as dots</figcaption></figure></td><td><div class=\"spec\"><p><b>Field Name:</b> Enter your 6-digit OTP</p><p><b>Field Type:</b> OTP field (6 boxes)</p><p><b>Minimum Character:</b> 6 Char</p><p><b>Maximum Character:</b> 6 Char</p><p><b>Input Value format:</b> Numeric, masked</p><p><b>Action:</b> User has to enter the 6-digit OTP received from MF Central on the mobile number.</p><p><b>Validation:</b> Wrong OTP handling is done by MF Central (not controlled by the LOS).</p></div></td></tr>\n<tr><td class=\"shot\"><figure class=\"state\"><img src=\"prd-assets/f08-auth.png\" alt=\"\"><figcaption>Before \u2013 light, until 6 digits are entered</figcaption></figure><figure class=\"state\"><img src=\"prd-assets/f08-auth-enabled.png\" alt=\"\"><figcaption>After \u2013 enabled once 6 digits are entered</figcaption></figure></td><td><div class=\"spec\"><p><b>Field Name:</b> Authenticate with OTP</p><p><b>Field Type:</b> CTA (Button)</p><p><b>Action:</b> On click with the correct OTP, the customer moves to Select AMCs (Sl. No 9).</p><p><b>Condition:</b> Enabled only when all 6 digits are entered.</p></div></td></tr>\n<tr id=\"sl-9\"><td rowspan=\"4\" class=\"sl\">9</td><td class=\"shot\"><img src=\"prd-assets/screen-10.png\" alt=\"\"></td><td rowspan=\"4\">User selecting the AMCs whose mutual funds are to be fetched and clicking \u201cContinue to Portfolio Import\u201d</td><td><p>MF Central lists every AMC in which the customer holds mutual funds, with the market value of the holding. The customer selects the AMCs to share; only the funds of the selected AMCs are fetched \u2013 funds of AMCs that are not selected are not fetched. <b>MF Central page:</b> this page is owned and run by MF Central, outside the LOS \u2013 the LOS redirects the customer to MF Central and MF Central redirects the customer back to the LOS when its process is complete. The LOS has no access to change it; any functional issue on this page is raised to MF Central by mail.</p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Logo:</b> MF Central logo</li><li><b>Usecase:</b> \u201cUsecase: Loan Against Mutual Funds\u201d</li><li><b>Title:</b> \u201cSelect AMCs for Loan Assessment\u201d</li><li><b>Select all:</b> \u201cSelect All AMCs\u201d checkbox</li><li><b>AMC list:</b> One row per AMC: checkbox, AMC logo, AMC name (e.g. DSP Mutual Fund, HDFC Mutual Fund, PPFAS Mutual Fund, Shriram Mutual Fund) and \u201cMARKET VALUE\u201d (e.g. \u20b920,008.48)</li><li><b>CTA:</b> \u201cContinue to Portfolio Import\u201d \u2013 grey until at least one AMC is selected</li></ul></div></td><td rowspan=\"4\" class=\"dp\"><b>AMCs Listed:</b> names and market values shown<br><br><b>AMCs Selected:</b> names of the selected AMCs<br><br><b>Continue Clicked Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS</td><td rowspan=\"4\"><span class=\"tag ok\">Completed</span></td></tr>\n<tr><td class=\"shot\"><figure class=\"state\"><img src=\"prd-assets/f10-selectall.png\" alt=\"\"><figcaption>Before \u2013 unticked</figcaption></figure><figure class=\"state\"><img src=\"prd-assets/f10-selectall-ticked.png\" alt=\"\"><figcaption>After \u2013 ticked</figcaption></figure></td><td><div class=\"spec\"><p><b>Field Name:</b> Select All AMCs</p><p><b>Field Type:</b> Check box</p><p><b>Action:</b> Ticking selects every AMC in the list; unticking clears them all.</p><p><b>Condition:</b> Ticked automatically when every AMC is selected one by one; unticked when any AMC is unselected.</p></div></td></tr>\n<tr><td class=\"shot\"><figure class=\"state\"><img src=\"prd-assets/f10-amc.png\" alt=\"\"><figcaption>Before \u2013 not selected</figcaption></figure><figure class=\"state\"><img src=\"prd-assets/f10-amc-ticked.png\" alt=\"\"><figcaption>After \u2013 selected (row highlighted)</figcaption></figure></td><td><div class=\"spec\"><p><b>Field Name:</b> AMC row</p><p><b>Field Type:</b> Check box with AMC logo, name and market value</p><p><b>Action:</b> User ticks each AMC whose funds are to be fetched.</p><p><b>Condition:</b> Only the selected AMCs\u2019 funds are fetched; unselected AMCs\u2019 funds are not fetched.</p></div></td></tr>\n<tr><td class=\"shot\"><figure class=\"state\"><img src=\"prd-assets/f10-cta.png\" alt=\"\"><figcaption>Before \u2013 disabled (grey) until an AMC is selected</figcaption></figure><figure class=\"state\"><img src=\"prd-assets/f10-cta-enabled.png\" alt=\"\"><figcaption>After \u2013 enabled</figcaption></figure></td><td><div class=\"spec\"><p><b>Field Name:</b> Continue to Portfolio Import</p><p><b>Field Type:</b> CTA (Button)</p><p><b>Action:</b> On click, MF Central starts fetching the portfolio of the selected AMCs (Sl. No 10).</p><p><b>Condition:</b> Disabled until at least one AMC is selected.</p></div></td></tr>\n<tr id=\"sl-10\"><td rowspan=\"3\" class=\"sl\">10</td><td class=\"shot\"><img src=\"prd-assets/screen-10-fetch.png\" alt=\"\"></td><td rowspan=\"3\">MF Central fetching the mutual fund portfolio of the selected AMCs</td><td><p>After Continue to Portfolio Import, MF Central shows the Fetching Your Portfolio screen while it connects and fetches the portfolio of the selected AMCs. No action is needed from the customer; when the fetch is complete the Portfolio Discovery Complete screen is shown (Sl. No 11). <b>MF Central page:</b> this page is owned and run by MF Central, outside the LOS \u2013 the LOS redirects the customer to MF Central and MF Central redirects the customer back to the LOS when its process is complete. The LOS has no access to change it; any functional issue on this page is raised to MF Central by mail.</p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Logo:</b> MF Central logo</li><li><b>Icon:</b> Portfolio icon with an arrow</li><li><b>Title:</b> \u201cFetching Your Portfolio...\u201d</li><li><b>Sub text:</b> \u201cConnecting to MF Central and fetching your investment data\u201d</li><li><b>Progress steps:</b> \u201cConnecting to MF Central\u201d (purple bar, loading icon) and \u201cFetching your portfolio\u201d (green bar, shield icon)</li><li><b>Status line:</b> \u201cProcessing portfolio data\u201d with three dots</li><li><b>Footer:</b> \u201c256-bit encryption\u201d \u00b7 \u201cISO 27001 compliant\u201d</li></ul></div></td><td rowspan=\"3\" class=\"dp\"><b>Portfolio Fetch Started Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS<br><br><b>Portfolio Fetch Status:</b><ul><li>Success</li><li>Failure</li></ul></td><td rowspan=\"3\"><span class=\"tag ok\">Completed</span></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f10-steps.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Progress steps</p><p><b>Field Type:</b> Progress bars</p><p><b>Action:</b> Shows the two steps \u2013 Connecting to MF Central, then Fetching your portfolio \u2013 as they progress; display only.</p><p><b>Condition:</b> Failure handling is done by MF Central (not controlled by the LOS).</p></div></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f10-processing.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Processing portfolio data</p><p><b>Field Type:</b> Status text</p><p><b>Action:</b> Display only, shown while the data is processed. When the fetch completes the customer moves to Sl. No 11 automatically.</p></div></td></tr>\n<tr id=\"sl-11\"><td rowspan=\"3\" class=\"sl\">11</td><td class=\"shot\"><img src=\"prd-assets/screen-11.png\" alt=\"\"></td><td rowspan=\"3\">Portfolio Discovery Complete \u2013 MF Central confirms the fetch and redirects the customer back to the LOS</td><td><p>When the portfolio is fetched, MF Central shows the Portfolio Discovery Complete screen and redirects the customer back to the LOS within 3 seconds (\u201cRedirecting in 3s\u201d counting down to 0s), to the Redirecting to Dashboard page in the LOS (Sl. No 12). <b>MF Central page:</b> this page is owned and run by MF Central, outside the LOS \u2013 the LOS redirects the customer to MF Central and MF Central redirects the customer back to the LOS when its process is complete. The LOS has no access to change it; any functional issue on this page is raised to MF Central by mail.</p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Logo:</b> MF Central logo</li><li><b>Icon:</b> Green tick</li><li><b>Title:</b> \u201cPortfolio Discovery Complete!\u201d</li><li><b>Message:</b> \u201cYour mutual fund portfolio has been successfully fetched and will now be sent to the Requested Platform.\u201d</li><li><b>Status:</b> \u201cData fetched successfully\u201d \u2013 \u201cAll portfolio information secured\u201d</li><li><b>Redirect:</b> \u201cRedirecting in Ns\u201d with an arrow \u2013 N counts down from 3 to 0</li><li><b>Footer:</b> \u201c256-bit encryption\u201d \u00b7 \u201cISO 27001 compliant\u201d</li></ul></div></td><td rowspan=\"3\" class=\"dp\"><b>Portfolio Fetch Completed Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS<br><br><b>Redirected to LOS Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS</td><td rowspan=\"3\"><span class=\"tag ok\">Completed</span></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f12-status.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Data fetched successfully</p><p><b>Field Type:</b> Status banner</p><p><b>Action:</b> Confirms the portfolio was fetched \u2013 display only.</p></div></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f12-redirect.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Redirecting in Ns</p><p><b>Field Type:</b> Timer</p><p><b>Action:</b> Counts down from 3 seconds to 0; then the customer is redirected to the LOS \u2013 Redirecting to Dashboard (Sl. No 12).</p></div></td></tr>\n</tbody></table>\n<h2>Module 6 \u2013 Mutual Fund Portfolio Processing</h2>\n<p class=\"screens\">Screen 08) MF Central to LOS Redirecting Page \u00b7 09) Fetching Mutual Fund Portfolio \u00b7 10) Analysing Mutual Fund Portfolio \u00b7 11) Generating Loan Offers</p>\n<table><thead><tr><th style=\"width:52px\">SL.No</th><th style=\"width:330px\">Screenshot</th><th style=\"width:190px\">Functionality</th><th>Description</th><th style=\"width:190px\">Data Points Required</th><th style=\"width:165px\">Status</th></tr></thead><tbody>\n<tr id=\"sl-12\"><td class=\"sl\">12</td><td class=\"shot\"><img src=\"prd-assets/screen-13.png\" alt=\"\"></td><td>Customer returns from MF Central to the LOS \u2013 Redirecting to Dashboard</td><td><p>After MF Central redirects the customer back (Sl. No 11), the LOS shows the Redirecting to Dashboard screen. No action is needed from the customer; the Fetching Mutual Fund Portfolio screen opens automatically (Sl. No 13).</p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Header:</b> Top navigation \u2013 see Sl. No 6</li><li><b>Message:</b> \u201cRedirecting to Dashboard...\u201d</li></ul></div></td><td class=\"dp\"><b>Returned to LOS Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS</td><td><span class=\"tag ok\">Completed</span></td></tr>\n<tr id=\"sl-13\"><td class=\"sl\">13</td><td class=\"shot\"><img src=\"prd-assets/screen-14.png\" alt=\"\"></td><td>LOS fetching the mutual fund portfolio received from MF Central</td><td><p>The LOS shows a loader pop up over the Credit Limit Against Mutual Fund page while it fetches the mutual fund portfolio shared by MF Central. No action is needed from the customer; the next screen opens automatically (Sl. No 14).</p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Loader:</b> Animated placeholder cards \u2013 only the loader pop up is shown; the page behind is blurred</li><li><b>Title:</b> \u201cFetching your mutual fund portfolio..\u201d</li><li><b>Sub text:</b> \u201cThis might take a min, thanks for your patience\u201d</li></ul></div></td><td class=\"dp\"><b>Portfolio Received in LOS Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS<br><br><b>Portfolio Fetch Status:</b><ul><li>Success</li><li>Failure</li></ul></td><td><span class=\"tag ok\">Completed</span></td></tr>\n<tr id=\"sl-14\"><td class=\"sl\">14</td><td class=\"shot\"><img src=\"prd-assets/screen-15.png\" alt=\"\"></td><td>LOS analysing the mutual fund portfolio</td><td><p>The LOS shows a loader pop up over the (blurred) Curated Offers page while it analyses the portfolio \u2013 eligible and non eligible funds and their values. No action is needed from the customer; the next screen opens automatically (Sl. No 15).</p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Loader:</b> Animated placeholder cards \u2013 only the loader pop up is shown; the page behind is blurred</li><li><b>Title:</b> \u201cAnalyzing your mutual fund portfolio..\u201d</li><li><b>Sub text:</b> \u201cThis might take a min, thanks for your patience\u201d</li></ul></div></td><td class=\"dp\"><b>Portfolio Analysis Completed Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS</td><td><span class=\"tag ok\">Completed</span></td></tr>\n<tr id=\"sl-15\"><td class=\"sl\">15</td><td class=\"shot\"><img src=\"prd-assets/screen-16-gen.png\" alt=\"\"></td><td>LOS generating the best loan offers</td><td><p>The LOS shows a loader pop up over the (blurred) Curated Offers page while it generates the loan offers from the analysed portfolio. No action is needed from the customer; the next screen opens automatically (the Curated Offers page, Sl. No 16).</p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Loader:</b> Animated placeholder cards \u2013 only the loader pop up is shown; the page behind is blurred</li><li><b>Title:</b> \u201cGenerating best loan offers for you\u201d</li><li><b>Sub text:</b> \u201cThis might take a min, thanks for your patience\u201d</li></ul></div></td><td class=\"dp\"><b>Loan Offers Generated Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS</td><td><span class=\"tag wip\">WIP</span></td></tr>\n</tbody></table>\n<h2>Module 7 \u2013 Curated Offers</h2>\n<p class=\"screens\">Screen 12) Curated Offers Page \u00b7 12.1.1 \u2013 12.1.3) How is it calculated \u00b7 12.2) Refresh portfolio \u00b7 12.2) Curated offers page for drop off view</p>\n<table><thead><tr><th style=\"width:52px\">SL.No</th><th style=\"width:330px\">Screenshot</th><th style=\"width:190px\">Functionality</th><th>Description</th><th style=\"width:190px\">Data Points Required</th><th style=\"width:165px\">Status</th></tr></thead><tbody>\n<tr id=\"sl-16\"><td rowspan=\"15\" class=\"sl\">16</td><td class=\"shot\"><img src=\"prd-assets/screen-16.png\" alt=\"\"></td><td rowspan=\"15\">Customer viewing the credit limit and loan offer worked out from the mutual fund portfolio, and starting the application</td><td><p>After the loan offers are generated (Sl. No 15), the customer lands on the Curated Offers page. It shows the credit limit worked out from the eligible mutual fund portfolio, the interest rate, processing fee and tenure, the total portfolio value and every mutual fund fetched from MF Central. Every time the customer lands on this page a green toast \u201cPortfolio fetched successfully\u201d is shown and disappears after 3 seconds. The customer clicks Start Application to continue to the mutual fund selection (location access Sl. No 17.1, then Sl. No 17). The 18 to 70 years age limit (from the DOB entered in Sl. No 4) is checked on this page. Written from the prototype screen \u2013 to be checked against UAT <a class=\"pend-ref\" href=\"#P-23\" onclick=\"var t=document.getElementById('P-23');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Open pending clarification P-23\">Pending \u00b7 P-23</a></p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Header:</b> Top navigation \u2013 see Sl. No 6</li><li><b>Banner:</b> Ticker \u2013 scrolls up through three messages one after another and repeats: \u201cBorrow only what you need and pay interest only on the utilised amount\u201d, \u201cAvail a loan of up to 75% of your eligible Mutual Fund portfolio\u201d, \u201cQuick digital process with fast loan disbursal\u201d</li><li><b>Title:</b> \u201cCurated offers for you\u201d</li><li><b>Sub text:</b> \u201cProcessing fee and monthly EMI shown are indicative. Final values will depend on the actual loan amount availed.\u201d</li><li><b>Hover messages:</b> Interest Rate: \u201cThe interest rate applicable to your loan. Interest is charged only on the amount you withdraw from your sanctioned credit limit.\u201d \u00b7 Processing Fee: \u201cA one-time processing fee charged on your sanctioned loan limit at the time of loan disbursal. Taxes, if applicable, will be charged extra.\u201d \u00b7 Tenure in Months: \u201cThe repayment period applicable to your loan facility. The tenure shown is indicative and subject to the terms of your loan agreement.\u201d</li><li><b>Product card:</b> \u201cCredit Limit\u201d with the amount (e.g. \u20b9 6,19,13,200, underlined and clickable); \u201cInterest Rate\u201d (e.g. 10.50% p.a.), \u201cProcessing Fee\u201d (e.g. \u20b9 3,09,566), \u201cTenure in Months\u201d (e.g. 12); \u201cKFS document\u201d with an arrow; CTA \u201cStart Application\u201d</li><li><b>Portfolio summary:</b> \u201cTotal Portfolio Value\u201d (e.g. \u20b9 12,04,62,749.99); \u201cLast updated: DD-MM-YYYY HH:MM:SS\u201d with \u201cRefresh portfolio\u201d</li><li><b>Mobile strip:</b> Masked mobile number (e.g. +919XXXX1623), number of securities and total value (e.g. 13 Security \u2022 \u20b9 12,04,62,749.99)</li><li><b>Fund cards:</b> One card per mutual fund: AMC logo, fund name, \u201cFolio No.\u201d, \u201cNo. of Units\u201d, \u201cCurrent Value\u201d</li><li><b>Validation message:</b> \u201cApplicant must be between 18 to 70 years of age.\u201d \u2013 when the customer\u2019s age is outside 18 to 70 <a class=\"pend-ref\" href=\"#P-18\" onclick=\"var t=document.getElementById('P-18');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Open pending clarification P-18\">Pending \u00b7 P-18</a></li><li><b>Success toast:</b> \u201cPortfolio fetched successfully\u201d \u2013 shown at the bottom of the page every time the customer lands on this page; \u201cPortfolio refreshed successfully\u201d after Refresh Portfolio (Sl. No 16.2). Disappears automatically after 3 seconds</li></ul></div><div class=\"spec\"><p><b>Drop off:</b></p><ul class=\"content-list\"><li><b>When:</b> The customer leaves the journey on this page without clicking Start Application</li><li><b>On return:</b> After logging in again with the mobile number (Sl. No 2) and OTP (Sl. No 3), the customer lands on the drop off view of this page (Sl. No 16.3) <a class=\"pend-ref\" href=\"#P-23\" onclick=\"var t=document.getElementById('P-23');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Open pending clarification P-23\">Pending \u00b7 P-23</a></li></ul></div></td><td rowspan=\"15\" class=\"dp\"><b>Credit Limit:</b> amount<br><br><b>Interest Rate:</b> 10.5% p.a.<br><br><b>Processing Fee:</b> amount (slab on the sanctioned limit, without GST)<br><br><b>Tenure in Months:</b> 12<br><br><b>Total Portfolio Value:</b> amount<br><br><b>Number of Securities:</b> number<br><br><b>Age Check:</b><ul><li>Within 18 to 70</li><li>Outside 18 to 70</li></ul><br><b>KFS document Clicked:</b><ul><li>Yes</li><li>No</li></ul><br><b>Curated Offers Viewed Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS<br><br><b>Start Application Clicked Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS</td><td rowspan=\"15\"><span class=\"tag wip\">WIP</span></td></tr>\n<tr><td class=\"shot\"><figure class=\"state\"><img src=\"prd-assets/f16-tk1.png\" alt=\"\"><figcaption>Message 1</figcaption></figure><figure class=\"state\"><img src=\"prd-assets/f16-tk2.png\" alt=\"\"><figcaption>Message 2</figcaption></figure><figure class=\"state\"><img src=\"prd-assets/f16-tk3.png\" alt=\"\"><figcaption>Message 3</figcaption></figure></td><td><div class=\"spec\"><p><b>Field Name:</b> Info banner (ticker)</p><p><b>Field Type:</b> Ticker \u2013 vertical scrolling text</p><p><b>Action:</b> Display only. The banner holds three messages; each one scrolls up and is replaced by the next, then the ticker starts again from the first:<ol><li>\u201cBorrow only what you need and pay interest only on the utilised amount\u201d</li><li>\u201cAvail a loan of up to 75% of your eligible Mutual Fund portfolio\u201d</li><li>\u201cQuick digital process with fast loan disbursal\u201d</li></ol></p><p><b>Condition:</b> Shown on the Curated Offers page and its drop off view (Sl. No 16.3). How long each message stays on screen to be confirmed <a class=\"pend-ref\" href=\"#P-23\" onclick=\"var t=document.getElementById('P-23');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Open pending clarification P-23\">Pending \u00b7 P-23</a></p></div></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f16-offer.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Product card</p><p><b>Field Type:</b> Card</p><p><b>Action:</b> Shows the loan offer: Credit Limit (clickable), Interest Rate, Processing Fee, Tenure in Months, the KFS document link and the Start Application CTA. Each element is described below.</p></div></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f16-cl.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Credit Limit</p><p><b>Field Type:</b> Amount (hyperlink) \u2013 in the product card</p><p><b>Value Type:</b> \u20b9 (X) \u2013 amount in Indian format, e.g. \u20b9 6,19,13,200</p><p><b>Action:</b> Shows the maximum credit limit worked out from the eligible portfolio. The amount is clickable: on click, the customer is taken to the How is it calculated page with the All Portfolio tab selected (Sl. No 16.1).</p><p><b>Note:</b> How X (the credit limit) is calculated will be shared by the owner <a class=\"pend-ref\" href=\"#P-25\" onclick=\"var t=document.getElementById('P-25');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Open pending clarification P-25\">Pending \u00b7 P-25</a></p></div></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f16-tip-rate.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Interest Rate</p><p><b>Field Type:</b> Display value with hover message \u2013 in the product card</p><p><b>Value Type:</b> (X)% p.a. \u2013 X is 10.5 (shown as 10.50% p.a.)</p><p><b>Action:</b> Display only. On hover (tap on mobile), the message is shown: \u201cThe interest rate applicable to your loan. Interest is charged only on the amount you withdraw from your sanctioned credit limit.\u201d</p></div></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f16-tip-fee.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Processing Fee</p><p><b>Field Type:</b> Display value with hover message \u2013 in the product card</p><p><b>Value Type:</b> \u20b9 (X) \u2013 amount in Indian format, worked out on the sanctioned limit (shown without GST):<table class=\"mini\"><tr><th>Sanctioned limit</th><th>Processing fee</th></tr><tr><td>Up to \u20b9 10 lakh</td><td>1% of the sanctioned limit or \u20b9 999, whichever is higher, + GST</td></tr><tr><td>\u20b9 10 lakh to \u20b9 50 lakh</td><td>0.8% of the sanctioned limit + GST</td></tr><tr><td>More than \u20b9 50 lakh</td><td>0.5% of the sanctioned limit + GST</td></tr></table>e.g. credit limit \u20b9 6,19,13,200 (more than \u20b9 50 lakh) \u2192 0.5% = \u20b9 3,09,566. Exactly \u20b9 10 lakh is taken in the first slab and exactly \u20b9 50 lakh in the second <a class=\"pend-ref\" href=\"#P-25\" onclick=\"var t=document.getElementById('P-25');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Open pending clarification P-25\">Pending \u00b7 P-25</a></p><p><b>Action:</b> Display only. On hover (tap on mobile), the message is shown: \u201cA one-time processing fee charged on your sanctioned loan limit at the time of loan disbursal. Taxes, if applicable, will be charged extra.\u201d</p></div></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f16-tip-tenure.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Tenure in Months</p><p><b>Field Type:</b> Display value with hover message \u2013 in the product card</p><p><b>Value Type:</b> (X) \u2013 X is 12</p><p><b>Action:</b> Display only. On hover (tap on mobile), the message is shown: \u201cThe repayment period applicable to your loan facility. The tenure shown is indicative and subject to the terms of your loan agreement.\u201d</p></div></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f16-kfs.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> KFS document</p><p><b>Field Type:</b> Link row with arrow</p><p><b>Action:</b> Opens the Key Fact Statement (KFS) for the offer. What it opens (document / pop up / download) to be confirmed <a class=\"pend-ref\" href=\"#P-23\" onclick=\"var t=document.getElementById('P-23');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Open pending clarification P-23\">Pending \u00b7 P-23</a></p></div></td></tr>\n<tr><td class=\"shot\"><figure class=\"state\"><img src=\"prd-assets/f16-start.png\" alt=\"\"><figcaption>Enabled \u2013 age within 18 to 70</figcaption></figure><figure class=\"state\"><img src=\"prd-assets/f16-offer-age.png\" alt=\"\"><figcaption>Disabled \u2013 age outside 18 to 70</figcaption></figure></td><td><div class=\"spec\"><p><b>Field Name:</b> Start Application</p><p><b>Field Type:</b> CTA (Button)</p><p><b>Action:</b> On click, the customer continues to the mutual fund selection \u2013 location access (Sl. No 17.1), then the Mutual Fund Selection page (Sl. No 17).</p><p><b>Condition:</b> When the customer\u2019s age (from the DOB entered in Sl. No 4) is outside 18 to 70, the CTA is disabled and the age message is shown.</p></div></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f16-age.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Age validation</p><p><b>Field Type:</b> Validation message</p><p><b>Validation:</b> \u201cApplicant must be between 18 to 70 years of age.\u201d \u2013 shown on this page only, when the age is outside 18 to 70 (customers are not blocked at PAN verification, so they can be tracked). Exact position on the page to be confirmed <a class=\"pend-ref\" href=\"#P-18\" onclick=\"var t=document.getElementById('P-18');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Open pending clarification P-18\">Pending \u00b7 P-18</a></p></div></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f16-tpv.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Total Portfolio Value</p><p><b>Field Type:</b> Display value</p><p><b>Action:</b> Total current value of all the mutual funds fetched \u2013 display only.</p></div></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f16-lu.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Last updated / Refresh portfolio</p><p><b>Field Type:</b> Display date and time + hyperlink</p><p><b>Action:</b> Shows when the portfolio was last fetched. On clicking Refresh portfolio, the Refresh portfolio pop up opens (Sl. No 16.2).</p></div></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f16-strip.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Mobile strip</p><p><b>Field Type:</b> Display</p><p><b>Action:</b> Masked mobile number, number of securities and total value \u2013 display only.</p></div></td></tr>\n<tr><td class=\"shot\"><figure class=\"state\"><img src=\"prd-assets/f16-toast.png\" alt=\"\"><figcaption>After the portfolio is fetched</figcaption></figure><figure class=\"state\"><img src=\"prd-assets/f16-toast-refresh.png\" alt=\"\"><figcaption>After Refresh Portfolio</figcaption></figure></td><td><div class=\"spec\"><p><b>Field Name:</b> Portfolio success toast</p><p><b>Field Type:</b> Toast message (green, bottom of the page)</p><p><b>Action:</b> \u201cPortfolio fetched successfully\u201d is shown every time the customer lands on this page \u2013 after the portfolio is fetched (Sl. No 12 \u2013 15), on coming back from How is it calculated (Sl. No 16.1), on logging in again, or on reloading the page. Right after Refresh Portfolio (Sl. No 16.2) the toast reads \u201cPortfolio refreshed successfully\u201d.</p><p><b>Condition:</b> Disappears automatically after 3 seconds.</p></div></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f16-fund.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Fund card</p><p><b>Field Type:</b> Display card (one per fund)</p><p><b>Action:</b> AMC logo, fund name, Folio No., No. of Units and Current Value of each fund \u2013 display only.</p></div></td></tr>\n<tr id=\"sl-16.1\"><td rowspan=\"6\" class=\"sl\">16.1</td><td class=\"shot\"><img src=\"prd-assets/screen-16-1.png\" alt=\"\"></td><td rowspan=\"6\">Customer viewing how the credit limit is calculated \u2013 All, Eligible and Non-Eligible portfolio</td><td><p>Opened by clicking the Credit Limit amount on the Curated Offers page (Sl. No 16). It explains the credit limit: total portfolio value, minus the non-eligible portfolio, gives the eligible portfolio and the credit limit available. Three tabs list the funds \u2013 All, Eligible Portfolio and Non-Eligible Portfolio; non-eligible funds carry a \u201cNot Eligible\u201d strip and a credit limit of \u20b9 0.</p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Header:</b> Top navigation \u2013 see Sl. No 6</li><li><b>Back link:</b> \u201cLoan Against Mutual Funds\u201d with the back arrow</li><li><b>Credit limit:</b> \u201cYour maximum credit limit is\u201d with the amount and a coins image</li><li><b>Description:</b> \u201cWe determine your credit limit based on your eligible mutual fund portfolio and our lending policies. This is the maximum amount you can borrow.\u201d</li><li><b>Calculation:</b> \u201cTotal Portfolio Value\u201d, \u201cNon-Eligible Portfolio Value\u201d (minus), \u201cEligible Portfolio Value\u201d, \u201cCredit Limit Available\u201d</li><li><b>Tabs:</b> \u201cAll\u201d, \u201cEligible Portfolio\u201d, \u201cNon-Eligible Portfolio\u201d</li><li><b>Mobile strip:</b> Masked mobile number and number of securities in the selected tab</li><li><b>Fund cards:</b> AMC logo, fund name, \u201cFolio No.\u201d, \u201cPledgeable Units\u201d, \u201cCur
