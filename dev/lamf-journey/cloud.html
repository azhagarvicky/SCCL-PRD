rent Value\u201d, \u201cCredit Limit\u201d; \u201cNot Eligible\u201d strip on non-eligible funds</li></ul></div></td><td rowspan=\"6\" class=\"dp\"><b>Tab Viewed:</b><ul><li>All</li><li>Eligible Portfolio</li><li>Non-Eligible Portfolio</li></ul><br><b>How is it calculated Viewed Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS</td><td rowspan=\"6\"><span class=\"tag wip\">WIP</span></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f161-back.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Loan Against Mutual Funds (back)</p><p><b>Field Type:</b> Back link</p><p><b>Action:</b> On click, the customer returns to the Curated Offers page (Sl. No 16).</p></div></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f161-rows.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Credit limit calculation</p><p><b>Field Type:</b> Display values</p><p><b>Action:</b> Total Portfolio Value \u2212 Non-Eligible Portfolio Value = Eligible Portfolio Value; Credit Limit Available is worked out from the eligible value \u2013 display only.</p></div></td></tr>\n<tr><td class=\"shot\"><figure class=\"state\"><img src=\"prd-assets/f161-tabs.png\" alt=\"\"><figcaption>All</figcaption></figure><figure class=\"state\"><img src=\"prd-assets/f161-tabs-el.png\" alt=\"\"><figcaption>Eligible Portfolio</figcaption></figure><figure class=\"state\"><img src=\"prd-assets/f161-tabs-ne.png\" alt=\"\"><figcaption>Non-Eligible Portfolio</figcaption></figure></td><td><div class=\"spec\"><p><b>Field Name:</b> Tabs</p><p><b>Field Type:</b> Tabs</p><p><b>Action:</b> On click, the fund list shows all funds, only eligible funds (sorted by credit limit) or only non-eligible funds; the selected tab is highlighted.</p><p><b>Condition:</b> All is selected by default.</p></div></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f161-card.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Fund card</p><p><b>Field Type:</b> Display card</p><p><b>Action:</b> Pledgeable Units, Current Value and Credit Limit of the fund \u2013 display only.</p></div></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f161-ne.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Not Eligible fund</p><p><b>Field Type:</b> Display card with strip</p><p><b>Action:</b> A fund that cannot be pledged shows the \u201cNot Eligible\u201d strip and Credit Limit \u20b9 0.</p></div></td></tr>\n<tr id=\"sl-16.2\"><td rowspan=\"3\" class=\"sl\">16.2</td><td class=\"shot\"><img src=\"prd-assets/screen-16-2.png\" alt=\"\"></td><td rowspan=\"3\">Customer refreshing the linked mutual fund portfolio</td><td><p>Opened by clicking Refresh portfolio on the Curated Offers page. The pop up asks the customer to refresh all linked portfolios to see the current value of the investments and continue. Refresh Portfolio refreshes the portfolio and returns to the Curated Offers page with the toast \u201cPortfolio refreshed successfully\u201d. When the pop up is shown automatically is to be confirmed <a class=\"pend-ref\" href=\"#P-23\" onclick=\"var t=document.getElementById('P-23');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Open pending clarification P-23\">Pending \u00b7 P-23</a></p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Title:</b> \u201cRefresh all linked portfolios to continue\u201d</li><li><b>Text:</b> \u201cPlease refresh your portfolio to view the current value of your investments and continue with the application.\u201d</li><li><b>Portfolio box:</b> Masked mobile number, \u201cLast refreshed Today\u201d and \u201cRefresh Portfolio\u201d</li><li><b>Close icon:</b> (X) at the top right</li></ul></div></td><td rowspan=\"3\" class=\"dp\"><b>Refresh Portfolio Clicked Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS</td><td rowspan=\"3\"><span class=\"tag wip\">WIP</span></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f162-box.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Refresh Portfolio</p><p><b>Field Type:</b> Hyperlink</p><p><b>Action:</b> On click, the linked portfolio is refreshed: the pop up closes, the customer stays on the Curated Offers page, \u201cLast updated\u201d shows the date and time of this refresh and the green toast \u201cPortfolio refreshed successfully\u201d is shown for 3 seconds (Sl. No 16).</p></div></td></tr>\n<tr><td class=\"shot\"></td><td><div class=\"spec\"><p><b>Field Name:</b> (X) Close icon</p><p><b>Field Type:</b> Icon</p><p><b>Action:</b> On click, the pop up closes and the customer stays on the Curated Offers page.</p></div></td></tr>\n<tr id=\"sl-16.3\"><td rowspan=\"3\" class=\"sl\">16.3</td><td class=\"shot\"><img src=\"prd-assets/screen-16-3.png\" alt=\"\"></td><td rowspan=\"3\">Curated Offers page for a customer who dropped off and came back</td><td><p>A customer who left on the Curated Offers page and logs in again sees the drop off view of the page: a progress strip on the product card and two CTAs, Discard and Continue, in place of Start Application. The rest of the page is the same as Sl. No 16.</p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Banner:</b> Same ticker as Sl. No 16</li><li><b>Progress strip:</b> \u201c1/4 Complete your application to get cash\u201d</li><li><b>CTAs:</b> \u201cDiscard\u201d and \u201cContinue\u201d</li></ul></div></td><td rowspan=\"3\" class=\"dp\"><b>Drop off View Shown Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS<br><br><b>CTA Clicked:</b><ul><li>Continue</li><li>Discard</li></ul></td><td rowspan=\"3\"><span class=\"tag wip\">WIP</span></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f163-prog.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Progress strip</p><p><b>Field Type:</b> Display text</p><p><b>Action:</b> \u201c1/4 Complete your application to get cash\u201d \u2013 shows the application step the customer is on.</p></div></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f163-btns.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Discard / Continue</p><p><b>Field Type:</b> CTAs</p><p><b>Action:</b> Continue: the customer continues the application \u2013 location access (Sl. No 17.1), then the Mutual Fund Selection page (Sl. No 17). Discard: to be confirmed <a class=\"pend-ref\" href=\"#P-23\" onclick=\"var t=document.getElementById('P-23');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Open pending clarification P-23\">Pending \u00b7 P-23</a></p></div></td></tr>\n</tbody></table>\n<h2>Module 8 \u2013 Mutual Fund Selection</h2>\n<p class=\"screens\">Screen 13.1) Location access \u00b7 13.2) Mutual Fund Selection Page \u00b7 13.3) Location disabled \u00b7 13.4) Ongoing application pop up \u00b7 13.5) Loan amount edit \u00b7 13.6) Fund wise amount edit</p>\n<table><thead><tr><th style=\"width:52px\">SL.No</th><th style=\"width:330px\">Screenshot</th><th style=\"width:190px\">Functionality</th><th>Description</th><th style=\"width:190px\">Data Points Required</th><th style=\"width:165px\">Status</th></tr></thead><tbody>\n<tr id=\"sl-17\"><td rowspan=\"7\" class=\"sl\">17</td><td class=\"shot\"><img src=\"prd-assets/screen-17.png\" alt=\"\"></td><td rowspan=\"7\">Customer choosing the loan amount and the mutual funds to pledge</td><td><p>After Start Application on the Curated Offers page (Sl. No 16) and location access (Sl. No 17.1), the customer lands on the Mutual Fund Selection page, step 1 of 4. The loan amount is set with the slider or typed (Sl. No 17.4); the LOS selects the funds needed to cover it. The customer can also tick or untick funds and edit the amount taken from each fund (Sl. No 17.5). Continue to apply opens the Loan Application Summary (Sl. No 18). Written from the prototype screen \u2013 to be checked against UAT <a class=\"pend-ref\" href=\"#P-24\" onclick=\"var t=document.getElementById('P-24');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Open pending clarification P-24\">Pending \u00b7 P-24</a></p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Header:</b> Top navigation \u2013 see Sl. No 6</li><li><b>Stepper:</b> \u201c1 Selection of Mutual Fund\u201d, \u201c2 KYC Verification &amp; Bank details\u201d, \u201c3 Pledging of Mutual Fund\u201d, \u201c4 Agreement &amp; E-Mandate\u201d \u2013 step 1 active</li><li><b>Back link:</b> \u201cBack\u201d</li><li><b>Loan amount box:</b> \u201cLoan Amount\u201d with the amount and edit pencil; slider from \u201c\u20b9 10,000\u201d to the credit limit (e.g. \u20b9 2,00,00,000)</li><li><b>Selection summary:</b> \u201cFunds selected for pledging\u201d; \u201cCurrent market value of units selected for pledging\u201d with the amount; \u201cNo. of funds selected\u201d with the count</li><li><b>Select All:</b> Checkbox \u201cSelect All\u201d</li><li><b>Mobile strip:</b> Masked mobile number, number of funds and total value (e.g. 9 Fund \u2022 \u20b9 8,91,60,659.02)</li><li><b>Fund cards:</b> Checkbox, AMC logo, fund name, \u201cFolio No.\u201d, \u201cSelected Amount\u201d with edit pencil, \u201cNo of Units\u201d, \u201cCurrent Value\u201d, \u201cMax Limit\u201d (each with an (i) icon)</li><li><b>CTA:</b> \u201cContinue to apply \u20b9 amount\u201d</li></ul></div><div class=\"spec\"><p><b>Drop off:</b></p><ul class=\"content-list\"><li><b>When:</b> The customer leaves the journey on this page</li><li><b>On return:</b> After logging in again, the ongoing application pop up is shown (Sl. No 17.3) <a class=\"pend-ref\" href=\"#P-24\" onclick=\"var t=document.getElementById('P-24');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Open pending clarification P-24\">Pending \u00b7 P-24</a></li></ul></div></td><td rowspan=\"7\" class=\"dp\"><b>Loan Amount Selected:</b> amount<br><br><b>Funds Selected:</b> fund name, folio no., selected amount, units \u2013 per fund<br><br><b>Market Value of Units Selected:</b> amount<br><br><b>No. of Funds Selected:</b> number<br><br><b>Continue to apply Clicked Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS</td><td rowspan=\"7\"><span class=\"tag wip\">WIP</span></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f17-stepper.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Stepper</p><p><b>Field Type:</b> Display</p><p><b>Action:</b> Shows the 4 application steps; the current step is highlighted and completed steps carry a tick \u2013 display only.</p></div></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f17-loan.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Loan Amount</p><p><b>Field Type:</b> Slider + amount with edit pencil</p><p><b>Value Type:</b> Amount (\u20b9)</p><p><b>Action:</b> Moving the slider changes the loan amount; the funds to be pledged and the CTA amount are updated with it. On clicking the pencil, the amount can be typed (Sl. No 17.4).</p><p><b>Condition:</b> Minimum \u20b9 10,000; maximum is the credit limit from the Curated Offers page.</p></div></td></tr>\n<tr><td class=\"shot\"><img class=\"icon\" src=\"prd-assets/f17-selall.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Select All</p><p><b>Field Type:</b> Checkbox</p><p><b>Action:</b> Ticks or unticks every fund. Shown part-ticked (\u2013) when only some funds are selected.</p></div></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f17-card.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Fund card</p><p><b>Field Type:</b> Checkbox + display card</p><p><b>Action:</b> Ticking a fund adds it for pledging; unticking removes it. Selected Amount is the amount taken against the fund and can be edited with the pencil (Sl. No 17.5). No of Units, Current Value and Max Limit are display only.</p></div></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f17-cta.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Continue to apply</p><p><b>Field Type:</b> CTA (Button)</p><p><b>Action:</b> Shows the selected loan amount. On click, the Loan Application Summary opens (Sl. No 18).</p><p><b>Condition:</b> Disabled while the loan amount is being edited (Sl. No 17.4) or location access is not given (Sl. No 17.2).</p></div></td></tr>\n<tr><td class=\"shot\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Back</p><p><b>Field Type:</b> Link</p><p><b>Action:</b> On click, the customer returns to the Curated Offers page (Sl. No 16).</p></div></td></tr>\n<tr id=\"sl-17.1\"><td rowspan=\"2\" class=\"sl\">17.1</td><td class=\"shot\"><img src=\"prd-assets/screen-17-1.png\" alt=\"\"></td><td rowspan=\"2\">Browser asking the customer for location access</td><td><p>When the customer starts the application, the browser asks for permission to read the location. Allow or Just this Time opens the Mutual Fund Selection page (Sl. No 17); Block shows the location disabled view (Sl. No 17.2). The pop up is the browser\u2019s own; its look depends on the browser.</p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Title:</b> \u201cuatlamf.shriramcredit.in wants to\u201d</li><li><b>Text:</b> \u201cKnow your location\u201d</li><li><b>Buttons:</b> \u201cBlock\u201d, \u201cJust this Time\u201d, \u201cAllow\u201d</li></ul></div></td><td rowspan=\"2\" class=\"dp\"><b>Location Permission:</b><ul><li>Allowed</li><li>Allowed this time</li><li>Blocked</li></ul><br><b>Customer Location:</b> latitude, longitude<br><br><b>Location Captured Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS</td><td rowspan=\"2\"><span class=\"tag wip\">WIP</span></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f171-perm.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Location permission</p><p><b>Field Type:</b> Browser pop up</p><p><b>Action:</b> Allow / Just this Time: the location is captured and the Mutual Fund Selection page opens. Block: the location disabled view opens (Sl. No 17.2).</p></div></td></tr>\n<tr id=\"sl-17.2\"><td rowspan=\"3\" class=\"sl\">17.2</td><td class=\"shot\"><img src=\"prd-assets/screen-17-2.png\" alt=\"\"></td><td rowspan=\"3\">Mutual Fund Selection page when location access is blocked</td><td><p>When the customer blocks location access, the Mutual Fund Selection page shows a message asking for location access and Continue to apply stays disabled. Refresh asks for the location again (Sl. No 17.1).</p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Message:</b> \u201cKindly provide location access in order to proceed with the loan application.\u201d with \u201cRefresh\u201d</li><li><b>CTA:</b> \u201cContinue to apply \u20b9 amount\u201d \u2013 disabled</li></ul></div></td><td rowspan=\"3\" class=\"dp\"><b>Location Blocked Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS</td><td rowspan=\"3\"><span class=\"tag wip\">WIP</span></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f172-toast.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Location message</p><p><b>Field Type:</b> Message with hyperlink</p><p><b>Action:</b> On clicking Refresh, the browser location pop up is shown again (Sl. No 17.1).</p></div></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f172-cta.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Continue to apply</p><p><b>Field Type:</b> CTA (Button) \u2013 disabled</p><p><b>Condition:</b> Stays disabled until location access is given.</p></div></td></tr>\n<tr id=\"sl-17.3\"><td rowspan=\"2\" class=\"sl\">17.3</td><td class=\"shot\"><img src=\"prd-assets/screen-17-3.png\" alt=\"\"></td><td rowspan=\"2\">Customer with an ongoing application choosing to continue it</td><td><p>A customer who already has an application in progress is asked whether to continue it. Yes, Continue opens the Mutual Fund Selection page (Sl. No 17); No, Take me to the dashboard returns to the Curated Offers page (Sl. No 16). When exactly this pop up is shown is to be confirmed <a class=\"pend-ref\" href=\"#P-24\" onclick=\"var t=document.getElementById('P-24');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Open pending clarification P-24\">Pending \u00b7 P-24</a></p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Text:</b> \u201cYou have an ongoing loan application, would you like to proceed further with it?\u201d</li><li><b>CTAs:</b> \u201cNo, Take me to the dashboard\u201d and \u201cYes, Continue\u201d</li></ul></div></td><td rowspan=\"2\" class=\"dp\"><b>Ongoing Application Choice:</b><ul><li>Yes, Continue</li><li>No, Take me to the dashboard</li></ul></td><td rowspan=\"2\"><span class=\"tag wip\">WIP</span></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f173-modal.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> No, Take me to the dashboard / Yes, Continue</p><p><b>Field Type:</b> CTAs</p><p><b>Action:</b> Yes, Continue: the Mutual Fund Selection page opens. No, Take me to the dashboard: the Curated Offers page opens.</p></div></td></tr>\n<tr id=\"sl-17.4\"><td rowspan=\"2\" class=\"sl\">17.4</td><td class=\"shot\"><img src=\"prd-assets/screen-17-4.png\" alt=\"\"></td><td rowspan=\"2\">Customer typing the loan amount</td><td><p>On clicking the pencil next to the loan amount, the amount becomes an input box with an Update link. Continue to apply is disabled until the customer clicks Update; then the funds and the CTA amount are recalculated for the typed amount.</p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Loan amount box:</b> \u201cLoan Amount\u201d, \u201c\u20b9\u201d input with the amount and \u201cUpdate\u201d</li><li><b>CTA:</b> \u201cContinue to apply \u20b9 amount\u201d \u2013 disabled while editing</li></ul></div></td><td rowspan=\"2\" class=\"dp\"><b>Loan Amount Entered:</b> amount</td><td rowspan=\"2\"><span class=\"tag wip\">WIP</span></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f174-loan.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Loan Amount</p><p><b>Field Type:</b> Input box + Update link</p><p><b>Value Type:</b> Numeric</p><p><b>Action:</b> On clicking Update, the slider, the selected funds and the CTA amount change to the typed amount.</p><p><b>Condition:</b> Minimum \u20b9 10,000; maximum is the credit limit.</p><p><b>Validation:</b> Message for an amount below the minimum or above the credit limit \u2013 to be confirmed <a class=\"pend-ref\" href=\"#P-24\" onclick=\"var t=document.getElementById('P-24');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Open pending clarification P-24\">Pending \u00b7 P-24</a></p></div></td></tr>\n<tr id=\"sl-17.5\"><td rowspan=\"2\" class=\"sl\">17.5</td><td class=\"shot\"><img src=\"prd-assets/screen-17-5.png\" alt=\"\"></td><td rowspan=\"2\">Customer editing the amount taken from one fund</td><td><p>On clicking the pencil next to a fund\u2019s Selected Amount, the amount becomes an input box with a tick. The customer types the amount to take from that fund (up to its Max Limit) and confirms it with the tick; the loan amount and CTA amount are updated.</p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Fund card:</b> \u201cSelected Amount\u201d input with the tick, \u201cNo of Units\u201d, \u201cCurrent Value\u201d, \u201cMax Limit\u201d</li></ul></div></td><td rowspan=\"2\" class=\"dp\"><b>Selected Amount per Fund:</b> amount</td><td rowspan=\"2\"><span class=\"tag wip\">WIP</span></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f175-card.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Selected Amount</p><p><b>Field Type:</b> Input box + tick</p><p><b>Value Type:</b> Numeric</p><p><b>Action:</b> On clicking the tick, the amount is saved for the fund and the loan amount is updated.</p><p><b>Condition:</b> Up to the Max Limit of the fund.</p><p><b>Validation:</b> Message for an amount above the Max Limit \u2013 to be confirmed <a class=\"pend-ref\" href=\"#P-24\" onclick=\"var t=document.getElementById('P-24');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Open pending clarification P-24\">Pending \u00b7 P-24</a></p></div></td></tr>\n</tbody></table>\n<h2>Module 9 \u2013 Loan Application Summary</h2>\n<p class=\"screens\">Screen 14) Loan Application Summary</p>\n<table><thead><tr><th style=\"width:52px\">SL.No</th><th style=\"width:330px\">Screenshot</th><th style=\"width:190px\">Functionality</th><th>Description</th><th style=\"width:190px\">Data Points Required</th><th style=\"width:165px\">Status</th></tr></thead><tbody>\n<tr id=\"sl-18\"><td rowspan=\"4\" class=\"sl\">18</td><td class=\"shot\"><img src=\"prd-assets/screen-18.png\" alt=\"\"></td><td rowspan=\"4\">Customer reviewing the loan terms and charges before KYC</td><td><p>After Continue to apply (Sl. No 17), the customer sees the summary of the application: loan amount, pledge value, tenure, disbursement and repayment type, interest rate, monthly interest, charges and repayment details. Continue opens KYC Verification (Sl. No 19); Back returns to the Mutual Fund Selection page. Written from the prototype screen \u2013 to be checked against UAT <a class=\"pend-ref\" href=\"#P-24\" onclick=\"var t=document.getElementById('P-24');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Open pending clarification P-24\">Pending \u00b7 P-24</a></p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Header:</b> Top navigation \u2013 see Sl. No 6; stepper \u2013 step 1 active</li><li><b>Back link:</b> \u201cBack\u201d</li><li><b>Title:</b> \u201cApplication details\u201d</li><li><b>Amount box:</b> \u201cLoan amount\u201d and \u201cPledge Value\u201d</li><li><b>Terms:</b> \u201cTenure\u201d (e.g. 12 months), \u201cDisbursement Type\u201d (Multiple), \u201cRepayment Type\u201d (Interest Only)</li><li><b>Rate box:</b> \u201cInterest Rate\u201d (e.g. 10.5% p.a) and \u201cMonthly Interest\u201d (e.g. \u20b9 1,35,940.88), each with an (i) icon</li><li><b>Charges:</b> \u201cCharges (Inclusive of GST)\u201d: \u201cProcessing fee\u201d, \u201cStamp duty\u201d, \u201cLien Marking Charges\u201d, \u201cLien Removal Charges\u201d, each with an (i) icon</li><li><b>Repayment details:</b> \u201cInterest autopay\u201d \u2013 \u201c5th of every month\u201d</li><li><b>CTA:</b> \u201cContinue\u201d</li></ul></div></td><td rowspan=\"4\" class=\"dp\"><b>Loan Amount:</b> amount<br><br><b>Pledge Value:</b> amount<br><br><b>Tenure:</b> months<br><br><b>Disbursement Type:</b> Multiple<br><br><b>Repayment Type:</b> Interest Only<br><br><b>Interest Rate:</b> % p.a<br><br><b>Monthly Interest:</b> amount<br><br><b>Processing fee, Stamp duty, Lien Marking Charges, Lien Removal Charges:</b> amount each<br><br><b>Summary Continue Clicked Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS</td><td rowspan=\"4\"><span class=\"tag wip\">WIP</span></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f18-box.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Loan amount / Pledge Value</p><p><b>Field Type:</b> Display values</p><p><b>Action:</b> Loan amount selected on Sl. No 17 and the market value of the units pledged \u2013 display only.</p></div></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f18-rate.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Interest Rate / Monthly Interest</p><p><b>Field Type:</b> Display values with (i)</p><p><b>Action:</b> Display only; the (i) icon explains the value. Monthly Interest is worked out on the loan amount.</p></div></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f18-cta.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Continue</p><p><b>Field Type:</b> CTA (Button)</p><p><b>Action:</b> On click, KYC Verification opens (Sl. No 19).</p></div></td></tr>\n</tbody></table>\n<h2>Module 10 \u2013 KYC Verification</h2>\n<p class=\"screens\">Screen 16.1) KYC Verification Page \u00b7 16.2) View details pop up \u00b7 16.3) Email OTP pop up \u00b7 16.4) Email verified \u00b7 16.5.1 \u2013 16.5.7) Aadhaar verification with DigiLocker (Digio) \u00b7 16.5.8) Getting status \u00b7 16.5.9) Aadhaar verified</p>\n<table><thead><tr><th style=\"width:52px\">SL.No</th><th style=\"width:330px\">Screenshot</th><th style=\"width:190px\">Functionality</th><th>Description</th><th style=\"width:190px\">Data Points Required</th><th style=\"width:165px\">Status</th></tr></thead><tbody>\n<tr id=\"sl-19\"><td rowspan=\"5\" class=\"sl\">19</td><td class=\"shot\"><img src=\"prd-assets/screen-19.png\" alt=\"\"></td><td rowspan=\"5\">Customer completing KYC \u2013 Email, PAN, Aadhaar, Photo and Bank Details</td><td><p>Step 2 of 4. The KYC Verification page lists five checks done one after the other: Email Verification, PAN Verification (already Complete from Sl. No 4), Aadhaar Verification with DigiLocker, Photo Verification and Bank Details. Only the current check is open; the later ones show Pending. Written from the prototype screen \u2013 to be checked against UAT <a class=\"pend-ref\" href=\"#P-24\" onclick=\"var t=document.getElementById('P-24');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Open pending clarification P-24\">Pending \u00b7 P-24</a></p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Header:</b> Top navigation \u2013 see Sl. No 6; stepper \u2013 step 1 ticked, step 2 active</li><li><b>Back link:</b> \u201cBack\u201d</li><li><b>Loan strip:</b> \u201cYour loan amount is \u20b9 amount\u201d with \u201cView details\u201d</li><li><b>Title:</b> \u201cKYC Verification\u201d \u2013 \u201cThis step is required as per our lending guidelines.\u201d</li><li><b>1 Email Verification:</b> Email input; \u201cWe will use this email address for all official communications related to your loan application and account.\u201d; CTA \u201cVerify\u201d</li><li><b>2 PAN Verification:</b> \u201cComplete\u201d</li><li><b>3 Aadhaar Verification with DigiLocker:</b> \u201cPending\u201d</li><li><b>4 Photo Verification:</b> \u201cPending\u201d</li><li><b>5 Bank Details:</b> \u201cPending\u201d</li></ul></div></td><td rowspan=\"5\" class=\"dp\"><b>Email ID:</b> email address<br><br><b>KYC Page Viewed Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS</td><td rowspan=\"5\"><span class=\"tag wip\">WIP</span></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f19-strip.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Your loan amount is / View details</p><p><b>Field Type:</b> Display + hyperlink</p><p><b>Action:</b> On clicking View details, the Loan details pop up opens (Sl. No 19.1).</p></div></td></tr>\n<tr><td class=\"shot\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Email Verification</p><p><b>Field Type:</b> Input box</p><p><b>Value Type:</b> Email address</p><p><b>Validation:</b> Message for an empty or invalid email \u2013 to be confirmed <a class=\"pend-ref\" href=\"#P-24\" onclick=\"var t=document.getElementById('P-24');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Open pending clarification P-24\">Pending \u00b7 P-24</a></p></div></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f19-verify.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Verify</p><p><b>Field Type:</b> CTA (Button)</p><p><b>Action:</b> On click, an OTP is sent to the email and the Enter OTP pop up opens (Sl. No 19.2).</p></div></td></tr>\n<tr><td class=\"shot\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Back</p><p><b>Field Type:</b> Link</p><p><b>Action:</b> On click, the Loan Application Summary opens (Sl. No 18).</p></div></td></tr>\n<tr id=\"sl-19.1\"><td rowspan=\"2\" class=\"sl\">19.1</td><td class=\"shot\"><img src=\"prd-assets/screen-19-1.png\" alt=\"\"></td><td rowspan=\"2\">Customer viewing the loan details from the KYC page</td><td><p>Opened by View details on the KYC page. Shows the loan amount, the market value and number of mutual funds selected, and a card for each fund selected for pledging.</p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Title:</b> \u201cLoan details\u201d</li><li><b>Values:</b> \u201cLoan Amount\u201d, \u201cMarket Value of MF selected\u201d, \u201cNo. of MF selected\u201d</li><li><b>Sub title:</b> \u201cMutual Fund selected for pledging\u201d</li><li><b>Fund cards:</b> Fund name, \u201cFolio No.\u201d, \u201cSelected Amount\u201d, \u201cSelected Units\u201d, \u201cCurrent Value\u201d, \u201cMax Limit\u201d</li><li><b>Close icon:</b> (X) at the top right</li></ul></div></td><td rowspan=\"2\" class=\"dp\">No data captured</td><td rowspan=\"2\"><span class=\"tag wip\">WIP</span></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f191-modal.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Loan details pop up</p><p><b>Field Type:</b> Pop up</p><p><b>Action:</b> Display only. (X) closes the pop up and the customer stays on the KYC page.</p></div></td></tr>\n<tr id=\"sl-19.2\"><td rowspan=\"2\" class=\"sl\">19.2</td><td class=\"shot\"><img src=\"prd-assets/screen-19-2.png\" alt=\"\"></td><td rowspan=\"2\">Customer verifying the email with OTP</td><td><p>A 6 digit OTP is sent to the email entered. Submit OTP is enabled once all 6 digits are entered; a correct OTP marks Email Verification Complete (Sl. No 19.3). Resend timer, attempts and wrong OTP message \u2013 to be confirmed <a class=\"pend-ref\" href=\"#P-24\" onclick=\"var t=document.getElementById('P-24');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Open pending clarification P-24\">Pending \u00b7 P-24</a></p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Title:</b> \u201cEnter OTP\u201d</li><li><b>Text:</b> \u201cA 6-digit OTP has been sent to your registered email address\u201d with the email</li><li><b>OTP boxes:</b> 6 boxes</li><li><b>Resend:</b> \u201cDidn\u2019t receive OTP?\u201d timer and \u201cResend OTP\u201d</li><li><b>CTA:</b> \u201cSubmit OTP\u201d</li></ul></div></td><td rowspan=\"2\" class=\"dp\"><b>Email OTP Verified:</b><ul><li>Yes</li><li>No</li></ul><br><b>Email Verified Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS</td><td rowspan=\"2\"><span class=\"tag wip\">WIP</span></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f192-modal.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Enter OTP</p><p><b>Field Type:</b> 6 OTP boxes + CTA</p><p><b>Value Type:</b> Numeric</p><p><b>Action:</b> On Submit OTP with the correct OTP, the pop up closes and Email Verification shows Complete.</p><p><b>Condition:</b> Submit OTP is enabled only when all 6 digits are entered.</p></div></td></tr>\n<tr id=\"sl-19.3\"><td rowspan=\"2\" class=\"sl\">19.3</td><td class=\"shot\"><img src=\"prd-assets/screen-19-3.png\" alt=\"\"></td><td rowspan=\"2\">Email verified \u2013 customer starting Aadhaar KYC</td><td><p>After the email is verified, Email Verification shows Complete and Aadhaar Verification with DigiLocker opens with Start KYC. Start KYC opens the Digio page (Sl. No 19.4).</p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>1 Email Verification:</b> \u201cComplete\u201d</li><li><b>3 Aadhaar Verification with DigiLocker:</b> CTA \u201cStart KYC\u201d</li></ul></div></td><td rowspan=\"2\" class=\"dp\"><b>Start KYC Clicked Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS</td><td rowspan=\"2\"><span class=\"tag wip\">WIP</span></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f193-start.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Start KYC</p><p><b>Field Type:</b> CTA (Button)</p><p><b>Action:</b> On click, the customer is taken to Digio to fetch the Aadhaar from DigiLocker (Sl. No 19.4).</p></div></td></tr>\n<tr id=\"sl-19.4\"><td class=\"sl\">19.4</td><td class=\"shot\"><img src=\"prd-assets/screen-19-4.png\" alt=\"\"></td><td>Digio page \u2013 consent to fetch documents from DigiLocker</td><td><p>Digio page (third party). Shows the steps to fetch the documents and the documents requested (Aadhaar Card and PAN Verification Record) with the customer\u2019s consent. Proceed opens DigiLocker (Sl. No 19.5); Cancel returns to the KYC page.</p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Header:</b> Digio logo, \u201cSecured by digio\u201d</li><li><b>Title:</b> \u201cSteps to securely fetch documents\u201d</li><li><b>Steps:</b> \u201cEnter Aadhaar number\u201d, \u201cEnter OTP and PIN (optional)\u201d, \u201cSelect requested documents:\u201d (Aadhaar Card, PAN Verification Record), \u201cDocument fetch from DigiLocker\u201d</li><li><b>Requested:</b> \u201cRequested: Aadhaar Card | PAN Card\u201d with the consent text</li><li><b>Consent:</b> \u201cBy proceeding further I hereby authorize Digio to pull my documents from Digilocker and share with SHRIRAM CREDIT COMPANY LIMITED\u201d</li><li><b>CTAs:</b> \u201cCancel\u201d and \u201cProceed\u201d</li></ul></div></td><td class=\"dp\"><b>Digio Consent Given Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS</td><td><span class=\"tag wip\">WIP</span></td></tr>\n<tr id=\"sl-19.5\"><td class=\"sl\">19.5</td><td class=\"shot\"><img src=\"prd-assets/screen-19-5.png\" alt=\"\"></td><td>DigiLocker \u2013 customer entering the Aadhaar number</td><td><p>DigiLocker page (third party). The customer enters the 12 digit Aadhaar number and clicks Next.</p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Title:</b> \u201cSign up\u201d \u2013 \u201cIt takes just a minute\u201d</li><li><b>Field:</b> \u201cEnter your Aadhaar Number\u201d \u2013 3 boxes of 4 digits</li><li><b>Text:</b> \u201cDigiLocker uses Aadhaar to enable authentic document access\u201d</li><li><b>CTA:</b> \u201cNext\u201d; link \u201cTry another way\u201d</li></ul></div></td><td class=\"dp\">Not captured by the LOS (entered on DigiLocker)</td><td><span class=\"tag wip\">WIP</span></td></tr>\n<tr id=\"sl-19.6\"><td class=\"sl\">19.6</td><td class=\"shot\"><img src=\"prd-assets/screen-19-6.png\" alt=\"\"></td><td>DigiLocker \u2013 customer entering the Aadhaar OTP</td><td><p>DigiLocker page (third party). An OTP is sent to the mobile number linked to the Aadhaar; the customer enters it and clicks Submit.</p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Title:</b> \u201cVerify Aadhaar OTP\u201d</li><li><b>Text:</b> \u201cDigiLocker has sent you an OTP to your registered mobile (xxxxxx1623)\u201d; \u201cPlease enter OTP to complete verification\u201d</li><li><b>CTA:</b> \u201cSubmit\u201d; \u201cDidn\u2019t get the OTP? Resend OTP\u201d</li></ul></div></td><td class=\"dp\">Not captured by the LOS (entered on DigiLocker)</td><td><span class=\"tag wip\">WIP</span></td></tr>\n<tr id=\"sl-19.7\"><td class=\"sl\">19.7</td><td class=\"shot\"><img src=\"prd-assets/screen-19-7.png\" alt=\"\"></td><td>DigiLocker \u2013 customer entering the Security PIN</td><td><p>DigiLocker page (third party), shown when the customer is already registered with DigiLocker. The customer enters the 6 digit Security PIN and clicks Done.</p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Title:</b> \u201cYou are already registered with DigiLocker\u201d</li><li><b>Field:</b> \u201cPlease enter your 6 digit Security PIN to Signin\u201d \u2013 6 boxes; \u201cForgot my PIN\u201d</li><li><b>CTA:</b> \u201cDone\u201d</li></ul></div></td><td class=\"dp\">Not captured by the LOS (entered on DigiLocker)</td><td><span class=\"tag wip\">WIP</span></td></tr>\n<tr id=\"sl-19.8\"><td class=\"sl\">19.8</td><td class=\"shot\"><img src=\"prd-assets/screen-19-8.png\" alt=\"\"></td><td>Digio fetching the documents</td><td><p>Digio page (third party). The documents are fetched from DigiLocker; no action is needed from the customer.</p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Message:</b> \u201cSecurely fetching documents\u201d \u2013 \u201cPlease do not refresh or close the window\u201d</li></ul></div></td><td class=\"dp\">No data captured</td><td><span class=\"tag wip\">WIP</span></td></tr>\n<tr id=\"sl-19.9\"><td class=\"sl\">19.9</td><td class=\"shot\"><img src=\"prd-assets/screen-19-9.png\" alt=\"\"></td><td>Digio \u2013 KYC process completed</td><td><p>Digio page (third party). Shown when the documents are fetched; the customer is redirected back to the LOS automatically.</p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Message:</b> \u201cKYC process completed\u201d \u2013 \u201cDo not close the window. You will be redirected.\u201d</li></ul></div></td><td class=\"dp\"><b>Digio KYC Completed Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS</td><td><span class=\"tag wip\">WIP</span></td></tr>\n<tr id=\"sl-19.10\"><td class=\"sl\">19.10</td><td class=\"shot\"><img src=\"prd-assets/screen-19-10.png\" alt=\"\"></td><td>LOS \u2013 KYC successfully completed, redirecting</td><td><p>LOS page shown when the customer comes back from Digio; it returns to the KYC page automatically.</p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Message:</b> \u201cKYC successfully completed.\u201d \u2013 \u201cRedirecting you back to the process in 1 seconds\u201d</li></ul></div></td><td class=\"dp\"><b>Returned from Digio Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS</td><td><span class=\"tag wip\">WIP</span></td></tr>\n<tr id=\"sl-19.11\"><td rowspan=\"2\" class=\"sl\">19.11</td><td class=\"shot\"><img src=\"prd-assets/screen-19-11.png\" alt=\"\"></td><td rowspan=\"2\">KYC page \u2013 Aadhaar status being updated</td><td><p>Back on the KYC page, Aadhaar Verification shows Getting status while the Aadhaar details are received from DigiLocker. When the status is received, Aadhaar Verification shows Complete (Sl. No 19.12). What is shown if the status is not received in time \u2013 to be confirmed <a class=\"pend-ref\" href=\"#P-24\" onclick=\"var t=document.getElementById('P-24');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Open pending clarification P-24\">Pending \u00b7 P-24</a></p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Status:</b> \u201cGetting status\u201d \u2013 \u201cThis might take up to 2m:58s\u201d (count down)</li><li><b>Text:</b> \u201cYour Aadhaar details are being fetched from DigiLocker. This process may take a few minutes. Please keep this tab open and avoid refreshing the page.\u201d</li></ul></div></td><td rowspan=\"2\" class=\"dp\"><b>Aadhaar Fetch Status:</b><ul><li>Success</li><li>Failure</li></ul><br><b>Aadhaar Details Received Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS</td><td rowspan=\"2\"><span class=\"tag wip\">WIP</span></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f1911-status.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Getting status</p><p><b>Field Type:</b> Status (Button, not clickable) with timer</p><p><b>Action:</b> Counts down while the status is fetched \u2013 display only.</p></div></td></tr>\n<tr id=\"sl-19.12\"><td rowspan=\"2\" class=\"sl\">19.12</td><td class=\"shot\"><img src=\"prd-assets/screen-19-12.png\" alt=\"\"></td><td rowspan=\"2\">Aadhaar verified \u2013 customer starting Photo Verification</td><td><p>Aadhaar Verification shows Complete and Photo Verification opens with Start. The Photo Verification and Bank Details steps follow <a class=\"pend-ref\" href=\"#P-24\" onclick=\"var t=document.getElementById('P-24');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Open pending clarification P-24\">Pending \u00b7 P-24</a></p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>3 Aadhaar Verification with DigiLocker:</b> \u201cComplete\u201d</li><li><b>4 Photo Verification:</b> CTA \u201cStart\u201d</li><li><b>5 Bank Details:</b> \u201cPending\u201d</li></ul></div></td><td rowspan=\"2\" class=\"dp\"><b>Aadhaar Verified Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS</td><td rowspan=\"2\"><span class=\"tag wip\">WIP</span></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f1912-start.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Start (Photo Verification)</p><p><b>Field Type:</b> CTA (Button)</p><p><b>Action:</b> On click, the photo verification starts <a class=\"pend-ref\" href=\"#P-24\" onclick=\"var t=document.getElementById('P-24');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Open pending clarification P-24\">Pending \u00b7 P-24</a></p></div></td></tr>\n</tbody></table>\n<h2>Top Navigation</h2>\n<p class=\"screens\">Screen 04) Enter PAN Details \u2013 logo and Logout only (Sl. No 6.3) \u00b7 every LOS page from Screen 05) LOS to MF Central Redirection consent page onwards (not on the MF Central pages or the Digio / DigiLocker pages) \u2013 logo, Credit Score and Profile (Sl. No 6, 6.1, 6.2)</p>\n<table><thead><tr><th style=\"width:52px\">SL.No</th><th style=\"width:330px\">Screenshot</th><th style=\"width:190px\">Functionality</th><th>Description</th><th style=\"width:190px\">Data Points Required</th><th style=\"width:165px\">Status</th></tr></thead><tbody>\n<tr id=\"sl-6\"><td rowspan=\"4\" class=\"sl\">6</td><td class=\"shot\"><img src=\"prd-assets/f06-topnav.png\" alt=\"\"></td><td rowspan=\"4\">Top navigation shown on every page after PAN verification</td><td><p>The top navigation is shown at the top of every LOS page from Sl. No 5 onwards (it is not shown on the MF Central pages, Sl. No 8 \u2013 11, or on the Digio / DigiLocker pages and the KYC redirect page, Sl. No 19.4 \u2013 19.10) and stays fixed when the page is scrolled (the PAN Details page has its own top navigation \u2013 see Sl. No 6.3). It gives the customer access to the credit score fetched from Experian and to the profile (with Logout) from any page.</p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Left:</b> Shriram Credit logo</li><li><b>Right:</b> Credit Score icon (Sl. No 6.1) and Profile icon (Sl. No 6.2)</li></ul></div></td><td rowspan=\"4\" class=\"dp\">Captured in Sl. No 6.1 and 6.2</td><td rowspan=\"4\"><span class=\"tag ok\">Completed</span></td></tr>\n<tr><td class=\"shot\"><img class=\"icon\" src=\"prd-assets/f06-logo.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Shriram Credit logo</p><p><b>Field Type:</b> Image (top navigation, left corner)</p><p><b>Action:</b> Display only.</p></div></td></tr>\n<tr><td class=\"shot\"><img class=\"icon\" src=\"prd-assets/f05-credit-icon.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Credit Score icon</p><p><b>Field Type:</b> Icon (top navigation, right corner)</p><p><b>Action:</b> On click, opens the credit score pop up \u2013 see Sl. No 6.1.</p></div></td></tr>\n<tr><td class=\"shot\"><img class=\"icon\" src=\"prd-assets/f05-profile-icon.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Profile icon</p><p><b>Field Type:</b> Icon (top navigation, right corner)</p><p><b>Action:</b> On click, opens the Profiles pop up \u2013 see Sl. No 6.2.</p></div></td></tr>\n<tr id=\"sl-6.1\"><td rowspan=\"4\" class=\"sl\">6.1</td><td class=\"shot\"><img src=\"prd-assets/f05-credit-report.png\" alt=\"\"></td><td rowspan=\"4\">User clicking the Credit Score icon in the top navigation to view the credit score</td><td><p>The Credit Score icon is part of the top navigation (Sl. No 6). On click, the system shall open the credit score pop up over the current page, showing the credit score fetched from Experian (Sl. No 3). The customer stays on the same page; closing the pop up returns to it. What the pop up shows when Experian returns no score (no credit history / no record found / Experian call failed) is to be confirmed <a class=\"pend-ref\" href=\"#P-20\" onclick=\"var t=document.getElementById('P-20');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Open pending clarification P-20\">Pending \u00b7 P-20</a></p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Title:</b> \u201cYour credit score as of DD MMM YYYY\u201d \u2013 the date the score was fetched (e.g. 07 Oct 2026)</li><li><b>Score meter:</b> The score on a 300 \u2013 900 meter (e.g. 790), with its category below it (e.g. \u201cVery Good\u201d); \u201c300\u201d and \u201c900\u201d at the ends</li><li><b>Category table:</b> <table class=\"mini\"><tr><th>Category</th><th>Score Range</th></tr><tr><td><i style=\"background:#1E8E3E\"></i>Excellent</td><td><b>826 - 900</b></td></tr><tr><td><i style=\"background:#34C759\"></i>Very Good</td><td><b>776 - 825</b></td></tr><tr><td><i style=\"background:#FFC107\"></i>Good</td><td><b>701 - 775</b></td></tr><tr><td><i style=\"background:#FF8C1A\"></i>Average</td><td><b>601 - 700</b></td></tr><tr><td><i style=\"background:#E02424\"></i>Needs Help</td><td><b>300 - 600</b></td></tr></table></li><li><b>Issue line:</b> \u201cIssue with your Credit Score? Raise an issue\u201d</li><li><b>Footer:</b> \u201cPowered by experian\u201d</li><li><b>Close icon:</b> (X) at the top right</li></ul></div></td><td rowspan=\"4\" class=\"dp\"><b>Credit Score Viewed:</b><ul><li>Yes</li><li>No</li></ul><br><b>Credit Score Viewed Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS</td><td rowspan=\"4\"><span class=\"tag ok\">Completed</span></td></tr>\n<tr><td class=\"shot\"><img class=\"icon\" src=\"prd-assets/f05-credit-icon.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Credit Score icon</p><p><b>Field Type:</b> Icon (top navigation, right corner)</p><p><b>Action:</b> On click, the system shall open the credit score pop up.</p></div></td></tr>\n<tr><td class=\"shot\"><img src=\"prd-assets/f06-raise-issue.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Raise an issue</p><p><b>Field Type:</b> Hyperlink</p><p><b>Action:</b> Shown as \u201cIssue with your Credit Score? Raise an issue\u201d. On click, the system shall open https://www.experian.com/help/dispute-credit/ in a new tab; the pop up stays open.</p></div></td></tr>\n<tr><td class=\"shot\"><img class=\"icon\" src=\"prd-assets/f06-close-credit.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> (X) Close icon</p><p><b>Field Type:</b> Icon</p><p><b>Action:</b> On click, the credit score pop up is closed and the customer stays on the same page.</p></div></td></tr>\n<tr id=\"sl-6.2\"><td rowspan=\"4\" class=\"sl\">6.2</td><td class=\"shot\"><img src=\"prd-assets/f05-profile.png\" alt=\"\"></td><td rowspan=\"4\">User clicking the Profile icon in the top navigation to view the profile or log out</td><td><p>The Profile icon is part of the top navigation (Sl. No 6). On click, the system shall open the Profiles pop up over the current page, showing the name fetched from the PAN records and the PAN Number, with the Logout CTA.</p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Title:</b> \u201cProfiles\u201d</li><li><b>Profile card:</b> Initial letter of the name, the name as per PAN (e.g. AZHAGARSAMY SUBBURAJ) and the PAN Number (e.g. CBOPA8195B), with a tick</li><li><b>CTA:</b> \u201cLogout\u201d with the logout icon</li><li><b>Close icon:</b> (X) at the top right</li></ul></div></td><td rowspan=\"4\" class=\"dp\"><b>Profile Viewed:</b><ul><li>Yes</li><li>No</li></ul><br><b>Profile Viewed Date &amp; Time:</b><br>DD-MMM-YYYY; HH:MM:SS</td><td rowspan=\"4\"><span class=\"tag ok\">Completed</span></td></tr>\n<tr><td class=\"shot\"><img class=\"icon\" src=\"prd-assets/f05-profile-icon.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Profile icon</p><p><b>Field Type:</b> Icon (top navigation, right corner)</p><p><b>Action:</b> On click, the system shall open the Profiles pop up.</p></div></td></tr>\n<tr><td class=\"shot\"><img class=\"icon\" src=\"prd-assets/f06-logout-cta.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Logout</p><p><b>Field Type:</b> CTA</p><p><b>Action:</b> On click, the customer is logged out and lands on the Landing page (Sl. No 1).</p></div></td></tr>\n<tr><td class=\"shot\"><img class=\"icon\" src=\"prd-assets/f06-close-profile.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> (X) Close icon</p><p><b>Field Type:</b> Icon</p><p><b>Action:</b> On click, the profile pop up is closed and the customer stays on the same page.</p></div></td></tr>\n<tr id=\"sl-6.3\"><td rowspan=\"3\" class=\"sl\">6.3</td><td class=\"shot\"><img src=\"prd-assets/f06-topnav-pan.png\" alt=\"\"></td><td rowspan=\"3\">Top navigation on the PAN Details page \u2013 logo and Logout</td><td><p>On the PAN Details page (Sl. No 4) only, the top navigation shows the Shriram Credit logo and the Logout icon. The Logout icon is shown directly in the top navigation (not inside the Profiles pop up). The Credit Score and Profile icons are not shown on this page; from Sl. No 5 onwards Logout is available inside the Profiles pop up (Sl. No 6.2).</p><div class=\"spec\"><p><b>Screen Content:</b></p><ul class=\"content-list\"><li><b>Left:</b> Shriram Credit logo</li><li><b>Right:</b> Logout icon</li></ul></div></td><td rowspan=\"3\" class=\"dp\">No data captured from this navigation</td><td rowspan=\"3\"><span class=\"tag ok\">Completed</span></td></tr>\n<tr><td class=\"shot\"><img class=\"icon\" src=\"prd-assets/f06-logo.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Shriram Credit logo</p><p><b>Field Type:</b> Image (top navigation, left corner)</p><p><b>Action:</b> Display only.</p></div></td></tr>\n<tr><td class=\"shot\"><img class=\"icon\" src=\"prd-assets/f06-logout-icon.png\" alt=\"\"></td><td><div class=\"spec\"><p><b>Field Name:</b> Logout</p><p><b>Field Type:</b> Icon (top navigation, right corner)</p><p><b>Action:</b> On click, the customer is logged out and lands on the Landing page (Sl. No 1).</p><p><b>Condition:</b> Shown only on the PAN Details page (Sl. No 4).</p></div></td></tr>\n</tbody></table>\n<h2>Integration Requirements<span class=\"info\" tabindex=\"0\" aria-label=\"How to read the columns\" onclick=\"event.preventDefault()\">i<span class=\"info-pop\" role=\"tooltip\"><b>How to read the columns</b><table><tr><th>ID</th><td>Reference number, so other parts of the PRD can point to it (e.g. \u201cSubmit OTP triggers INT-001\u201d)</td></tr><tr><th>Integration</th><td>Which external system is called</td></tr><tr><th>Purpose</th><td>Why the journey needs it</td></tr><tr><th>Trigger</th><td>The exact moment or button that makes the call happen</td></tr><tr><th>Input</th><td>Data the LOS sends to that system</td></tr><tr><th>Expected Output</th><td>Data the LOS gets back</td></tr><tr><th>Success Behaviour</th><td>What the customer experiences when the call works</td></tr><tr><th>Failure Behaviour</th><td>What happens if the call fails, times out or returns an error</td></tr></table></span></span></h2><table class=\"int\"><thead><tr><th>ID</th><th>Integration</th><th>Purpose</th><th>Trigger</th><th>Input</th><th>Expected Output</th><th>Success Behaviour</th><th>Failure Behaviour</th></tr></thead><tbody>\n<tr><td>INT-001</td><td>Experian</td><td>Retrieve credit information / credit score for evaluating loan offers</td><td>On successful OTP verification (Module 2), after the customer gives the Experian consent</td><td>Customer mobile number</td><td>Credit score / credit information <a class=\"pend-ref\" href=\"#P-09\" onclick=\"var t=document.getElementById('P-09');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Open pending clarification P-09\">Pending \u00b7 P-09</a></td><td>Customer proceeds to PAN Verification without waiting for the response</td><td><a class=\"pend-ref\" href=\"#P-07\" onclick=\"var t=document.getElementById('P-07');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Open pending clarification P-07\">Pending \u00b7 P-07</a></td></tr>\n<tr><td>INT-002</td><td>OTP Service Provider <a class=\"pend-ref\" href=\"#P-10\" onclick=\"var t=document.getElementById('P-10');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Open pending clarification P-10\">Pending \u00b7 P-10</a></td><td>Send and verify the 6 digit OTP for the MF linked mobile number</td><td>Continue CTA on Module 1; Resend OTP CTA on Module 2</td><td>Mobile number</td><td>OTP sent / verification result</td><td>Customer proceeds to PAN Verification</td><td><a class=\"pend-ref\" href=\"#P-02\" onclick=\"var t=document.getElementById('P-02');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Open pending clarification P-02\">Pending \u00b7 P-02</a> <a class=\"pend-ref\" href=\"#P-10\" onclick=\"var t=document.getElementById('P-10');if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Open pending clarification P-10\">Pending \u00b7 P-10</a></td></tr>\n</tbody></table>\n<h2>Pending Clarifications<span class=\"count wip\">13</span><span class=\"info\" tabindex=\"0\" aria-label=\"How to read this list\" onclick=\"event.preventDefault()\">i<span class=\"info-pop\" role=\"tooltip\"><b>How to read this list</b><table><tr><th>ID</th><td>Reference number. Anything not yet decided elsewhere in the PRD carries an amber \u201cPending \u00b7 P-09\u201d badge that jumps to its row here</td></tr><tr><th>Module</th><td>Which part of the journey the question is about (\u201cAll\u201d means the whole journey)</td></tr><tr><th>Clarification Required</th><td>The question that must be answered before that requirement is final. Until then the related item stays TBD and must not be built on assumptions</td></tr><tr><th>When answered</th><td>The answer is written into the PRD and the question moves to Completed Clarifications below</td></tr></table></span></span></h2><table class=\"int\"><thead><tr><th style=\"width:70px\">ID</th><th style=\"width:110px\">Module</th><th>Clarification Required</th></tr></thead><tbody>\n<tr id=\"P-25\"><td>P-25</td><td>Curated Offers</td><td>Sl. No 16 \u2013 product card: (a) how the Credit Limit (X) is calculated \u2013 to be shared by the owner; (b) Processing Fee slabs at the boundaries: is a sanctioned limit of exactly \u20b9 10 lakh in the first slab (1% / \u20b9 999) or the second (0.8%), and exactly \u20b9 50 lakh in the second (0.8%) or the third (0.5%)? The PRD and prototype take \u20b9 10 lakh in the first and \u20b9 50 lakh in the second. (c) Is the fee rounded to the nearest rupee?</td></tr>\n<tr id=\"P-24\"><td>P-24</td><td>Modules 8 \u2013 10</td><td>Sl. No 17 \u2013 19.12 (Mutual Fund Selection, Loan Application Summary, KYC Verification) are written from the prototype screens. Please share the UAT screenshots and confirm: (a) when the ongoing application pop up (17.3) is shown; (b) messages for a loan amount or fund amount outside the limits (17.4, 17.5) and for an invalid email (19); (c) email OTP resend timer, attempts and wrong OTP message (19.2); (d) what is shown if the Aadhaar status is not received in time (19.11); (e) the Photo Verification and Bank Details steps (19.12 onwards).</td></tr>\n<tr id=\"P-23\"><td>P-23</td><td>Curated Offers</td><td>Sl. No 16 \u2013 16.3 are written from the prototype screens. Please share the UAT screenshots of the Curated Offers page, How is it calculated, the Refresh portfolio pop up and the drop off view, and confirm: (a) when the Refresh pop up is shown automatically, and whether Refresh Portfolio asks for an MF Central OTP before refreshing (the prototype refreshes in place and shows \u201cPortfolio refreshed successfully\u201d, as in the UAT screenshot of 12-10-2026); (b) what Discard does in the drop off view; (c) whether a returning customer always lands on the drop off view; (d) what the KFS document link on the product card opens; (e) how long each banner ticker message stays before the next one scrolls up (prototype: 3 seconds).</td></tr>\n<tr id=\"P-21\"><td>P-21</td><td>Module 4</td><td>Sl. No 7.1 (LOS page) \u2013 what exactly happens on Refresh (MF Central checked again and the redirection pop up shown again, or something else), and can the customer change the mobile number or PAN from here? (The MF Central OTP part of this question is answered \u2013 see P-22.)</td></tr>\n<tr id=\"P-20\"><td>P-20</td><td>Top Navigation</td><td>Sl. No 6.1 \u2013 credit score pop up when there is no valid score. Experian scores run from 300 to 900, so a score below 300 is not returned; instead the response can carry no score for (a) a customer with no or too little credit history (new to credit), (b) no record found for the mobile number / PAN, or (c) the Experian call failing or timing out. Please check on UAT (e.g. with a new-to-credit customer) or with the tech team what the live journey does in each case: is the Credit Score icon still shown, what does the pop up show (e.g. \u201cScore not available\u201d, a blank meter, or an error), and does the journey continue as normal?</td></tr>\n<tr id=\"P-18\"><td>P-18</td><td>Curated Offers</td><td>Curated Offers page: the 18 to 70 years age limit (from the DOB entered on the PAN Details page) is validated on this page, not on PAN Details, so customers outside the limit are not blocked at PAN verification and can be tracked. Message confirmed by the owner: \u201cApplicant must be between 18 to 70 years of age.\u201d (DISC-139). Still to confirm: where exactly on the Curated Offers page it is shown, and whether Start Application is blocked.</td></tr>\n<tr id=\"P-02\"><td>P-02</td><td>Module 1</td><td>Does the Continue CTA call an OTP send API at this point, and what is the failure behaviour?</td></tr>\n<tr id=\"P-03\"><td>P-03</td><td>Module 1</td><td>Any backend check on the mobile number at this stage (existing customer, ongoing application, blacklist)?</td></tr>\n<tr id=\"P-05\"><td>P-05</td><td>Module 2</td><td>Resend and wrong attempt blocks to be enforced server side against the mobile number (currently held in the prototype browser storage). Confirm reset conditions for the counters.</td></tr>\n<tr id=\"P-07\"><td>P-07</td><td>Module 2</td><td>Experian failure / timeout behaviour and the effect of the score on eligibility and offers.</td></tr>\n<tr id=\"P-08\"><td>P-08</td><td>All</td><td>Where should the header Shriram Credit logo navigate in the live journey (shriramcredit.in, the LAMF landing page, or nowhere)? The prototype sends it to its own review home page.</td></tr>\n<tr id=\"P-09\"><td>P-09</td><td>Module 2</td><td>Experian response (INT-001 Expected Output): what exactly comes back from Experian \u2013 only the credit score (e.g. 750), or the score plus the full credit report (existing loans, EMIs, missed payments, recent loan enquiries)? How should a \u201cNo record found\u201d response be handled for a customer with no credit history? Depends on the Experian service Shriram Credit has signed up for.</td></tr>\n<tr id=\"P-10\"><td>P-10</td><td>Module 1 & 2</td><td>OTP service provider (INT-002): which vendor sends and verifies the OTP, and what the customer sees if OTP verification fails or times out (a failure to send is covered in P-02).</td></tr>\n</tbody></table>\n<details class=\"done\"><summary><span class=\"done-title\">Completed Clarifications<span class=\"count ok\">12</span></span><span class=\"info\" tabindex=\"0\" aria-label=\"How to read this list\" onclick=\"event.preventDefault()\">i<span class=\"info-pop\" role=\"tooltip\"><b>How to read this list</b><table><tr><th>ID</th><td>Reference number of the question (kept when a pending item is answered)</td></tr><tr><th>Module</th><td>Which part of the journey the question was about</td></tr><tr><th>Clarification Required</th><td>The question that was asked</td></tr><tr><th>Clarification Provided</th><td>The confirmed answer and the date it was given. The modules above already follow it</td></tr></table></span></span><span class=\"chev\" aria-hidden=\"true\"></span></summary><table class=\"int\"><thead><tr><th style=\"width:70px\">ID</th><th style=\"width:110px\">Module</th><th>Clarification Required</th><th>Clarification Provided</th></tr></thead><tbody>\n<tr id=\"P-22\"><td>P-22</td><td>Module 5</td><td>Sl. No 10 \u2013 MF Central Fetching Your Portfolio screen: the screenshot is shared (DISC-160); please confirm what is shown if the fetch fails or times out, and where the customer goes from there. Also: wrong OTP message and attempts on the MF Central OTP page (was P-21 b).</td><td>The MF Central pages (OTP, Select AMCs, Fetching, Portfolio Discovery Complete) belong to MF Central; the LOS has no access to them. Their behaviour, including failures and wrong OTP handling, is MF Central\u2019s; any functional issue is raised to MF Central by mail (DISC-161).<span class=\"answered\">Answered 09-10-2026</span></td></tr>\n<tr id=\"P-19\"><td>P-19</td><td>Module 4</td><td>Sl. No 5 \u2013 LOS to MF Central consent page: the row is written from the prototype screen. Please share the UAT screenshots so the screenshot and field crops can be replaced, and confirm what the Dashboard and Profile icons (top right) do on this page.</td><td>UAT screenshots shared (DISC-142). Credit Score icon opens the credit score pop up (score from Experian, fetched date, category, Raise an issue link to Experian, close); Profile icon opens the Profiles pop up (name as per PAN, PAN Number, Logout to the Landing page, close).<span class=\"answered\">Answered 07-10-2026</span></td></tr>\n<tr id=\"P-16\"><td>P-16</td><td>Module 2</td><td>Experian consent checkbox: the UAT screenshots shared on 30-09-2026 (uatlamf.shriramcredit.in) show the Enter OTP pop up without the Experian consent checkbox, and Submit OTP turns yellow as soon as 6 digits are entered. Sl. No 3 describes the checkbox as mandatory. Confirm whether the checkbox is part of the live journey.</td><td>The checkbox is displayed only when the customer verifies the OTP for the first time. A customer who has already verified the OTP earlier sees the Enter OTP pop up without the checkbox, and Submit OTP is enabled once all 6 digits are entered (DISC-129).<span class=\"answered\">Answered 05-10-2026</span></td></tr>\n<tr id=\"P-17\"><td>P-17</td><td>Module 3</td><td>PAN Details page: the exact live text for (a) a PAN Number not in the ABCDE1234F format, and (b) the PAN verification failures \u2013 name match below 60%, DOB not matching the PAN records, PAN not available. Also: where does the customer land after Logout?</td><td>Live: one common message \u201cPAN verification failed\u201d for every verification failure (DISC-126). The owner set the required messages (DISC-125): empty fields \u2013 CR-10; PAN with fewer than 10 characters \u2013 \u201cPlease enter your valid PAN Number.\u201d (CR-16); name match below 60% \u2013 \u201cPlease enter your name exactly as on your PAN card.\u201d (CR-13); DOB not matching \u2013 \u201cPlease enter your date of birth exactly as on your PAN card.\u201d (CR-15); PAN not available \u2013 \u201cPlease enter your PAN Number exactly as on your PAN card.\u201d (CR-17). Logout lands on the Landing page (exit page).<span class=\"answered\">Answered 05-10-2026</span></td></tr>\n<tr id=\"P-11\"><td>P-11</td><td>Module 2</td><td>OTP length, resend timer duration and number of resends allowed.</td><td>6 digit OTP; 30 second resend timer; 3 resends allowed, after which the number is blocked for 15 minutes. OTP validity: 30 seconds (see P-04).<span class=\"answered\">Answered 23-09-2026</span></td></tr>\n<tr id=\"P-12\"><td>P-12</td><td>Module 2</td><td>Wrong OTP handling \u2013 message, maximum attempts and lockout.</td><td>A validation message is shown for a wrong OTP; after 3 wrong attempts the number is blocked for 60 minutes.<span class=\"answered\">Answered 23-09-2026</span></td></tr>\n<tr id=\"P-13\"><td>P-13</td><td>Module 2</td><td>Is the Experian consent checkbox mandatory to submit the OTP?</td><td>Yes. Submit OTP is enabled only when the consent is ticked and all 6 digits are entered.<span class=\"answered\">Answered 23-09-2026</span></td></tr>\n<tr id=\"P-14\"><td>P-14</td><td>Module 2</td><td>What does the \u201cEdit\u201d link on the OTP screen do?</td><td>Returns to the mobile number screen (02) with the entered number prefilled.<span class=\"answered\">Answered 23-09-2026</span></td></tr>\n<tr id=\"P-15\"><td>P-15</td><td>Module 2</td><td>Which screen opens after a successful OTP submission?</td><td>Enter PAN Details (screen 04), after the Experian call is triggered.<span class=\"answered\">Answered 23-09-2026</span></td></tr>\n<tr id=\"P-01\"><td>P-01</td><td>Module 1</td><td>Validation message wording: the shared sample PRD carries \u201c*Required\u201d, \u201c*Invalid mobile number\u201d and \u201cError: Invalid phone number\u201d. The messages currently built follow the wording confirmed in discussion on 22-09-2026. Confirm which set is approved.</td><td>Use the new validation wording given by the owner. The PRD row shows the current live messages; the new wording is tracked as <a class=\"todo-ref\" href=\"#CR-01\" onclick=\"var t=document.getElementById('CR-01');if(t){var d=t.closest('details');if(d)d.open=true;t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Defined in the PRD, not yet changed in the live LOS journey \u2013 open CR-01\">To be changed \u00b7 CR-01</a> <a class=\"todo-ref\" href=\"#CR-02\" onclick=\"var t=document.getElementById('CR-02');if(t){var d=t.closest('details');if(d)d.open=true;t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Defined in the PRD, not yet changed in the live LOS journey \u2013 open CR-02\">To be changed \u00b7 CR-02</a> <a class=\"todo-ref\" href=\"#CR-03\" onclick=\"var t=document.getElementById('CR-03');if(t){var d=t.closest('details');if(d)d.open=true;t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash')}return false\" title=\"Defined in the PRD, not yet changed in the live LOS journey \u2013 open CR-03\">To be changed \u00b7 CR-03</a> <a class=\"todo-ref\" href=\"#CR-04\" onclick=\"var t=document. <script>
  function route() {
    var name = decodeURIComponent(location.hash.replace(/^#/, ''));
    if (name.split('/')[0] === 'PRD' && window.PRD_HTML) {
      LAMF.renderPRD(window.PRD_HTML);
      var row = name.split('/')[1], t = row && document.getElementById(row);   // #PRD/sl-5 opens that row (DISC-153)
      if (t) setTimeout(function () { t.scrollIntoView({ block: 'start' }); t.classList.add('flash'); }, 60);
      return;
    }
    var fn = window.SCREEN_RENDER[name];
    if (fn) { fn(); return; }
    if (name === 'SCREENS') { LAMF.render(window.SCREENS_HTML, { bodyClass: 'page-screens' }); return; }
    if (name === 'COMMS') { LAMF.render(window.COMMS_HTML, { bodyClass: 'page-screens' }); document.body.classList.add('page-comms'); return; }
    LAMF.render(window.HOME_HTML, { bodyClass: 'page-home' });
  }
  window.addEventListener('hashchange', route);
  route();
</script>
